name: R18.00 activation validation
on:
  workflow_dispatch:
    inputs:
      admitted_commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADMITTED_COMMIT: ${{ inputs.admitted_commit }}
      ZXUX_SOURCE_EPOCH: rev18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.admitted_commit }}
      - name: Validate exact R18 activation state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ADMITTED_COMMIT"
          test "$(git rev-parse refs/tags/PHASE-11-COMPLETE)" = 263a203da3d54a398e8ac011284ae4195b1279c0
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV17.md | awk '{print $1}')" = d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV08.md | awk '{print $1}')" = 97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV18.md | awk '{print $1}')" = b13c551f854cf3c01d951212916c6cf787f23617e3b8b74fc7c1867f76ba2156
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV09.md | awk '{print $1}')" = 9ff614ba04721961b3461d03638586260b91e9e82eac7687054ead1c9802869f
          test -z "$(git ls-files | grep -Ei '(^|/)(P12(\.|/)|p12[^/]*(qualification|activation|dispatch)|phase-?12)' | grep -Ev '^(docs|scratch)/' || true)"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_media_retention.py
          python3 tools/check_phase11_evidence.py --require-active
          python3 v1/tools-host/test-driver/evidence.py v1/dist/certification/R18.00.result.json
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Revalidate R18 bridge at admitted head
        run: |
          set -euo pipefail
          tmp=/tmp/zxux-r18-activation
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step R18.00 --evidence-dir "$tmp"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step R18.00 --evidence-dir "$tmp"
          test -z "$(git status --porcelain)"
          echo "ZX-UX R18.00 ACTIVATION VALIDATION PASS"
