name: P11.01 DOCX repair artifact once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1101-docx-repair-artifact-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Build deterministic repaired DOCX
        run: |
          set -euo pipefail
          out=/tmp/p1101-docx-patch
          mkdir -p "$out"
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          src=Path("docs/04-C48 Language Specification Rev 0.11.docx")
          dst=Path("/tmp/p1101-docx-patch/04-C48 Language Specification Rev 0.11.docx")
          replacements=[
              (b"ZX-UX-ARCHITECTURE-REV11.md",b"ZX-UX-ARCHITECTURE-REV17.md"),
              (b"ZX-UX-IMPLEMENTATION-STEPS-REV02.md",b"ZX-UX-IMPLEMENTATION-STEPS-REV08.md"),
              (b"Revision 11",b"Revision 17"),
              (b"Revision-11",b"Revision-17"),
              (b"REV11",b"REV17"),
              (b"Revision 02",b"Revision 08"),
              (b"Revision-02",b"Revision-08"),
              (b"REV02",b"REV08"),
          ]
          counts={a.decode():0 for a,_ in replacements}
          with zipfile.ZipFile(src,"r") as zin, zipfile.ZipFile(dst,"w") as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename.startswith("word/") and info.filename.endswith(".xml"):
                      for a,b in replacements:
                          n=data.count(a)
                          counts[a.decode()]+=n
                          data=data.replace(a,b)
                  zout.writestr(info,data)
          def visible(path):
              chunks=[]
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if name.startswith("word/") and name.endswith(".xml"):
                          try: root=ET.fromstring(z.read(name))
                          except ET.ParseError: continue
                          chunks.extend(n.text or "" for n in root.iter() if n.tag.endswith("}t"))
              return " ".join(chunks)
          t=visible(dst)
          stale=[p for p in ("REV11","Revision 11","Revision-11","REV02","Revision 02","Revision-02") if re.search(re.escape(p),t,re.I)]
          if stale: raise SystemExit(f"stale authority references remain: {stale}")
          if "REV17" not in t or "REV08" not in t: raise SystemExit("current authority references absent")
          print("REPLACEMENT_COUNTS",counts)
          print("SOURCE_SHA256",hashlib.sha256(src.read_bytes()).hexdigest())
          print("PATCHED_SHA256",hashlib.sha256(dst.read_bytes()).hexdigest())
          print("PATCHED_SIZE",dst.stat().st_size)
          Path("/tmp/p1101-docx-patch/visible-text.txt").write_text(t,encoding="utf-8")
          PY
      - name: Upload repaired DOCX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p1101-docx-repair-artifact-${{ github.run_id }}
          path: /tmp/p1101-docx-patch/
          retention-days: 7
          if-no-files-found: error
      - name: Remove one-shot helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1101-docx-repair-artifact-once.yml
          git commit -m "cleanup: remove P11.01 DOCX repair artifact helper"
          git push origin HEAD:main
