name: P4.33 Phase 4 aggregate qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p433-qualification
      P433_BASE: 7c67cfc4e2035a00d5172467a9aea601f7582d20
      ZXUX_REV16_SHA256: 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
      ZXUX_REV07_SHA256: 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}

      - name: Guard exact P4.33 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P433_BASE" HEAD | sort > /tmp/p433-changed
          printf '%s\\n'             .github/workflows/p433-dispatch-once.yml             .github/workflows/p433-qualification.yml             .github/workflows/phase4-finalization.yml             tools/check_phase4_evidence.py             tools/finalize_phase4_evidence.py             tools/test_phase4_evidence_negative.py             v1/tools-host/test-driver/phase4_acceptance.py             v1/tools-host/test-driver/run.py | sort > /tmp/p433-expected
          diff -u /tmp/p433-expected /tmp/p433-changed
          git diff --check "$P433_BASE" HEAD
          test -z "$(git status --porcelain)"

      - name: Three unchanged candidate scans
        run: |
          set -euo pipefail
          baseline=""
          tree="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            python3 -m py_compile               v1/tools-host/test-driver/phase4_acceptance.py               v1/tools-host/test-driver/run.py               tools/check_phase4_evidence.py               tools/finalize_phase4_evidence.py               tools/test_phase4_evidence_negative.py
            find v1/tools-host/test-driver tools -type d -name __pycache__ -prune -exec rm -rf {} +
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            digest="$(sha256sum               v1/tools-host/test-driver/phase4_acceptance.py               v1/tools-host/test-driver/run.py               tools/check_phase4_evidence.py               tools/finalize_phase4_evidence.py               tools/test_phase4_evidence_negative.py               .github/workflows/p433-dispatch-once.yml               .github/workflows/p433-qualification.yml               .github/workflows/phase4-finalization.yml               v1/dist/certification/P4.32.test.json | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
            echo "SCAN-$scan: CLEAN"
          done

      - name: Mandatory gates
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "$ZXUX_REV16_SHA256"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "$ZXUX_REV07_SHA256"
          test "$(sha256sum tools/manifest/toolchain.lock.json | awk '{print $1}')" = "$ZXUX_TOOLCHAIN_LOCK_SHA256"
          test -s v1/dist/certification/P4.32.test.json
          grep -q '"status": "PASS"' v1/dist/certification/P4.32.test.json
          grep -q '"source_commit": "9d01f2eef9aaa32b80c960b58e6f0736891ea00e"' v1/dist/certification/P4.32.test.json
          python3 tools/check_phase4_evidence.py

      - uses: actions/setup-python@v6
        with: {python-version: '3.13.15', check-latest: false}

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config

      - name: Acquire pinned runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Recheck E0.05 repository policy
        run: |
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step E0.05 --evidence-dir /tmp/zxux-p433-e005
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step E0.05 --evidence-dir /tmp/zxux-p433-e005

      - name: Execute P4.33 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P4.33

      - name: Execute P4.33 aggregate test
        run: |
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P4.33
          test -s "$ZXUX_EVIDENCE_DIR/P4.33.result.json"
          grep -q '"status": "PASS"' "$ZXUX_EVIDENCE_DIR/P4.33.result.json"
          grep -q 'ZX-UX PHASE 4 ACCEPTANCE PASS' "$ZXUX_EVIDENCE_DIR/P4.33.result.json"

      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR/meta"
          git rev-parse HEAD > "$ZXUX_EVIDENCE_DIR/meta/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$ZXUX_EVIDENCE_DIR/meta/candidate-tree.txt"
          git status --porcelain > "$ZXUX_EVIDENCE_DIR/meta/worktree-status.txt"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p433-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p433-qualification/
          retention-days: 90
          if-no-files-found: error
