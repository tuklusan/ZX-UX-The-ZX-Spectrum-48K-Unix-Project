name: P3.18 three-stage pipeline qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p318-qualification.yml
      - v1/tests/multiprocessing/pipe3.asm
      - v1/tools-host/test-driver/phase3_pipe3.py
      - v1/tools-host/test-driver/run.py
      - v1/src/kernel/pipe.asm
      - v1/src/kernel/process.asm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p318-qualification
      P318_EXACT_PARENT: c27a790169967e9edb0ea26e42c924841675541a
      ZXUX_REV16_SHA256: 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
      ZXUX_REV07_SHA256: 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact P3.18 candidate diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P318_EXACT_PARENT}"
          git diff --name-only HEAD^ HEAD | sort > /tmp/p318-changed
          printf '%s\n' .github/workflows/p318-qualification.yml | sort > /tmp/p318-expected
          diff -u /tmp/p318-expected /tmp/p318-changed
          test -z "$(git status --porcelain)"
          echo "qualification_head=$(git rev-parse HEAD)"
          echo "qualification_parent=$(git rev-parse HEAD^)"

      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          tree_baseline="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            git diff --check HEAD^^ HEAD
            python3 -m py_compile v1/tools-host/test-driver/phase3_pipe3.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'EMIT_SPAWN_TRANSACTION_ROUTINES' v1/tests/multiprocessing/pipe3.asm
            grep -q 'EMIT_PIPE_ROUTINES' v1/tests/multiprocessing/pipe3.asm
            grep -q 'EMIT_PARENT_CHILD_ROUTINES' v1/tests/multiprocessing/pipe3.asm
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "${tree_baseline}"
            digest="$(
              sha256sum                 v1/tests/multiprocessing/pipe3.asm                 v1/tools-host/test-driver/phase3_pipe3.py                 v1/tools-host/test-driver/run.py                 .github/workflows/p318-qualification.yml                 | sha256sum | awk '{print $1}'
            )"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
            echo "scan_${scan}_tree=${tree_baseline}"
          done

      - name: Mandatory license and project-policy gates
        run: |
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Require active authorities and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "${ZXUX_REV16_SHA256}"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "${ZXUX_REV07_SHA256}"
          test -s v1/dist/certification/R16.00.result.json
          test -s v1/dist/certification/P3.17.test.json
          grep -q '"status": "PASS"' v1/dist/certification/R16.00.result.json
          grep -q '"status": "PASS"' v1/dist/certification/P3.17.test.json

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake gettext libaudiofile-dev libfreetype6-dev             libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool             libxml2-dev perl pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P3.18 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P3.18             2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P3.18.build.log"

      - name: Execute P3.18 test
        shell: bash
        run: |
          set -o pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P3.18             2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P3.18.test.log"

      - name: Collect exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${ZXUX_EVIDENCE_DIR}/candidate-tree.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          sha256sum             v1/tests/multiprocessing/pipe3.asm             v1/tools-host/test-driver/phase3_pipe3.py             v1/tools-host/test-driver/run.py             .github/workflows/p318-qualification.yml             > "${ZXUX_EVIDENCE_DIR}/qualification-hashes.sha256"
          for path in             v1/dist/certification/P3.18.build.json             v1/dist/certification/P3.18.test.json             v1/build/kernel.bin             v1/build/p318-pipe3.bin             v1/build/p318-pipe3.sym; do
            if test -f "${path}"; then cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"; fi
          done

      - name: Upload P3.18 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p318-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p318-qualification/
          retention-days: 90
          if-no-files-found: error
