name: P2.18 prerequisite provenance repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-activation-admit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P218_EXACT_PARENT: 8f17074478b6724f2e2dc79fe0248f757f1c0321
      P218_BAD_DOCX_BLOB: 89309d86a6fe9ce7c4a05f024388c40f6792d120
      P218_APPROVED_DOCX_BLOB: f1c4877b26c632bd0b9abd0468716019da68bf7e
      P218_APPROVED_DOCX_SOURCE: 741652ab4a78f170d2e9b598a7ec9ccd8e70a1d7
      P218_DOCX_PATH: docs/04-C48 Language Specification Rev 0.11.docx
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-prerequisite-repair

    steps:
      - name: Checkout exact repair parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard authority and diagnosed provenance defect
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-activation-admit.yml"
          test "$(git rev-parse HEAD:"${P218_DOCX_PATH}")" = "${P218_BAD_DOCX_BLOB}"
          test "$(git rev-parse "${P218_APPROVED_DOCX_SOURCE}:${P218_DOCX_PATH}")" = "${P218_APPROVED_DOCX_BLOB}"
          grep -Fq "readonly C48_SPEC_DOCX_BLOB_SHA1=\"${P218_APPROVED_DOCX_BLOB}\"" tools/check_license_headers.sh
          grep -Fq 'REV12 / REV03 remain the active authority through completion of Phase 2.' docs/--W-A-R-N-I-N-G--.md
          grep -Fq 'REV13 / REV04 may exist in the repository as dormant prospective authorities.' docs/--W-A-R-N-I-N-G--.md
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Assemble exact provenance repair candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore --source="${P218_APPROVED_DOCX_SOURCE}" --staged --worktree -- "${P218_DOCX_PATH}"
          git rm .github/workflows/p218-activation-admit.yml
          test "$(git hash-object -- "${P218_DOCX_PATH}")" = "${P218_APPROVED_DOCX_BLOB}"
          expected="$(printf '%s\n' .github/workflows/p218-activation-admit.yml "${P218_DOCX_PATH}" | sort)"
          test "$(git diff --cached --name-only | sort)" = "${expected}"
          git diff --quiet

      - name: Run three clean repair scans and mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' .github/workflows/p218-activation-admit.yml "${P218_DOCX_PATH}" | sort)"
          baseline=""
          for scan in 1 2 3; do
            echo "P2.18 prerequisite repair SCAN-${scan}: CLEAN candidate check"
            test "$(git diff --cached --name-only | sort)" = "${expected}"
            git diff --quiet
            test "$(git hash-object -- "${P218_DOCX_PATH}")" = "${P218_APPROVED_DOCX_BLOB}"
            test "$(git rev-parse HEAD:docs/01-ZX-UX-ARCHITECTURE-REV12.md)" = "$(git rev-parse HEAD^:docs/01-ZX-UX-ARCHITECTURE-REV12.md)"
            test "$(git rev-parse HEAD:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV03.md)" = "$(git rev-parse HEAD^:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV03.md)"
            test "$(git rev-parse HEAD:docs/01-ZX-UX-ARCHITECTURE-REV13.md)" = "$(git rev-parse HEAD^:docs/01-ZX-UX-ARCHITECTURE-REV13.md)"
            test "$(git rev-parse HEAD:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV04.md)" = "$(git rev-parse HEAD^:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV04.md)"
            git diff --cached --check
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            digest="$(git diff --cached --binary | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
          done

      - name: Commit exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZX-UX P2.18 repair runner"
          git config user.email "tuklusan@users.noreply.github.com"
          git commit -m "docs: restore approved C48 specification bytes"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:"${P218_DOCX_PATH}")" = "${P218_APPROVED_DOCX_BLOB}"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/workflows/p218-activation-admit.yml "${P218_DOCX_PATH}" | sort)"

      - name: Recheck mandatory gates on exact repair commit
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"

      - name: Push exact repair if main has not moved
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${remote}" = "${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Collect repair evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse HEAD^ > "${ZXUX_EVIDENCE_DIR}/workflow-commit.txt"
          git hash-object -- "${P218_DOCX_PATH}" > "${ZXUX_EVIDENCE_DIR}/docx-blob.txt" 2>/dev/null || true
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/status.txt"

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-prerequisite-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-prerequisite-repair/
          retention-days: 90
          if-no-files-found: warn
