name: ZX-UX P1.13 Candidate Publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-13-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact publisher staging commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and verify reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          import re

          source = Path('.github/workflows/p1-13-materialize.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if 'p1-13.patch.b64' in line and "<<'PAYLOAD'" in line)
          payload = []
          for line in source[start + 1:]:
              token = line.strip()
              if token == 'PAYLOAD':
                  break
              if not re.fullmatch(r'[A-Za-z0-9+/=]+', token):
                  raise SystemExit(f'invalid payload line: {token!r}')
              payload.append(token)
          else:
              raise SystemExit('PAYLOAD terminator missing')
          packed = base64.b64decode(''.join(payload), validate=True)
          Path('/tmp/p1-13.patch').write_bytes(gzip.decompress(packed))
          PY
          git apply --check /tmp/p1-13.patch
          git apply /tmp/p1-13.patch
          cat > "$RUNNER_TEMP/p1-13.sha256" <<'HASHES'
          7e1bfdbe5dc4840b43465687398577a3089c3da705bf1183666647b5cf780de6  v1/src/kernel/console.asm
          cb8ceea7043472803f6e7ee20bdbb8af6c2f92c0704d5c2375dffab4d8fad858  v1/src/kernel/errors.asm
          1287064ad6602130944b3a41af021400515bc77fe7a4ecfa15b1a149b8024129  v1/src/kernel/interrupt.asm
          bbb7cb28b61424307d3e22469a005483f6f562bd27bf9687433a8f889bc1eae5  v1/tools-host/test-driver/phase1_gate.py
          bd29d5deda2b1806c7bdd61cca9dc66384da9bc7b59c4d98c3acdd45840b29d9  v1/tools-host/test-driver/run.py
          8e502242b7dce8e7bb8b1ad614c2f753dc46db1bc037930d79bbf812717c5470  v1/tools-host/test-driver/phase1_ticks.py
          HASHES
          sed -i 's/^          //' "$RUNNER_TEMP/p1-13.sha256"
          sha256sum -c "$RUNNER_TEMP/p1-13.sha256"
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'v1/src/kernel/console.asm',
              'v1/src/kernel/errors.asm',
              'v1/src/kernel/interrupt.asm',
              'v1/tools-host/test-driver/phase1_gate.py',
              'v1/tools-host/test-driver/run.py',
              'v1/tools-host/test-driver/phase1_ticks.py',
          }
          rows = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          actual = {row[3:] for row in rows if row}
          if actual != expected:
              raise SystemExit(f'unexpected candidate path set: {sorted(actual)}')
          PY
          ./tools/check_license_headers.sh
          python3 ./tools/check_project_policy.py

      - name: Publish source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/src/kernel/console.asm \
                  v1/src/kernel/errors.asm \
                  v1/src/kernel/interrupt.asm \
                  v1/tools-host/test-driver/phase1_gate.py \
                  v1/tools-host/test-driver/run.py \
                  v1/tools-host/test-driver/phase1_ticks.py
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "phase1: instrument P1.13 tick producer"
          git push origin HEAD:main
