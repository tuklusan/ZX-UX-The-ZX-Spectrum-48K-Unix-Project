name: Phase-6 aggregate activation

on:
  workflow_dispatch:
    inputs:
      admitted_commit:
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMITTED_COMMIT: ${{ inputs.admitted_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Guard exact preactivation state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_COMMIT"
          test ! -e v1/dist/certification/phase-6.json
          test -f v1/dist/certification/P6.30.result.json
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase5_evidence.py --require-active
          python3 tools/check_media_retention.py
          python3 tools/check_phase6_evidence.py
          python3 tools/test_phase6_evidence_negative.py
      - name: Finalize exact Phase-6 aggregate
        run: |
          set -euo pipefail
          python3 tools/finalize_phase6_evidence.py --root . --output /tmp/phase-6.json
          cp /tmp/phase-6.json v1/dist/certification/phase-6.json
          source_commit="$(python3 - <<'PY'
          import json
          print(json.load(open("v1/dist/certification/P6.30.result.json"))["source_commit"])
          PY
          )"
          git add v1/dist/certification/phase-6.json
          test "$(git diff --cached --name-only)" = "v1/dist/certification/phase-6.json"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase6: activate Phase-6 aggregate evidence for $source_commit"
          git push origin HEAD:main
      - name: Dispatch aggregate validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({"ref":"main"}).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/phase6-finalization.yml/dispatches",
              data=payload,method="POST",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status!=204: raise SystemExit(f"aggregate validation dispatch failed: {r.status}")
          PY
