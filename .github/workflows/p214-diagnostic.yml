name: P2.14 diagnostic candidate

on:
  push:
    branches:
      - p214-diag1

permissions:
  contents: write

concurrency:
  group: p214-diag1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE_SHA: 0065149e25bd3d2afd1f315380722406ba9196ff
      ZXUX_EVIDENCE_DIR: /tmp/p214-evidence
    steps:
      - name: Checkout diagnostic instrumentation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preserve and validate candidate materializer
        shell: bash
        run: |
          set -euo pipefail
          cp .p214-worker/p214_candidate.py /tmp/p214_candidate.py
          test "$(git hash-object .p214-worker/p214_candidate.py)" = "$(git rev-parse HEAD:.p214-worker/p214_candidate.py)"
          python3 -m py_compile /tmp/p214_candidate.py

      - name: Materialize exact P2.14 candidate from certified P2.13 main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 /tmp/p214_candidate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("v1/src/kernel/process.asm")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8", newline="\n")
          PY
          git diff --check
          python3 -m py_compile \
            v1/tools-host/test-driver/phase2_zombie.py \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py
          expected=$'v1/src/kernel/process.asm\nv1/tools-host/test-driver/phase2_gate.py\nv1/tools-host/test-driver/phase2_zombie.py\nv1/tools-host/test-driver/run.py'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          printf 'P2.14 candidate paths:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --stat | tee /tmp/p214-diff-stat.txt
          git diff --unified=5 | tee /tmp/p214-candidate.patch
          sha256sum \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/phase2_gate.py \
            v1/tools-host/test-driver/phase2_zombie.py \
            v1/tools-host/test-driver/run.py | tee /tmp/p214-candidate-sha256.txt

      - name: License and policy preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Commit clean diagnostic candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Supratim Sanyal"
          git config user.email "tuklusan@users.noreply.github.com"
          git add -- \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/phase2_gate.py \
            v1/tools-host/test-driver/phase2_zombie.py \
            v1/tools-host/test-driver/run.py
          git commit -m "P2.14 candidate: resource-safe zombie transition"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected=$'v1/src/kernel/process.asm\nv1/tools-host/test-driver/phase2_gate.py\nv1/tools-host/test-driver/phase2_zombie.py\nv1/tools-host/test-driver/run.py'
          actual="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$candidate_sha" | tee /tmp/p214-candidate-commit.txt
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          git push --force origin HEAD:refs/heads/p214-candidate

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gettext libaudiofile-dev libfreetype6-dev \
            libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool \
            libxml2-dev perl pkg-config

      - name: Acquire and certify pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "P2.14 pinned-runtime bootstrap attempt ${attempt}/3"
            set +e
            python3 tools/scripts/bootstrap-environment.py 2>&1 | tee "/tmp/p214-bootstrap-attempt-${attempt}.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              success=1
              break
            fi
            echo "P2.14 pinned-runtime bootstrap attempt ${attempt} failed rc=${rc}"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          test "$success" -eq 1
          tools/runtime/python/bin/python tools/scripts/verify-environment.py 2>&1 | tee /tmp/p214-runtime-verify.log

      - name: Exact P2.14 target build and test
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          {
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.14
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.14
          } 2>&1 | tee /tmp/p214-target.log

      - name: Enforce exact target result
        if: steps.target.outcome == 'failure'
        run: exit 1

      - name: Dependent Phase 2 gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tools/runtime/python/bin/python v1/tools-host/test-driver/phase2_gate.py 2>&1 | tee /tmp/p214-phase2-gate.log

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          tar -C /tmp -czf /tmp/p214-evidence.tgz p214-evidence 2>/dev/null
          exit 0

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p214-diagnostic-${{ github.run_id }}
          path: |
            /tmp/p214-candidate-commit.txt
            /tmp/p214-candidate-sha256.txt
            /tmp/p214-candidate.patch
            /tmp/p214-diff-stat.txt
            /tmp/p214-bootstrap-attempt-*.log
            /tmp/p214-runtime-verify.log
            /tmp/p214-target.log
            /tmp/p214-phase2-gate.log
            /tmp/p214-evidence.tgz
          retention-days: 30
          if-no-files-found: warn
