name: ZX-UX H04 Tracker Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h04-tracker-close.yml'

permissions:
  contents: write

jobs:
  close-h04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Close H04 and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1

          readonly TRACKER='scratch/WORKFLOW.md'
          readonly TRACKER_PRE='8cb16a46ab67157b0b7a0969ef47b483794fb43e'
          readonly TRACKER_POST='fc56474c023f6be7a310c407aa56c06cecf22661'
          readonly ASSETS_TREE='0c363f650345696481070fba571be3a61e61111b'
          readonly REFERENCE_TREE='a4e06de3b8b193b43597cdb4d259b5b206e7e3ad'
          readonly SELF='.github/workflows/h04-tracker-close.yml'

          [[ "$(git rev-parse HEAD:$TRACKER)" == "$TRACKER_PRE" ]]
          [[ "$(git rev-parse HEAD:v1/assets)" == "$ASSETS_TREE" ]]
          [[ "$(git rev-parse HEAD:reference)" == "$REFERENCE_TREE" ]]

          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$(git rev-parse HEAD)" ]]

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scratch/WORKFLOW.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('### H04 — Import missing SDK compiler assets\n')
          end = text.index('### H05 — Standardize GitHub-hosted runners on ubuntu-latest\n')
          replacement = '''### H04 — Import missing SDK compiler assets

          - [x] Compared the read-only SDK `compiler/assets` scope pinned at source commit
            `1bebc6288a1cdfa1bdfb5a6694e1986b6c3d7ee0` / source tree
            `979039b5c636f0578f8bccd19ae49a669a5b7e0e` against canonical `v1/assets`
            pre-import tree `79207db22fff6f922b01ada15dc831b56a85351c`. The source contained 14 files;
            all 14 were missing and there were zero same-path conflicts, so no existing canonical
            asset was overwritten.
          - [x] Imported all 14 source files byte-for-byte in commit
            `c52f4eb4d52140510367674abce30873a6bef51c`. The resulting canonical `v1/assets`
            tree is exactly `0c363f650345696481070fba571be3a61e61111b`.
            `tools/check_license_headers.sh` binds the preserved SDK files to their exact pinned
            Git blob IDs and modes and fails closed on mutation.
          - [x] Importer run `34719541127` succeeded after staged CI and a deliberate negative
            mutation test. Temporary H04 transport automation was removed by cleanup commit
            `b5bee52eefe6a208bf1143d3277090d0e85a06c4`; final normal Quality/CI run
            `34719595619` on the cleaned canonical tree succeeded. The SDK source repository
            remained read-only; only the canonical ZX-UX repository was modified.

          '''
          replacement = ''.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines(keepends=True)
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          [[ "$(git hash-object "$TRACKER")" == "$TRACKER_POST" ]]
          git rm -- "$SELF"
          git add -- "$TRACKER"

          cat > "$RUNNER_TEMP/h04-close.expected" <<'EOF_EXPECTED'
          D	.github/workflows/h04-tracker-close.yml
          M	scratch/WORKFLOW.md
          EOF_EXPECTED
          sed -i 's/^          //' "$RUNNER_TEMP/h04-close.expected"
          git diff --cached --name-status > "$RUNNER_TEMP/h04-close.actual"
          diff -u "$RUNNER_TEMP/h04-close.expected" "$RUNNER_TEMP/h04-close.actual"

          git config user.name 'Supratim Sanyal'
          git config user.email 'tuklusan@users.noreply.github.com'
          git commit -m 'tracker: close H04 SDK asset import'
          git push origin HEAD:main
