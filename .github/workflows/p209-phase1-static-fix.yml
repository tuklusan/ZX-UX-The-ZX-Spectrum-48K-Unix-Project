name: P2.09 Phase1 Static Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p209-phase1-static-fix.yml

permissions:
  contents: write

concurrency:
  group: zxux-p209-phase1-static-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair P1.27 static source boundary for staged validator emitter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v1/tools-host/test-driver/phase1_time.py')
          text = p.read_text(encoding='utf-8')
          old = '    block = _block(syscall, "zx48_sys_time_set:", "zx48_user_range_validate:")\n'
          new = '    block = _block(syscall, "zx48_sys_time_set:", "emit_user_range_validation_routine")\n'
          if text.count(old) != 1:
              raise SystemExit('expected exact P1.27 static boundary not found once')
          p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          PYTHONPATH=v1/tools-host/test-driver python3 - <<'PY'
          from pathlib import Path
          import phase1_time
          failed = [item['name'] for item in phase1_time._contracts(Path('.')) if not item['passed']]
          if failed:
              raise SystemExit(f'P1.27 static contract still fails: {failed}')
          PY
          rm .github/workflows/p209-phase1-static-fix.yml
          git add -u
          git diff --cached --check
          ./tools/check_license_headers.sh
          python3 tools/check_project_policy.py

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Supratim Sanyal'
          git config user.email 'tuklusan@users.noreply.github.com'
          git commit -m 'Keep P1.27 static validation compatible with staged range emitter'
          git push origin HEAD:main
