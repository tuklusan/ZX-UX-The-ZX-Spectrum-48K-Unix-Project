name: P2.22 exact qualified promotion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p222-promote-qualified.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'P2.22 stage exact qualified promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_PROD_HEAD: fb637b84444d49f39317f0ec4b6e806c4b93453d
      PROCESS_BEFORE_BLOB: 935a3f5534bec968795c3a5d6f914e265c453359
      MEMORY_BEFORE_BLOB: 9f7607d1cb07c5612bd28323e88898f96f442486
      PROCESS_AFTER_BLOB: 15ebbdb485d789b4a450c8b0c8b79970baa940e8
      MEMORY_AFTER_BLOB: b96dcc68a5a155f7d4ea8252102ced30fa00f4d7
      PROCESS_AFTER_SHA256: ed4b11954900235ce44cd67577a24f917fbf89a700bae2092947bfd7b0a3dcd1
      MEMORY_AFTER_SHA256: 290e34e60b37f22bf89446b43e851a1d1ae0e087f09af801743937f734d9d4ab

    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard staging scope and production ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "${BASE_PROD_HEAD}"
          git diff --name-only "${BASE_PROD_HEAD}" "${GITHUB_SHA}" | sort > /tmp/p222-stage-changed
          printf '%s\n' .github/workflows/p222-promote-qualified.yml > /tmp/p222-stage-expected
          diff -u /tmp/p222-stage-expected /tmp/p222-stage-changed
          test "$(git rev-parse "HEAD:v1/src/kernel/process.asm")" = "${PROCESS_BEFORE_BLOB}"
          test "$(git rev-parse "HEAD:v1/src/kernel/memory.asm")" = "${MEMORY_BEFORE_BLOB}"
          test -z "$(git status --porcelain)"

      - name: Materialize exact prequalified production bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          process_path = Path('v1/src/kernel/process.asm')
          process = process_path.read_bytes()
          process_old = b'ZX48_P2_13_LINKS_EMITTED EQU 1'
          process_new = b'    DEFINE ZX48_P2_13_LINKS_EMITTED 1'
          process_state = (process.count(process_old), process.count(process_new))
          if process_state != (1, 0):
              raise SystemExit(f'P2.22 promotion fail-closed process state: {process_state!r}')
          process_path.write_bytes(process.replace(process_old, process_new, 1))

          memory_path = Path('v1/src/kernel/memory.asm')
          memory = memory_path.read_bytes()
          memory_old = (
              b'    xor a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          memory_new = (
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          memory_state = (memory.count(memory_old), memory.count(memory_new))
          if memory_state != (1, 0):
              raise SystemExit(f'P2.22 promotion fail-closed memory state: {memory_state!r}')
          memory_path.write_bytes(memory.replace(memory_old, memory_new, 1))
          PY
          test "$(git hash-object v1/src/kernel/process.asm)" = "${PROCESS_AFTER_BLOB}"
          test "$(git hash-object v1/src/kernel/memory.asm)" = "${MEMORY_AFTER_BLOB}"
          test "$(sha256sum v1/src/kernel/process.asm | awk '{print $1}')" = "${PROCESS_AFTER_SHA256}"
          test "$(sha256sum v1/src/kernel/memory.asm | awk '{print $1}')" = "${MEMORY_AFTER_SHA256}"
          git diff --name-only | sort > /tmp/p222-repair-changed
          printf '%s\n' v1/src/kernel/memory.asm v1/src/kernel/process.asm | sort > /tmp/p222-repair-expected
          diff -u /tmp/p222-repair-expected /tmp/p222-repair-changed

      - name: Three unchanged exact-byte scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git diff --check
            test "$(git hash-object v1/src/kernel/process.asm)" = "${PROCESS_AFTER_BLOB}"
            test "$(git hash-object v1/src/kernel/memory.asm)" = "${MEMORY_AFTER_BLOB}"
            test "$(sha256sum v1/src/kernel/process.asm | awk '{print $1}')" = "${PROCESS_AFTER_SHA256}"
            test "$(sha256sum v1/src/kernel/memory.asm | awk '{print $1}')" = "${MEMORY_AFTER_SHA256}"
            grep -Fqx '    DEFINE ZX48_P2_13_LINKS_EMITTED 1' v1/src/kernel/process.asm
            python3 - <<'PY'
          from pathlib import Path
          data = Path('v1/src/kernel/memory.asm').read_bytes()
          required = (
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          if data.count(required) != 1:
              raise SystemExit('P2.22 promotion allocator byte shape mismatch')
          PY
            digest="$(sha256sum v1/src/kernel/process.asm v1/src/kernel/memory.asm | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "PROMOTION-SCAN-${scan}: CLEAN ${digest}"
          done

      - name: Recheck mandatory project gates
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Commit exact production tree and remove promotion instrument
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p222-promote-qualified.yml
          git add v1/src/kernel/process.asm v1/src/kernel/memory.asm
          git diff --cached --check
          git diff --name-only "${BASE_PROD_HEAD}" | sort > /tmp/p222-final-changed
          printf '%s\n' v1/src/kernel/memory.asm v1/src/kernel/process.asm | sort > /tmp/p222-final-expected
          diff -u /tmp/p222-final-expected /tmp/p222-final-changed
          git -c user.name='Supratim Sanyal' \
              -c user.email='tuklusan@users.noreply.github.com' \
              commit -m 'P2.22 promote qualified composition and allocator repairs'
          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
          test "$(git rev-parse "HEAD:v1/src/kernel/process.asm")" = "${PROCESS_AFTER_BLOB}"
          test "$(git rev-parse "HEAD:v1/src/kernel/memory.asm")" = "${MEMORY_AFTER_BLOB}"
          git diff --name-only "${BASE_PROD_HEAD}" HEAD | sort > /tmp/p222-committed-changed
          diff -u /tmp/p222-final-expected /tmp/p222-committed-changed
          test -z "$(git status --porcelain)"

      - name: Fast-forward canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git push origin HEAD:main
