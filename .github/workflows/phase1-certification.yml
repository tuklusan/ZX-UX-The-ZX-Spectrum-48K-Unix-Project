# P2.24 exact-candidate retrigger after aggregate-gate repair.
name: ZX-UX Phase 1 Certification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase1-certification.yml
      - .github/phase1-certification.trigger
      - tools/manifest/toolchain.lock.json
      - tools/scripts/bootstrap-environment.py
      - tools/scripts/verify-environment.py
      - tools/finalize_phase1_evidence.py
      - v1/include/**
      - v1/src/boot/**
      - v1/src/kernel/**
      - v1/tools-host/test-driver/**
      - v1/dist/certification/**
      - '!**/*.md'
      - '!**/*.markdown'
      - '!**/*.mdown'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/*.asciidoc'
      - '!**/*.txt'
      - '!**/*.text'
      - '!**/*.rtf'
      - '!**/*.doc'
      - '!**/*.docx'
      - '!**/*.odt'
      - '!**/*.pdf'
      - '!**/*.tex'
      - '!**/*.epub'
      - '!**/*.html'
      - '!**/*.htm'
      - '!**/*.ppt'
      - '!**/*.pptx'
      - '!**/*.odp'
      - '!**/*.pages'
      - '!**/*.key'
      - '!LICENSE'
      - '!LICENSE.*'
      - '!COPYING'
      - '!COPYING.*'
      - '!NOTICE'
      - '!NOTICE.*'
      - '!CHANGELOG'
      - '!CHANGELOG.*'
      - '!CONTRIBUTING'
      - '!CONTRIBUTING.*'
      - '!AUTHORS'
      - '!AUTHORS.*'
      - '!docs/**'
      - '!scratch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zxux-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase1-evidence-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require active durable Phase 0 evidence
        run: python3 tools/check_phase0_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute registered Phase 1 gates
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/phase1_gate.py

      - name: Finalize Phase 1 aggregate evidence
        run: tools/runtime/python/bin/python tools/finalize_phase1_evidence.py --root "$GITHUB_WORKSPACE" --evidence-dir "$ZXUX_EVIDENCE_DIR"

      - name: Assert activation source still clean and current
        if: ${{ github.run_attempt > 1 }}
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install durable Phase 1 evidence unchanged
        if: ${{ github.run_attempt > 1 }}
        run: |
          rm -f v1/dist/certification/P1.*.json v1/dist/certification/phase-1.json
          cp "$ZXUX_EVIDENCE_DIR"/P1.*.json v1/dist/certification/
          cp "$ZXUX_EVIDENCE_DIR"/phase-1.json v1/dist/certification/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          src = Path(os.environ['ZXUX_EVIDENCE_DIR'])
          dst = Path('v1/dist/certification')
          expected = {
              *(f'P1.{n:02d}.{action}.json' for n in range(1, 42) for action in ('build', 'test')),
              'P1.41.result.json',
              'phase-1.json',
          }
          source_names = {p.name for p in src.glob('P1.*.json')} | {'phase-1.json'}
          assert source_names == expected, (sorted(source_names - expected), sorted(expected - source_names))
          for name in sorted(expected):
              source = src / name
              target = dst / name
              assert source.is_file() and target.is_file(), name
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(target.read_bytes()).digest(), name
          assert not (dst / 'phase1-gate-diagnostic.json').exists()
          print('ZX-UX PHASE 1 EVIDENCE COPY IDENTITY PASS')
          PY

      - name: Commit Phase 1 evidence only
        if: ${{ github.run_attempt > 1 }}
        run: |
          git add -A v1/dist/certification
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^v1/dist/certification/(P1\.[0-9][0-9]\.(build|test)\.json|P1\.41\.result\.json|phase-1\.json)$' || true)"
          test -z "$bad"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase1: activate Phase-1 certification evidence for $GITHUB_SHA"
          git push origin HEAD:main

      - name: Upload Phase 1 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-phase1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/zxux-phase1-evidence-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            /tmp/zxux-phase1-evidence-${{ github.run_id }}-${{ github.run_attempt }}/P1.22-font-atlas.png
            /tmp/zxux-phase1-evidence-${{ github.run_id }}-${{ github.run_attempt }}/P1.22-font-atlas.scr
          retention-days: 90
          if-no-files-found: warn
