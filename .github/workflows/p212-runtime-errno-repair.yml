name: P2.12 One-Shot Runtime Errno Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p212-runtime-errno-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair exact P2.12 errno assertion and remove one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v1/tools-host/test-driver/phase2_exec_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = 'require(symbols["E_INVAL"] == 6 and symbols["E_FORMAT"] == 11, "P2.12 errno ABI changed")'
          new = 'require(symbols["E_INVAL"] == 1 and symbols["E_FORMAT"] == 11, "P2.12 errno ABI changed")'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/p212-runtime-errno-repair.yml
          git diff --check
          grep -F 'symbols["E_INVAL"] == 1 and symbols["E_FORMAT"] == 11' v1/tools-host/test-driver/phase2_exec_runtime.py
          test ! -e .github/workflows/p212-runtime-errno-repair.yml
      - name: Commit repaired harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/tools-host/test-driver/phase2_exec_runtime.py
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/p212-runtime-errno-repair.yml' 'v1/tools-host/test-driver/phase2_exec_runtime.py' | sort)"
          test "$changed" = "$expected"
          git commit -m "P2.12: fix runtime errno ABI assertion"
          git push origin HEAD:main
