name: Phase-11 pre-release REV02 Stage A
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p11-prerelease-rev02-stage-a.yml'
      - 'tools/p11-prerelease-rev02/stage_a.py'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: zxux-p11-prerelease-rev02-stage-a
  cancel-in-progress: false
jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Establish REV02 recovery baseline
        run: |
          set -euo pipefail
          python3 tools/p11-prerelease-rev02/stage_a.py --output /tmp/rev02-stage-a.json
      - name: Upload Stage-A baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p11-prerelease-rev02-stage-a-${{ github.sha }}
          path: /tmp/rev02-stage-a.json
          retention-days: 90
          if-no-files-found: error
