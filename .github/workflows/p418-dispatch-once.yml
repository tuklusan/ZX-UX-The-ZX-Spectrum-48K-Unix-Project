name: P4.18 exact admission validation recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p418-dispatch-once.yml

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  validate-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADMISSION_SHA: 3f1e00aff6101a1d4c1f5ba62de0b19959206466
      VALIDATION_REF: p418-admission-validation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable P4.18 admission target
        run: |
          set -euo pipefail
          git cat-file -e "$ADMISSION_SHA^{commit}"
          test "$(git show "$ADMISSION_SHA:v1/dist/certification/P4.18.build.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["status"],d["source_commit"])')" = "PASS a72cb4ef0a11ef7f88a5701bfe4cd7950c340a5a"
          test "$(git show "$ADMISSION_SHA:v1/dist/certification/P4.18.test.json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["status"],d["source_commit"])')" = "PASS a72cb4ef0a11ef7f88a5701bfe4cd7950c340a5a"
          test "$(git diff-tree --no-commit-id --name-only -r "$ADMISSION_SHA" | sort)" = "$(printf '%s\n' v1/dist/certification/P4.18.build.json v1/dist/certification/P4.18.test.json | sort)"

      - name: Mark exact-admission validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${ADMISSION_SHA}" -f state=pending -f context=p418-post-admission -f description="exact admission validations running"

      - name: Dispatch exact admission validators
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/p418-validation-runs
          for wf in quality-and-ci.yml phase1-certification.yml phase2-validation.yml; do
            gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref "$VALIDATION_REF"
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --event workflow_dispatch --limit 30 --json databaseId,headSha,headBranch,status --jq '.[] | select(.headSha=="'${ADMISSION_SHA}'" and .headBranch=="'${VALIDATION_REF}'") | .databaseId' | head -n1)"
              if test -n "$run_id"; then break; fi
              sleep 2
            done
            test -n "$run_id"
            printf '%s %s\n' "$wf" "$run_id" >> /tmp/p418-validation-runs
          done
          cat /tmp/p418-validation-runs

      - name: Require exact admission validators PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r wf run_id; do
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${ADMISSION_SHA}"               -f state=success               -f context="p418-post-admission/${wf%.yml}"               -f description="exact admission validator PASS"               -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done < /tmp/p418-validation-runs
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${ADMISSION_SHA}" -f state=success -f context=p418-post-admission -f description="exact admission validations PASS"

      - name: Cleanup temporary validation ref
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${VALIDATION_REF}" || true

      - name: Mark recovery commit PASS
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p418-admission-recovery -f description="exact admission validation recovery PASS"

      - name: Mark recovery commit FAIL
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${ADMISSION_SHA}" -f state=failure -f context=p418-post-admission -f description="exact admission validation recovery failed"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=p418-admission-recovery -f description="exact admission validation recovery failed"
