name: ZX-UX Kernel Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-kernel-manual
  cancel-in-progress: true
jobs:
  kernel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-zxux-runtime
      - run: |
          set -euo pipefail
          mkdir -p v1/build
          (cd v1/src/kernel && "$GITHUB_WORKSPACE/tools/runtime/sjasmplus/bin/sjasmplus" --nologo --lst=../../build/kernel.lst kernel.asm)
          test "$(wc -c < v1/build/kernel.bin)" -eq 8192
          grep -E 'kernel_(ordinary_pool_start|ordinary_used_end|mod_)' v1/build/kernel.lst
          sha256sum v1/build/kernel.bin
          python3 v1/tools-host/inspect-mex/inspect.py --self-test
          python3 v1/tools-host/inspect-obj/inspect.py --self-test
