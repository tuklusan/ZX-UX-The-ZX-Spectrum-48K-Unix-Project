name: ZX-UX Kernel Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/candidate-kernel.yml
      - tools/manifest/toolchain.lock.json
      - v1/include/**
      - v1/src/boot/**
      - v1/src/kernel/**
      - v1/tools-host/inspect-mex/**
      - v1/tools-host/inspect-obj/**
      - '!**/*.md'
      - '!**/*.markdown'
      - '!**/*.mdown'
      - '!**/*.mdx'
      - '!**/*.rst'
      - '!**/*.adoc'
      - '!**/*.asciidoc'
      - '!**/*.txt'
      - '!**/*.text'
      - '!**/*.rtf'
      - '!**/*.doc'
      - '!**/*.docx'
      - '!**/*.odt'
      - '!**/*.pdf'
      - '!**/*.tex'
      - '!**/*.epub'
      - '!**/*.html'
      - '!**/*.htm'
      - '!**/*.ppt'
      - '!**/*.pptx'
      - '!**/*.odp'
      - '!**/*.pages'
      - '!**/*.key'
      - '!LICENSE'
      - '!LICENSE.*'
      - '!COPYING'
      - '!COPYING.*'
      - '!NOTICE'
      - '!NOTICE.*'
      - '!CHANGELOG'
      - '!CHANGELOG.*'
      - '!CONTRIBUTING'
      - '!CONTRIBUTING.*'
      - '!AUTHORS'
      - '!AUTHORS.*'
      - '!docs/**'
      - '!scratch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zxux-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime

      - name: Assemble kernel
        run: |
          mkdir -p v1/build
          (cd v1/src/kernel && tools/runtime/sjasmplus/bin/sjasmplus --nologo --lst=../../build/kernel.lst kernel.asm)
          test "$(wc -c < v1/build/kernel.bin)" -eq 8192
          grep -E 'kernel_(ordinary_pool_start|ordinary_used_end|mod_)' v1/build/kernel.lst
          sha256sum v1/build/kernel.bin

      - name: Validate executable and object inspectors
        run: |
          python3 v1/tools-host/inspect-mex/inspect.py --self-test
          python3 v1/tools-host/inspect-obj/inspect.py --self-test
