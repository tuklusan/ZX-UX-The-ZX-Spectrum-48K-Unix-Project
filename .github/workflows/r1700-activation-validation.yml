name: R17.00 activation validation
on:
  workflow_dispatch:
    inputs:
      admitted_commit: {required: true, type: string}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADMITTED_COMMIT: ${{ inputs.admitted_commit }}
      ZXUX_SOURCE_EPOCH: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0, ref: ${{ inputs.admitted_commit }}}
      - name: Validate exact R17 activation state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ADMITTED_COMMIT"
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV17.md | awk '{print $1}')" = d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV08.md | awk '{print $1}')" = 97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_media_retention.py
          python3 v1/tools-host/test-driver/evidence.py v1/dist/certification/R17.00.result.json
      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Revalidate R17 bridge at admitted head
        run: |
          set -euo pipefail
          tmp=/tmp/zxux-r17-activation
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step R17.00 --evidence-dir "$tmp"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step R17.00 --evidence-dir "$tmp"
          cmp "$tmp/R17.00.result.json" "$tmp/R17.00.result.json"
          test -z "$(git status --porcelain)"
          echo "ZX-UX R17.00 ACTIVATION VALIDATION PASS"
