name: ZX-UX H03 Public Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h03-public-bundle.yml'

permissions:
  contents: read

jobs:
  build-public-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact ROM upstream
        uses: actions/checkout@v7
        with:
          repository: ZXSpectrumVault/rom-disassemblies
          ref: 38e96bf14b89e01eb3f011c1925df4e9491cea50
          path: rom-upstream
          persist-credentials: false
          fetch-depth: 1

      - name: Assemble and verify public bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/reference/rom-disassemblies/spectrum-48k
          mkdir -p bundle/reference/rom-disassemblies/spectrum-128k
          mkdir -p bundle/reference/rom-disassemblies/skoolkit.ca
          mkdir -p bundle/reference/zilog
          mkdir -p bundle/reference/comp.sys.sinclair-references

          cp -a 'rom-upstream/Spectrum 48K'/.
          cp -a 'rom-upstream/Spectrum 48K'/. bundle/reference/rom-disassemblies/spectrum-48k/
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-48k/Sinclair-Interface-1-v2.asm)" = c9d1e2f6140b8f88f9a6e426cfc7b59241bf9427
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-48k/Sinclair-Interface-1.asm)" = d42487708138b6accf8560fe859ebce6542d9be2
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-48k/Spectrum48.asm)" = e5f042160fb83a05b2bccf6d1e2b1ebb9c76d73d

          for f in Spectrum128_ROM0.asm Spectrum128_ROM0_BugFixed.asm Spectrum128_ROM1.asm; do
            cp "rom-upstream/Spectrum 128K/$f" bundle/reference/rom-disassemblies/spectrum-128k/
          done
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-128k/Spectrum128_ROM0.asm)" = 65ef0577e0a9fb1579ca96b91592b87ae90150ad
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-128k/Spectrum128_ROM0_BugFixed.asm)" = 5c0ca97bcb3fb376fa0d5dfe58336f4f9511e104
          test "$(git hash-object bundle/reference/rom-disassemblies/spectrum-128k/Spectrum128_ROM1.asm)" = e10cf5fcda1f8ec881b5b0d764c962d5b26f38af

          curl --fail --location --retry 3 -o skoolkit.zip https://skoolkit.ca/downloads/rom-disassembly/rom-disassembly-20260409.zip
          mkdir skoolkit-extract
          unzip -q skoolkit.zip -d skoolkit-extract
          skroot="$(dirname "$(find skoolkit-extract -type f -name asm.txt -print -quit)")"
          cp -a "$skroot" bundle/reference/rom-disassemblies/skoolkit.ca/rom-disassembly-20260409
          mkdir skcheck
          git -C skcheck init -q
          cp -a "$skroot"/. skcheck/
          git -C skcheck add -A
          test "$(git -C skcheck write-tree)" = 5336268d6a7eaa295b889853e48ae7cd34ce69eb

          curl --fail --location --retry 3 -o bundle/reference/zilog/UM0080-z80-user-manual.pdf https://www.zilog.com/docs/z80/um0080.pdf
          test "$(git hash-object bundle/reference/zilog/UM0080-z80-user-manual.pdf)" = 3e40135b1390574b6d2d2196641935d060a79d60

          : > public-fetch-status.txt
          for spec in \
            '48kreference.htm|https://worldofspectrum.org/faq/reference/48kreference.htm|4b3569584cb0e26ca9d150a4644cb87bcb1525dc' \
            '128kreference.htm|https://worldofspectrum.org/faq/reference/128kreference.htm|2b6d462da6c2d417d643288c1161211412ba7bb0'; do
            IFS='|' read -r name url expected <<< "$spec"
            if curl --fail --location --retry 3 -o "bundle/reference/comp.sys.sinclair-references/$name.tmp" "$url"; then
              actual="$(git hash-object "bundle/reference/comp.sys.sinclair-references/$name.tmp")"
              if [ "$actual" = "$expected" ]; then
                mv "bundle/reference/comp.sys.sinclair-references/$name.tmp" "bundle/reference/comp.sys.sinclair-references/$name"
                printf '%s MATCH %s\n' "$name" "$actual" >> public-fetch-status.txt
              else
                rm -f "bundle/reference/comp.sys.sinclair-references/$name.tmp"
                printf '%s MISMATCH expected=%s actual=%s\n' "$name" "$expected" "$actual" >> public-fetch-status.txt
              fi
            else
              rm -f "bundle/reference/comp.sys.sinclair-references/$name.tmp"
              printf '%s FETCH_FAILED expected=%s\n' "$name" "$expected" >> public-fetch-status.txt
            fi
          done

          find bundle/reference -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > public-bundle-sha256.txt
          find bundle/reference -type f -printf '%P\n' | LC_ALL=C sort > public-bundle-files.txt
          (cd bundle && zip -q -X -r ../h03-public-reference-bundle.zip reference)
          sha256sum h03-public-reference-bundle.zip > bundle-zip-sha256.txt

      - name: Upload public bundle
        uses: actions/upload-artifact@v7
        with:
          name: h03-public-reference-bundle-${{ github.run_id }}
          path: |
            h03-public-reference-bundle.zip
            public-bundle-sha256.txt
            public-bundle-files.txt
            public-fetch-status.txt
            bundle-zip-sha256.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
