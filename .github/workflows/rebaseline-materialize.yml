name: ZX-UX REV12 Materializer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebaseline-materialize.yml'
      - '.github/rebaseline-payload/**'
      - 'tools/materialize_rebaseline.py'
permissions:
  contents: write
concurrency:
  group: zxux-rev12-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Materialize exact reviewed rebaseline bytes
        run: python3 tools/materialize_rebaseline.py
      - name: Require only reviewed rebaseline plus helper removal
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Publish controlled rebaseline
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "rebaseline: activate REV12 and REV03"
          git push origin HEAD:main
