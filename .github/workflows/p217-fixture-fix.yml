name: P2.17 guarded fixture repair

on:
  push:
    paths:
      - '.github/workflows/p217-fixture-fix.yml'

permissions:
  contents: write

jobs:
  guarded-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Require exact failed P2.17 head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3eeabc4e7b0460b8f1a730460ae1a479f7734ed4"
          grep -q 'INCLUDE \\"../src/kernel/process.asm\\"' v1/tools-host/test-driver/phase2_reparent.py
          ! grep -q 'PANIC_SCHEDULER EQU' v1/tools-host/test-driver/phase2_reparent.py
          ! grep -q 'SYSCALL_FRAME_PC_O EQU' v1/tools-host/test-driver/phase2_reparent.py

      - name: Repair generated fixture constants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v1/tools-host/test-driver/phase2_reparent.py')
          text = path.read_text(encoding='utf-8')
          old = '        "    INCLUDE \\\"../src/kernel/process.asm\\\"\\n"\n        f"    ORG ${FIXTURE_CODE:04X}\\n"\n'
          new = '        "    INCLUDE \\\"../src/kernel/process.asm\\\"\\n"\n        "PANIC_SCHEDULER EQU $03\\n"\n        "SYSCALL_FRAME_PC_O EQU 10\\n"\n        f"    ORG ${FIXTURE_CODE:04X}\\n"\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected P2.17 fixture constant anchor')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/p217-fixture-fix.yml

      - name: Guard repair shape
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile v1/tools-host/test-driver/phase2_reparent.py
          grep -q '"PANIC_SCHEDULER EQU \$03\\n"' v1/tools-host/test-driver/phase2_reparent.py
          grep -q '"SYSCALL_FRAME_PC_O EQU 10\\n"' v1/tools-host/test-driver/phase2_reparent.py
          test "$(git status --short | wc -l)" -eq 2
          git status --short

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ZX-UX P2.17 runner'
          git config user.email 'tuklusan@users.noreply.github.com'
          git add -A
          git commit -m 'P2.17 fixture: define staged assembly constants'
          git push origin HEAD:main
