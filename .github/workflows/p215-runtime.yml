name: P2.15 WAIT runtime diagnostic
# Diagnostic trigger: verify SjASMPlus DEFINE-based P2.15 composition switch.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p215-runtime.yml
      - v1/src/kernel/process.asm
      - v1/src/kernel/syscall.asm
      - v1/src/kernel/scheduler.asm
      - v1/tools-host/test-driver/phase2_wait_specific.py
      - v1/tools-host/test-driver/phase2_wait_specific_runtime.py

permissions:
  contents: read

jobs:
  p215-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Run P2.15 exact WAIT runtime fixture
        id: runtime
        shell: bash
        run: |
          set +e
          echo "source=$(git rev-parse HEAD)" > /tmp/p215-runtime.log
          tools/runtime/python/bin/python v1/tools-host/test-driver/phase2_wait_specific_runtime.py >> /tmp/p215-runtime.log 2>&1
          rc=$?
          cat /tmp/p215-runtime.log
          printf '%s\n' "$rc" > /tmp/p215-runtime.exit
          exit "$rc"

      - name: Upload P2.15 runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p215-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/p215-runtime.log
            /tmp/p215-runtime.exit
            v1/build/p215-wait-specific.asm
            v1/build/p215-wait-specific.sym
          retention-days: 30
          if-no-files-found: warn
