name: P5.17 BREAK and tape error recovery qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p517-qualification
      P517_BASE: 90b5cecc9a9fa35c624a158371a43d5d6bb81360
      P516_SOURCE: e72c05d2837892bfb3f4cbd78f2e99c53a6d1ced
      ZXUX_REV16_SHA256: 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
      ZXUX_REV07_SHA256: 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Guard exact P5.17 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P517_BASE" HEAD | sort > /tmp/p517-changed
          printf '%s\n' \
            .github/workflows/p517-qualification.yml \
            v1/src/kernel/errors.asm \
            v1/src/kernel/tape.asm \
            v1/tools-host/test-driver/phase5_tape_recovery.py \
            v1/tools-host/test-driver/run.py | sort > /tmp/p517-expected
          diff -u /tmp/p517-expected /tmp/p517-changed
          git diff --check "$P517_BASE" HEAD
          test -z "$(git status --porcelain)"
      - name: Three unchanged candidate scans
        run: |
          set -euo pipefail
          baseline=""
          tree="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/phase5_tape_recovery.py v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            digest="$(sha256sum v1/src/kernel/errors.asm v1/src/kernel/tape.asm v1/tools-host/test-driver/phase5_tape_recovery.py v1/tools-host/test-driver/run.py .github/workflows/p517-qualification.yml v1/dist/certification/P5.16.build.json v1/dist/certification/P5.16.test.json | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
            echo "SCAN-$scan: CLEAN"
          done
      - name: Mandatory gates
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "$ZXUX_REV16_SHA256"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "$ZXUX_REV07_SHA256"
          test "$(sha256sum tools/manifest/toolchain.lock.json | awk '{print $1}')" = "$ZXUX_TOOLCHAIN_LOCK_SHA256"
          python3 tools/check_phase4_evidence.py --require-active
          python3 - <<'PY'
          import json
          from pathlib import Path
          for action in ("build", "test"):
              path = Path(f"v1/dist/certification/P5.16.{action}.json")
              record = json.loads(path.read_text(encoding="utf-8"))
              assert record["step"] == "P5.16"
              assert record["action"] == action
              assert record["status"] == "PASS"
              assert record["source_commit"] == "e72c05d2837892bfb3f4cbd78f2e99c53a6d1ced"
          PY
      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Execute P5.17 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P5.17
      - name: Execute P5.17 test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P5.17
      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR/meta"
          git rev-parse HEAD > "$ZXUX_EVIDENCE_DIR/meta/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$ZXUX_EVIDENCE_DIR/meta/candidate-tree.txt"
          git status --porcelain > "$ZXUX_EVIDENCE_DIR/meta/worktree-status.txt"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p517-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p517-qualification/
          retention-days: 90
          if-no-files-found: error
