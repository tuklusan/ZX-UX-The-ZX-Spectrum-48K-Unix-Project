name: P11.01 DOCX repair commit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1101-docx-repair-commit-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Apply visually-qualified authority repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p=Path("docs/04-C48 Language Specification Rev 0.11.docx")
          tmp=p.with_suffix(".docx.p1101.tmp")
          replacements=[
              (b"ZX-UX-ARCHITECTURE-REV11.md",b"ZX-UX-ARCHITECTURE-REV17.md"),
              (b"ZX-UX-IMPLEMENTATION-STEPS-REV02.md",b"ZX-UX-IMPLEMENTATION-STEPS-REV08.md"),
              (b"Revision 11",b"Revision 17"),
              (b"Revision-11",b"Revision-17"),
              (b"REV11",b"REV17"),
              (b"Revision 02",b"Revision 08"),
              (b"Revision-02",b"Revision-08"),
              (b"REV02",b"REV08"),
          ]
          with zipfile.ZipFile(p,"r") as zin, zipfile.ZipFile(tmp,"w") as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename.startswith("word/") and info.filename.endswith(".xml"):
                      for a,b in replacements: data=data.replace(a,b)
                  zout.writestr(info,data)
          data=tmp.read_bytes()
          got=hashlib.sha256(data).hexdigest()
          expected="981eeb963d59e7ce2fd5e0fb73866f8a734fd33746a5ee0fce32d84fdec41903"
          if got!=expected: raise SystemExit(f"qualified DOCX byte identity mismatch: {got}")
          chunks=[]
          with zipfile.ZipFile(tmp) as z:
              for name in z.namelist():
                  if name.startswith("word/") and name.endswith(".xml"):
                      try: root=ET.fromstring(z.read(name))
                      except ET.ParseError: continue
                      chunks.extend(n.text or "" for n in root.iter() if n.tag.endswith("}t"))
          t=" ".join(chunks)
          for stale in ("REV11","Revision 11","Revision-11","REV02","Revision 02","Revision-02"):
              if re.search(re.escape(stale),t,re.I): raise SystemExit(f"stale authority remains: {stale}")
          p.write_bytes(data); tmp.unlink()
          print("ZX-UX P11.01 DOCX REPAIR PASS",got)
          PY
          python3 - <<'PYGATE'
          from pathlib import Path
          p=Path("tools/check_license_headers.sh")
          s=p.read_text(encoding="utf-8")
          old='# Project-owner C48 documentation update admitted from b58f9630397829788972260b5948e882452993e2.\nreadonly C48_SPEC_DOCX_BLOB_SHA1="5744e9f2c440b4ef11f7ffcd7dad7d218f3ba44d"'
          new='# P11.01 authority reconciliation corrects the C48 specification under REV17/REV08.\nreadonly C48_SPEC_DOCX_BLOB_SHA1="a84c314a6d2957835efdc916a49e5289718140c2"'
          if old not in s: raise SystemExit("C48 DOCX license-gate baseline not found")
          p.write_text(s.replace(old,new),encoding="utf-8",newline="\n")
          PYGATE
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_media_retention.py
      - name: Commit repaired DOCX and retire helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1101-docx-repair-commit-once.yml
          git add "docs/04-C48 Language Specification Rev 0.11.docx" tools/check_license_headers.sh
          git diff --cached --check
          git commit -m "P11.01: synchronize C48 specification authorities"
          git push origin HEAD:main
