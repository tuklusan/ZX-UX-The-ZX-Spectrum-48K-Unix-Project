name: R18.00 authority admission
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string
permissions:
  actions: write
  contents: write
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Guard exact qualified head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$SOURCE_COMMIT"
          test ! -e v1/dist/certification/R18.00.result.json
          test "$(git rev-parse refs/tags/PHASE-11-COMPLETE)" = 263a203da3d54a398e8ac011284ae4195b1279c0
          test -z "$(git ls-files | grep -Ei '(^|/)(P12(\.|/)|p12[^/]*(qualification|activation|dispatch)|phase-?12)' | grep -Ev '^(docs|scratch)/' || true)"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_media_retention.py
          python3 tools/check_phase11_evidence.py --require-active
      - name: Download exact qualification artifact
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.error,urllib.request,zipfile,time
          repo=os.environ["GITHUB_REPOSITORY"]; run=os.environ["RUN_ID"]; token=os.environ["GH_TOKEN"]; headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl): return None
          def get_zip(url):
              req=urllib.request.Request(url,headers=headers); op=urllib.request.build_opener(NoRedirect)
              try: op.open(req,timeout=60)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301,302,303,307,308): raise
                  with urllib.request.urlopen(exc.headers["Location"],timeout=60) as r:return r.read()
              raise SystemExit("artifact redirect missing")
          found=[]
          for _ in range(60):
              data=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts")); found=[a for a in data["artifacts"] if a["name"].startswith(f"zxux-r1800-qualification-{run}-") and not a.get("expired")]
              if len(found)==1: break
              if len(found)>1: raise SystemExit("multiple R18 artifacts")
              time.sleep(5)
          if len(found)!=1: raise SystemExit("R18 qualification artifact unavailable")
          pathlib.Path("/tmp/r18.zip").write_bytes(get_zip(found[0]["archive_download_url"]))
          with zipfile.ZipFile("/tmp/r18.zip") as z:z.extractall("/tmp/r18")
          PY
      - name: Validate and admit immutable R18 evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("/tmp/r18"); source=os.environ["SOURCE_COMMIT"]
          for action in ("build","test","result"):
              p=root/f"R18.00.{action}.json"; r=json.loads(p.read_text())
              assert r["schema"]==2 and r["step"]=="R18.00" and r["action"]==action and r["status"]=="PASS"
              assert r["source_commit"]==source and r["worktree_clean"] is True and r["architecture_sha256"]=="b13c551f854cf3c01d951212916c6cf787f23617e3b8b74fc7c1867f76ba2156" and r["implementation_plan_sha256"]=="9ff614ba04721961b3461d03638586260b91e9e82eac7687054ead1c9802869f" and r["prerequisites"]=={"P11.48":"PASS"}
              if action=="result": assert r["pass_marker"]=="ZX-UX REV18 POST-PHASE11 AUTHORITY BRIDGE PASS"
              dst=pathlib.Path("v1/dist/certification")/p.name
              if dst.exists(): raise SystemExit(f"immutable evidence exists: {dst}")
              dst.write_bytes(p.read_bytes())
          PY
          git add v1/dist/certification/R18.00.build.json v1/dist/certification/R18.00.test.json v1/dist/certification/R18.00.result.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R18.00: admit authority bridge evidence"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          git push origin HEAD:main
      - name: Dispatch R18 activation validation
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          admitted="$(git rev-parse HEAD)"
          python3 - "$admitted" <<'PY'
          import json,os,sys,urllib.request
          payload=json.dumps({"ref":"main","inputs":{"admitted_commit":sys.argv[1]}}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/r1800-activation-validation.yml/dispatches",data=payload,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==204
          PY
