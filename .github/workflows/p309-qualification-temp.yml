name: P3.09 exact-candidate qualification

on:
  push:
    branches:
      - p309-qualification-temp
    paths:
      - .github/workflows/p309-qualification-temp.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p309-qualification
      P309_CANDIDATE: 65d9b9125cd443a84ce62f518524a74e3c2339eb

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.P309_CANDIDATE }}
          fetch-depth: 1

      - name: Guard exact candidate and scan three times
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${P309_CANDIDATE}"
          test -z "$(git status --porcelain)"
          tree_baseline="$(git rev-parse 'HEAD^{tree}')"
          baseline=""
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/phase3_pipe_read.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'zx48_pipe_read:' v1/src/kernel/pipe.asm
            grep -q 'call zx48_pipe_wake_writers' v1/src/kernel/pipe.asm
            grep -q 'P3.09' v1/tools-host/test-driver/run.py
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "${tree_baseline}"
            digest="$(sha256sum v1/src/kernel/pipe.asm v1/tools-host/test-driver/phase3_pipe_read.py v1/tools-host/test-driver/run.py | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Mandatory gates
        run: |
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake gettext libaudiofile-dev libfreetype6-dev             libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool             libxml2-dev perl pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P3.09 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P3.09             --evidence-dir "${ZXUX_EVIDENCE_DIR}" 2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P3.09.build.log"

      - name: Execute P3.09 test
        shell: bash
        run: |
          set -o pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P3.09             --evidence-dir "${ZXUX_EVIDENCE_DIR}" 2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P3.09.test.log"

      - name: Collect exact candidate identity
        if: always()
        shell: bash
        run: |
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${ZXUX_EVIDENCE_DIR}/candidate-tree.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p309-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p309-qualification/
          retention-days: 90
          if-no-files-found: error
