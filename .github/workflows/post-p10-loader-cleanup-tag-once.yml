name: Post-P10 loader cleanup tag once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-p10-loader-cleanup-tag-once.yml'

permissions:
  contents: write

concurrency:
  group: zxux-post-p10-loader-cleanup-tag-once
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG_NAME: Post-Phase-10-Loader-Update-and-Cleanup-Complete
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard closed state and exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = "8360b0c5817738b01dc4b75bb64b12d77341adcd"
          grep -Fq '**Closure state:** CLOSED.' scratch/ZX-UX-FAST-LOADER-TZX-RELEASE-MIGRATION-RUNBOOK-REV01.md
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "tag already exists" >&2
            exit 1
          fi
          ./tools/check_project_policy.py
          ./tools/check_license_headers.sh

      - name: Remove helper and tag resulting clean main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-p10-loader-cleanup-tag-once.yml
          git commit -m "cleanup: remove completed tag helper"
          target="$(git rev-parse HEAD)"
          git push origin HEAD:main
          git tag "$TAG_NAME" "$target"
          git push origin "refs/tags/$TAG_NAME"
          echo "tagged=$target"
