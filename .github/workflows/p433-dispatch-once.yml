name: P4.33 Phase 4 qualification admission and activation bridge retry 4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p433-dispatch-once.yml

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  qualify-admit-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark bridge pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=p433-bridge -f description="qualification, admission and activation running"

      - name: Dispatch exact P4.33 qualification
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${GITHUB_SHA}"
          gh workflow run p433-qualification.yml --repo "${GITHUB_REPOSITORY}" --ref main
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow p433-qualification.yml --event workflow_dispatch --limit 20 --json databaseId,headSha,status --jq '.[] | select(.headSha=="'"${candidate}"'") | .databaseId' | head -n1)"
            if test -n "$run_id"; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=p433-qualification -f description="qualification running" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p433-qualification -f description="qualification PASS"

      - name: Download and validate exact P4.33 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/p433-admit
          mkdir -p /tmp/p433-admit
          gh run download "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --name "zxux-p433-qualification-${RUN_ID}-1" --dir /tmp/p433-admit
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("/tmp/p433-admit")
          sha=os.environ["GITHUB_SHA"]
          for name, action in (
              ("P4.33.build.json","build"),
              ("P4.33.test.json","test"),
              ("P4.33.result.json","result"),
          ):
              d=json.loads((root/name).read_text())
              assert d["step"]=="P4.33"
              assert d["action"]==action
              assert d["status"]=="PASS"
              assert d["source_commit"]==sha
              assert d["worktree_clean"] is True
              assert d["prerequisites"]=={"P4.32":"PASS"}
          assert json.loads((root/"P4.33.result.json").read_text())["pass_marker"]=="ZX-UX PHASE 4 ACCEPTANCE PASS"
          assert (root/"meta"/"candidate-commit.txt").read_text().strip()==sha
          assert (root/"meta"/"worktree-status.txt").read_text()==""
          PY

      - name: Admit P4.33 evidence only
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp /tmp/p433-admit/P4.33.build.json v1/dist/certification/P4.33.build.json
          cp /tmp/p433-admit/P4.33.test.json v1/dist/certification/P4.33.test.json
          cp /tmp/p433-admit/P4.33.result.json v1/dist/certification/P4.33.result.json
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          git diff --check
          git add v1/dist/certification/P4.33.build.json v1/dist/certification/P4.33.test.json v1/dist/certification/P4.33.result.json
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' v1/dist/certification/P4.33.build.json v1/dist/certification/P4.33.result.json v1/dist/certification/P4.33.test.json | sort)"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "P4.33: admit qualified Phase-4 acceptance evidence"
          admission_sha="$(git rev-parse HEAD)"
          echo "admission_sha=$admission_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Create exact P4.33 admission validation ref
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA: ${{ steps.admit.outputs.admission_sha }}
        run: |
          set -euo pipefail
          ref="p433-admission-${GITHUB_RUN_ID}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/$ref" -f sha="$ADMISSION_SHA"

      - name: Require exact P4.33 admission validations PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA: ${{ steps.admit.outputs.admission_sha }}
          VALIDATION_REF: ${{ steps.validation.outputs.ref }}
        run: |
          set -euo pipefail
          : > /tmp/p433-validation-runs
          for wf in quality-and-ci.yml phase1-certification.yml phase2-validation.yml phase4-finalization.yml; do
            gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref "$VALIDATION_REF"
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --event workflow_dispatch --limit 40 --json databaseId,headSha,headBranch --jq '.[] | select(.headSha=="'"${ADMISSION_SHA}"'" and .headBranch=="'"${VALIDATION_REF}"'") | .databaseId' | head -n1)"
              if test -n "$run_id"; then break; fi
              sleep 2
            done
            test -n "$run_id"
            printf '%s %s\n' "$wf" "$run_id" >> /tmp/p433-validation-runs
          done
          while read -r wf run_id; do
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          done < /tmp/p433-validation-runs

      - name: Cleanup exact P4.33 admission validation ref
        if: ${{ always() && steps.validation.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_REF: ${{ steps.validation.outputs.ref }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${VALIDATION_REF}" || true

      - name: Generate and activate Phase-4 aggregate
        id: activate
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA: ${{ steps.admit.outputs.admission_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach "$ADMISSION_SHA"
          test ! -e v1/dist/certification/phase-4.json
          python3 tools/finalize_phase4_evidence.py --root "$GITHUB_WORKSPACE" --output /tmp/phase-4.json
          grep -q '"status": "PASS"' /tmp/phase-4.json
          grep -q 'ZX-UX PHASE 4 CERTIFICATION PASS' /tmp/phase-4.json
          cp /tmp/phase-4.json v1/dist/certification/phase-4.json
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          git diff --check
          git add v1/dist/certification/phase-4.json
          test "$(git diff --cached --name-only)" = "v1/dist/certification/phase-4.json"
          source="$(python3 -c 'import json; print(json.load(open("v1/dist/certification/phase-4.json"))["source_commit"])')"
          git commit -m "phase4: activate Phase-4 aggregate evidence for $source"
          activation_sha="$(git rev-parse HEAD)"
          echo "activation_sha=$activation_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Require activation-triggered validations PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SHA: ${{ steps.activate.outputs.activation_sha }}
        run: |
          set -euo pipefail
          : > /tmp/p433-activation-runs
          for wf in quality-and-ci.yml phase1-certification.yml phase2-validation.yml phase4-finalization.yml; do
            run_id=""
            for attempt in $(seq 1 90); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --limit 50 --json databaseId,headSha,event --jq '.[] | select(.headSha=="'"${ACTIVATION_SHA}"'" and .event=="push") | .databaseId' | head -n1)"
              if test -n "$run_id"; then break; fi
              sleep 2
            done
            test -n "$run_id"
            printf '%s %s\n' "$wf" "$run_id" >> /tmp/p433-activation-runs
          done
          while read -r wf run_id; do
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          done < /tmp/p433-activation-runs

      - name: Verify durable Phase-4 activation
        env:
          ACTIVATION_SHA: ${{ steps.activate.outputs.activation_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$ACTIVATION_SHA"
          git checkout --detach "$ACTIVATION_SHA"
          python3 tools/check_phase4_evidence.py --require-active
          python3 tools/test_phase4_evidence_negative.py

      - name: Mark bridge PASS
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p433-bridge -f description="Phase 4 qualified, admitted, activated and certified"

      - name: Mark bridge FAIL
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=p433-bridge -f description="Phase 4 final bridge failed"
