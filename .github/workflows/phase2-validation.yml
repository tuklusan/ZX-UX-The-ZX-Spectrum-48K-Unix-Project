# Historical full-regression diagnostic. Automatic ownership moved to exact-head regression.
name: ZX-UX Phase 2 Validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-phase2-manual
  cancel-in-progress: true
jobs:
  phase2-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase2-evidence-${ github.run_id }-${ github.run_attempt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - run: |
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
      - uses: ./.github/actions/setup-zxux-runtime
      - run: |
          set -euo pipefail
          py=tools/runtime/python/bin/python
          "$py" v1/tools-host/test-driver/run.py build --step P2.24
          "$py" v1/tools-host/test-driver/run.py test --step P2.24
      - run: |
          python3 tools/check_phase2_evidence.py --require-active
          python3 tools/test_phase2_evidence_negative.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: zxux-phase2-${ github.run_id }-${ github.run_attempt }
          path: /tmp/zxux-phase2-evidence-${ github.run_id }-${ github.run_attempt }/
          retention-days: 90
          if-no-files-found: warn
