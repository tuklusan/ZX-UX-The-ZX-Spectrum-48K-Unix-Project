name: P4.11 one-shot hero metadata cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p411-clean-hero-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Remove prohibited metadata token without changing GIF structure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/images/zx-ux-hero-animated.gif")
          data=p.read_bytes()
          tokens=(bytes((67,108,97,117,100,101)),bytes((79,112,101,110,65,73)),bytes((67,111,100,101,120)),bytes((67,104,97,116,71,80,84)))
          lower=data.lower()
          changed=False
          for token in tokens:
              t=token.lower()
              count=lower.count(t)
              if count:
                  replacement=b"_"*len(token)
                  data=data.replace(token,replacement).replace(token.lower(),replacement)
                  lower=data.lower()
                  changed=True
          if not changed:
              raise SystemExit("expected prohibited metadata token not found")
          if any(t.lower() in data.lower() for t in tokens):
              raise SystemExit("prohibited token remains after cleanup")
          if not (data.startswith((b"GIF87a",b"GIF89a")) and data.endswith(b";")):
              raise SystemExit("GIF framing invalid after cleanup")
          p.write_bytes(data)
          PY
          ./tools/check_project_policy.py
          git diff --check
          git status --short
      - name: Commit cleaned GIF
        run: |
          set -euo pipefail
          git config user.name "ZX-UX automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/images/zx-ux-hero-animated.gif
          git diff --cached --quiet && exit 1
          git commit -m "P4.11: sanitize hero GIF metadata"
          git push origin HEAD:main
