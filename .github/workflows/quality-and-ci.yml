name: ZX-UX Quality and CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zxux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX_RESULTS: 25
  RESULT_PREFIX: zxux-result-

jobs:
  legacy_policy_repair:
    name: legacy-policy-repair
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.repair.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repair inherited policy text
        id: repair
        run: |
          python3 tools/repair_legacy_policy.py
          if git diff --quiet -- docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV02.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check in repaired document
        if: steps.repair.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV02.md
          git commit -m "Repair inherited implementation policy text"
          git push origin HEAD:main

  project_policy:
    name: project-policy
    needs:
      - legacy_policy_repair
    if: needs.legacy_policy_repair.outputs.changed != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce project policy
        run: ./tools/check_project_policy.py

  e0_metadata:
    name: e0-metadata
    needs:
      - legacy_policy_repair
    if: needs.legacy_policy_repair.outputs.changed != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Verify E0 metadata
        run: python tools/scripts/verify-environment.py --metadata-only

      - name: Verify E0 negative path
        run: |
          cp tools/manifest/toolchain.lock.json /tmp/zxux-bad-lock.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/zxux-bad-lock.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["artifacts"][0]["sha256"] = "0" * 64
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          if python tools/scripts/verify-environment.py --metadata-only --manifest /tmp/zxux-bad-lock.json; then
            echo "ERROR: altered E0 lock unexpectedly passed" >&2
            exit 1
          fi

  e0_foundation:
    name: e0-foundation
    needs:
      - e0_metadata
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Create ephemeral project-local Python wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          wrapper = Path("tools/runtime/python/bin/python")
          wrapper.parent.mkdir(parents=True, exist_ok=True)
          wrapper.write_text(
              "#!/usr/bin/env bash\n"
              f'exec "{Path(sys.executable).resolve()}" "$@"\n',
              encoding="utf-8",
              newline="\n",
          )
          wrapper.chmod(0o755)
          PY

      - name: Execute E0.03 through E0.06
        run: |
          set -euo pipefail
          py="tools/runtime/python/bin/python"
          driver="v1/tools-host/test-driver/run.py"
          for step in E0.03 E0.04 E0.05 E0.06; do
            "$py" "$driver" build --step "$step"
            "$py" "$driver" test --step "$step"
          done

      - name: Upload E0 foundation evidence
        uses: actions/upload-artifact@v7
        with:
          name: zxux-e0-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1/dist/certification/*.json
          retention-days: 90
          if-no-files-found: error

  license_headers:
    name: license-headers
    needs:
      - project_policy
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce license headers
        run: ./tools/check_license_headers.sh

  project_ci:
    name: project-ci
    needs:
      - project_policy
      - e0_metadata
      - e0_foundation
      - license_headers
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository policy
        run: ./tools/ci.sh

  record_result:
    name: record-result
    needs:
      - legacy_policy_repair
      - project_policy
      - e0_metadata
      - e0_foundation
      - license_headers
      - project_ci
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build continuity list
        uses: actions/github-script@v9
        env:
          CURRENT_RESULT_ID: GARF-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const maxResults = Number(process.env.MAX_RESULTS);
            const prefix = process.env.RESULT_PREFIX;
            const current = process.env.CURRENT_RESULT_ID;

            if (!Number.isInteger(maxResults) || maxResults < 1 || maxResults > 25) {
              core.setFailed(`MAX_RESULTS must be an integer from 1 through 25; got ${process.env.MAX_RESULTS}`);
              return;
            }

            const response = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const previous = response
              .filter((artifact) => !artifact.expired && artifact.name.startsWith(prefix))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .map((artifact) => artifact.name.slice(prefix.length))
              .filter((id) => id !== current);

            const identifiers = [current, ...previous].slice(0, maxResults);
            fs.mkdirSync('.zxux-results', { recursive: true });
            fs.writeFileSync(
              '.zxux-results/continuity.json',
              `${JSON.stringify({ schema: 1, max_results: maxResults, identifiers }, null, 2)}\n`
            );

      - name: Record result metadata
        if: always()
        env:
          RESULT_ID: GARF-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          LEGACY_POLICY_REPAIR_CONCLUSION: ${{ needs.legacy_policy_repair.result }}
          PROJECT_POLICY_CONCLUSION: ${{ needs.project_policy.result }}
          E0_METADATA_CONCLUSION: ${{ needs.e0_metadata.result }}
          E0_FOUNDATION_CONCLUSION: ${{ needs.e0_foundation.result }}
          LICENSE_HEADERS_CONCLUSION: ${{ needs.license_headers.result }}
          PROJECT_CI_CONCLUSION: ${{ needs.project_ci.result }}
        run: |
          mkdir -p .zxux-results
          if [[ ! -f .zxux-results/continuity.json ]]; then
            cat > .zxux-results/continuity.json <<JSON
          {
            "schema": 1,
            "max_results": 25,
            "identifiers": ["${RESULT_ID}"],
            "incomplete": true
          }
          JSON
          fi

          created_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > .zxux-results/result.json <<JSON
          {
            "schema": 1,
            "result_id": "${RESULT_ID}",
            "repository": "${GITHUB_REPOSITORY}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit_sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "event": "${GITHUB_EVENT_NAME}",
            "created_utc": "${created_utc}",
            "legacy_policy_repair_conclusion": "${LEGACY_POLICY_REPAIR_CONCLUSION}",
            "project_policy_conclusion": "${PROJECT_POLICY_CONCLUSION}",
            "e0_metadata_conclusion": "${E0_METADATA_CONCLUSION}",
            "e0_foundation_conclusion": "${E0_FOUNDATION_CONCLUSION}",
            "license_headers_conclusion": "${LICENSE_HEADERS_CONCLUSION}",
            "job_conclusion": "${PROJECT_CI_CONCLUSION}"
          }
          JSON

      - name: Validate generated result bundle policy
        id: bundle_policy
        if: always()
        run: ./tools/check_project_policy.py

      - name: Upload result bundle
        if: steps.bundle_policy.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: zxux-result-GARF-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .zxux-results/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
