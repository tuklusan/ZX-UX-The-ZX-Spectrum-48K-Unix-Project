name: ZX-UX Quality and CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-quality-manual
  cancel-in-progress: true
jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - run: |
          set -euo pipefail
          ./tools/check_project_policy.py
          ./tools/check_license_headers.sh
          ./tools/ci.sh
          python3 tools/scripts/verify-environment.py --metadata-only
          for phase in $(seq 0 12); do
            aggregate="v1/dist/certification/phase-$phase.json"; checker="tools/check_phase$phase"_evidence.py
            if test -f "$aggregate"; then test -f "$checker"; python3 "$checker" --require-active; fi
          done
  e0-foundation:
    needs: static-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-e0-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-zxux-runtime
      - run: |
          set -euo pipefail
          py=tools/runtime/python/bin/python; driver=v1/tools-host/test-driver/run.py
          for n in 01 02 03 04 05 06; do "$py" "$driver" build --step "E0.$n"; "$py" "$driver" test --step "E0.$n"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-e0-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-e0-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 90
          if-no-files-found: warn
