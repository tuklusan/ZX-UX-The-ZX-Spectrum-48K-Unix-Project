name: P4.22 one-shot qualification and admission bridge v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p422-dispatch-once.yml

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  qualify-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark bridge pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=p422-bridge -f description="qualification and admission running"

      - name: Dispatch exact P4.22 qualification
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="${GITHUB_SHA}"
          gh workflow run p422-qualification.yml --repo "${GITHUB_REPOSITORY}" --ref main
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow p422-qualification.yml --event workflow_dispatch --limit 20 --json databaseId,headSha,status --jq '.[] | select(.headSha=="'${candidate}'") | .databaseId' | head -n1)"
            if test -n "$run_id"; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context=p422-qualification -f description="qualification running" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p422-qualification -f description="qualification PASS"

      - name: Download and validate exact P4.22 evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/p422-admit
          mkdir -p /tmp/p422-admit
          gh run download "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --name "zxux-p422-qualification-${RUN_ID}-1" --dir /tmp/p422-admit
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("/tmp/p422-admit")
          sha=os.environ["GITHUB_SHA"]
          for name, action in (("P4.22.build.json","build"),("P4.22.test.json","test")):
              p=root/name
              if not p.is_file():
                  raise SystemExit(f"missing {name}")
              d=json.loads(p.read_text())
              assert d["step"]=="P4.22"
              assert d["action"]==action
              assert d["status"]=="PASS"
              assert d["source_commit"]==sha
              assert d["worktree_clean"] is True
              assert d["prerequisites"]=={"P4.21":"PASS"}
          assert (root/"meta"/"candidate-commit.txt").read_text().strip()==sha
          assert (root/"meta"/"worktree-status.txt").read_text()==""
          PY
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p422-evidence -f description="evidence validation PASS"

      - name: Admit P4.22 evidence only
        id: admit
        run: |
          set -euo pipefail
          cp /tmp/p422-admit/P4.22.build.json v1/dist/certification/P4.22.build.json
          cp /tmp/p422-admit/P4.22.test.json v1/dist/certification/P4.22.test.json
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          git diff --check
          git add v1/dist/certification/P4.22.build.json v1/dist/certification/P4.22.test.json
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' v1/dist/certification/P4.22.build.json v1/dist/certification/P4.22.test.json | sort)"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "P4.22: admit qualified SYS_PACK evidence"
          admission_sha="$(git rev-parse HEAD)"
          echo "admission_sha=$admission_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p422-admission -f description="evidence admission pushed"

      - name: Create exact-admission validation ref
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA: ${{ steps.admit.outputs.admission_sha }}
        run: |
          set -euo pipefail
          ref="p422-admission-${GITHUB_RUN_ID}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/$ref" -f sha="$ADMISSION_SHA"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$ADMISSION_SHA" -f state=pending -f context=p422-post-admission -f description="exact admission validations running"

      - name: Require exact admission-triggered validations PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA: ${{ steps.admit.outputs.admission_sha }}
          VALIDATION_REF: ${{ steps.validation.outputs.ref }}
        run: |
          set -euo pipefail
          : > /tmp/p422-validation-runs
          for wf in quality-and-ci.yml phase1-certification.yml phase2-validation.yml; do
            gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref "$VALIDATION_REF"
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --event workflow_dispatch --limit 30 --json databaseId,headSha,headBranch,status --jq '.[] | select(.headSha=="'${ADMISSION_SHA}'" and .headBranch=="'${VALIDATION_REF}'") | .databaseId' | head -n1)"
              if test -n "$run_id"; then break; fi
              sleep 2
            done
            test -n "$run_id"
            printf '%s %s\n' "$wf" "$run_id" >> /tmp/p422-validation-runs
          done
          while read -r wf run_id; do
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$ADMISSION_SHA" -f state=success -f context="p422-post-admission/${wf%.yml}" -f description="exact admission validator PASS" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done < /tmp/p422-validation-runs
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$ADMISSION_SHA" -f state=success -f context=p422-post-admission -f description="exact admission validations PASS"

      - name: Cleanup exact-admission validation ref
        if: ${{ always() && steps.validation.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_REF: ${{ steps.validation.outputs.ref }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${VALIDATION_REF}" || true

      - name: Mark bridge PASS
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=p422-bridge -f description="qualification, admission, validations PASS"

      - name: Mark bridge FAIL
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=""
          if test -n "${{ steps.dispatch.outputs.run_id }}"; then url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.dispatch.outputs.run_id }}"; fi
          if test -n "$url"; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=p422-bridge -f description="qualification/admission bridge failed" -f target_url="$url"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=p422-bridge -f description="qualification/admission bridge failed"
          fi
