name: ZX-UX H03 Byte Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h03-private-reference-bridge.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore reviewed H03 workflow bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/h03-target.b64"
          : > "$out"
          for sha in \
            ae2fc37d963ea8ccc0486d94c5976fd10f8264c8 \
            699c5861a4ca54433a2b2bbfce07d8568a8f0b0a \
            68b7b7ef905218571d8531f2b75e29de67e2463f \
            80e246c951f9b401e6e197d743a9e200e0cbafc6 \
            5a6a8c51c57fb1376a31bff568828a5a1cfaa83f \
            b4e5bfe2e4cce1f9abb08ffa9ad32bbe0568bf8e; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/git/blobs/$sha" \
              | python3 -c 'import base64,json,sys; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
              >> "$out"
          done
          base64 -d "$out" > "$RUNNER_TEMP/h03-target.yml"
          [[ "$(git hash-object "$RUNNER_TEMP/h03-target.yml")" == a949ac9b3373f1714e6b1b487073b298d17bc030 ]]
          cp "$RUNNER_TEMP/h03-target.yml" .github/workflows/h03-private-reference-bridge.yml
          [[ "$(git hash-object .github/workflows/h03-private-reference-bridge.yml)" == a949ac9b3373f1714e6b1b487073b298d17bc030 ]]
          git add .github/workflows/h03-private-reference-bridge.yml
          [[ "$(git diff --cached --name-only)" == .github/workflows/h03-private-reference-bridge.yml ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: restore H03 import workflow exact bytes'
          git push origin HEAD:main
