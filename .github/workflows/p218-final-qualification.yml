name: P2.18 exact-head final qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-final-qualification.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-final-qualification
      P218_EXACT_PARENT: c6c5e4b800aefe5a12baeadb9d917f6ec1157446
      P218_LANDED_CANDIDATE: b42798a7c75783efad17a1ff84bf940722791a2f
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact qualification trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact trigger and P2.18 candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-final-qualification.yml"
          git merge-base --is-ancestor "${P218_LANDED_CANDIDATE}" HEAD
          git diff --quiet "${P218_LANDED_CANDIDATE}" -- \
            v1/src/kernel/process.asm v1/tools-host/test-driver/run.py
          grep -q 'ZX48_P2_18_KILL_ENABLED EQU 1' v1/src/kernel/process.asm
          grep -q 'phase2_kill_never_started.dispatch' v1/tools-host/test-driver/run.py
          test -z "$(git status --porcelain)"
          echo "qualification_head=$(git rev-parse HEAD)"
          echo "qualification_parent=$(git rev-parse HEAD^)"

      - name: Three unchanged pre-checkin scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git merge-base --is-ancestor "${P218_LANDED_CANDIDATE}" HEAD
            git diff --quiet "${P218_LANDED_CANDIDATE}" -- \
              v1/src/kernel/process.asm v1/tools-host/test-driver/run.py
            git diff --check
            python3 -m py_compile scratch/p218_apply.py
            python3 -m py_compile v1/tools-host/test-driver/phase2_kill_never_started.py
            python3 -m py_compile v1/tools-host/test-driver/p218_failure_probe.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find scratch v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            test -z "$(git status --porcelain)"
            digest="$(git ls-files -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_tree_sha256=${digest}"
          done

      - name: Mandatory license and project-policy gates
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Require active architecture and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          echo "architecture_sha256=${architecture_sha256}"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P2.18 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.18

      - name: Execute P2.18 test with failure probe
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.18 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.test.log"
          test_rc="${PIPESTATUS[0]}"
          printf '%s\n' "${test_rc}" > "${ZXUX_EVIDENCE_DIR}/P2.18.test.rc"
          echo "p218_test_rc=${test_rc}"
          if test "${test_rc}" -ne 0; then
            tools/runtime/python/bin/python v1/tools-host/test-driver/p218_failure_probe.py \
              2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.log"
            probe_rc="${PIPESTATUS[0]}"
            printf '%s\n' "${probe_rc}" > "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.rc"
            echo "p218_failure_probe_rc=${probe_rc}"
          fi
          exit "${test_rc}"

      - name: Collect exact-head P2.18 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/source-commit.txt"
          git rev-parse HEAD^ > "${ZXUX_EVIDENCE_DIR}/source-parent.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          sha256sum \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_kill_never_started.py \
            v1/tools-host/test-driver/p218_failure_probe.py \
            .github/workflows/p218-final-qualification.yml \
            > "${ZXUX_EVIDENCE_DIR}/qualification-hashes.sha256"
          for path in \
            v1/build/kernel-p218.sym \
            v1/build/kernel-p218.lst \
            v1/build/p218-kill-never-started.asm \
            v1/build/p218-kill-never-started.sym \
            v1/build/p218-kill-never-started.lst; do
            if test -f "${path}"; then
              cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"
            fi
          done
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload exact-head P2.18 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-final-qualification/
          retention-days: 90
          if-no-files-found: error
