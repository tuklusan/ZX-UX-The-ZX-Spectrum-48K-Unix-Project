name: P10 loader final-block diagnostic once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p10-loader-path-diagnostic-once.yml

permissions:
  contents: read

concurrency:
  group: zxux-p10-loader-path-diagnostic-once
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard fixed Phase-10 state and exact released TZX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test "$(sha256sum v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx | awk '{print $1}')" = 41257362e2de40375aa2ecd30db2ad7808624634e8554ddcb93a8ba390483070
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          ./tools/check_project_policy.py
          ./tools/check_license_headers.sh

      - name: Restore certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime

      - name: Install UI-only diagnostic helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb=2:21.1.12-1ubuntu1.6 \
            xdotool=1:3.20160805.1-5build1
          test "$(dpkg-query -W -f='${Version}' xvfb)" = 2:21.1.12-1ubuntu1.6
          test "$(dpkg-query -W -f='${Version}' xdotool)" = 1:3.20160805.1-5build1

      - name: Trace 24th display call through E003
        shell: bash
        run: |
          set -euo pipefail
          diag=/tmp/p10-loader-path
          rm -rf "$diag"
          mkdir -p "$diag"
          python3 - <<'PY'
          from pathlib import Path

          row = [0x50e0 + scan*0x100 + col for scan in range(8) for col in range(32)]
          attrs = list(range(0x5ae0,0x5b00))

          def dump(stage, extra=()):
              out=[f"print 0x6100{stage:02x}"]
              out.extend(extra)
              out.append(f"print 0x6200{stage:02x}")
              out.extend(f"print [0x{a:04x}]" for a in row)
              out.append(f"print 0x6300{stage:02x}")
              out.extend(f"print [0x{a:04x}]" for a in attrs)
              out.append(f"print 0x6f00{stage:02x}")
              return out

          c=["base 16",
             "breakpoint 0x5e55 if [0x5ef7] == 1",
             "breakpoint 0x5eb4",
             "breakpoint 0x5f2a",
             "breakpoint 0x03b5",
             "breakpoint 0xe003",
             "breakpoint time 0 if spectrum:frames > 6500"]

          stages={
              1: dump(1, ("print z80:pc","print [0x5ef5]","print [0x5ef6]","print [0x5ef7]")),
              2: dump(2, ("print z80:pc",)),
              3: dump(3, ("print z80:pc",)),
              4: dump(4, ("print z80:pc","print z80:de","print z80:hl","print z80:sp","print [z80:sp]","print [z80:sp+1]")),
              5: dump(5, ("print z80:pc",)),
          }
          for bp,stage in stages.items():
              c.append(f"commands {bp}")
              c.extend(stage)
              c.append("exit 0" if bp==5 else "continue")
              c.append("end")
          c.extend(["commands 6","print 0x7f0006","print z80:pc","print spectrum:frames","exit 3","end","continue"])
          Path("/tmp/p10-loader-path/debugger.txt").write_text("\n".join(c)+"\n")
          PY

          Xvfb :99 -screen 0 1280x900x24 >"$diag/xvfb.log" 2>&1 &
          xvfb_pid=$!
          fuse_pid=""
          trap 'kill "$fuse_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          stdbuf -oL -eL tools/runtime/fuse/bin/fuse --machine 48 \
            --rom-48 tools/runtime/fuse/roms/48.rom \
            --tape v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx \
            --no-accelerate-loader --no-fastload --no-traps --no-detect-loader \
            --no-confirm-actions --no-sound \
            --debugger-command "$(cat "$diag/debugger.txt")" \
            >"$diag/fuse-state.log" 2>&1 &
          fuse_pid=$!

          window=""
          for i in $(seq 1 40); do
            window="$(xdotool search --onlyvisible --name '^Fuse$' 2>/dev/null | head -n1 || true)"
            test -n "$window" && break
            sleep 0.25
          done
          test -n "$window"
          xdotool windowfocus --sync "$window" || true
          xdotool mousemove --window "$window" 160 145 click 1 || true
          sleep 0.75
          xdotool keydown Shift_L; sleep 0.25; xdotool keyup Shift_L; sleep 0.60
          xdotool keydown j; sleep 0.45; xdotool keyup j; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool keydown Return; sleep 0.45; xdotool keyup Return

          rom_waiting=""
          for i in $(seq 1 40); do
            if grep -q '0x62626262' "$diag/fuse-state.log"; then rom_waiting=yes; break; fi
            kill -0 "$fuse_pid" 2>/dev/null || break
            sleep 0.25
          done
          test "$rom_waiting" = yes
          xdotool windowfocus --sync "$window" || true
          xdotool key F8

          result=""
          for i in $(seq 1 150); do
            if grep -q '0x610005' "$diag/fuse-state.log"; then result=E003_REACHED; break; fi
            if grep -q '0x7f0006' "$diag/fuse-state.log"; then result=TIMEOUT; break; fi
            kill -0 "$fuse_pid" 2>/dev/null || { result=FUSE_EXITED; break; }
            sleep 1
          done
          wait "$fuse_pid" || true
          fuse_pid=""
          kill "$xvfb_pid" 2>/dev/null || true
          xvfb_pid=""
          trap - EXIT
          test "$result" = E003_REACHED

          python3 - <<'PY'
          import json,re
          from pathlib import Path

          diag=Path("/tmp/p10-loader-path")
          text=(diag/"fuse-state.log").read_text(errors="replace")
          vals=[int(x,16) for x in re.findall(r"0x([0-9a-fA-F]+)",text)]

          def unique_index(value):
              hits=[i for i,v in enumerate(vals) if v==value]
              if len(hits)!=1:
                  raise SystemExit(f"marker {value:#x} count={len(hits)}")
              return hits[0]

          stages={}
          for stage,name in [(1,"hook24_before"),(2,"final_hold"),(3,"startup_beep"),(4,"rom_beeper"),(5,"e003")]:
              si=unique_index(0x610000+stage)
              ri=unique_index(0x620000+stage)
              ai=unique_index(0x630000+stage)
              ei=unique_index(0x6f0000+stage)
              row23=vals[ri+1:ai]
              attrs23=vals[ai+1:ei]
              if len(row23)!=256 or len(attrs23)!=32:
                  raise SystemExit(f"stage {stage} bad dump lengths row={len(row23)} attrs={len(attrs23)}")
              stages[name]={"index":si,"row23":row23,"attrs23":attrs23}

          order=[stages[n]["index"] for n in ("hook24_before","final_hold","startup_beep","rom_beeper","e003")]
          if order != sorted(order):
              raise SystemExit(f"stage order wrong: {order}")

          s1=unique_index(0x610001); r1=unique_index(0x620001)
          meta1=vals[s1+1:r1]
          if len(meta1)!=4:
              raise SystemExit(f"hook24 metadata length={len(meta1)}")
          pc,ptr_lo,ptr_hi,lines_left=meta1

          s4=unique_index(0x610004); r4=unique_index(0x620004)
          meta4=vals[s4+1:r4]
          if len(meta4)!=6:
              raise SystemExit(f"beeper metadata length={len(meta4)}")
          bpc,de,hl,sp,ret_lo,ret_hi=meta4

          rom=Path("tools/runtime/fuse/roms/48.rom").read_bytes()
          line=Path("v1/tools-host/release-tzx/text-lines.txt").read_text(encoding="ascii").splitlines()[-1]
          expected=[rom[0x3c00+ord(ch)*8+scan] for scan in range(8) for ch in line]
          expected_attrs=[0x07]*32

          def mismatch(actual,expected):
              return [i for i,(a,b) in enumerate(zip(actual,expected)) if a!=b]

          report={
              "path_order":["hook24_before","final_hold","startup_beep","rom_beeper","e003"],
              "hook24":{"pc":pc,"text_ptr":ptr_lo | (ptr_hi<<8),"lines_left":lines_left,
                        "row23_nonzero_before":sum(v!=0 for v in stages["hook24_before"]["row23"])},
              "final_hold":{"row23_matches_expected":stages["final_hold"]["row23"]==expected,
                            "row23_mismatch_offsets":mismatch(stages["final_hold"]["row23"],expected)[:32],
                            "attrs_match_white_on_black":stages["final_hold"]["attrs23"]==expected_attrs},
              "startup_beep":{"row23_matches_expected":stages["startup_beep"]["row23"]==expected,
                              "attrs_match_white_on_black":stages["startup_beep"]["attrs23"]==expected_attrs},
              "rom_beeper":{"pc":bpc,"de":de,"hl":hl,"sp":sp,
                            "return_address":ret_lo | (ret_hi<<8),
                            "row23_matches_expected":stages["rom_beeper"]["row23"]==expected},
              "e003":{"row23_matches_expected":stages["e003"]["row23"]==expected,
                      "row23_mismatch_offsets":mismatch(stages["e003"]["row23"],expected)[:32],
                      "attrs_match_white_on_black":stages["e003"]["attrs23"]==expected_attrs},
              "expected_last_line":line,
          }
          report["conclusion"]={
              "24th_display_invocation_reached":pc==0x5e55 and lines_left==1,
              "24th_text_pointer_correct":report["hook24"]["text_ptr"]==0x6272,
              "last_line_rendered_before_final_hold":report["final_hold"]["row23_matches_expected"],
              "startup_beep_reached":True,
              "rom_beeper_called_by_startup_beep":bpc==0x03b5 and report["rom_beeper"]["return_address"]==0x5f35,
              "beeper_registers_expected":de==224 and hl==458,
              "row23_intact_at_e003":report["e003"]["row23_matches_expected"],
          }
          (diag/"report.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          if not all(report["conclusion"].values()):
              raise SystemExit("loader final-block diagnostic found a divergence")
          PY

      - name: Final fixed-state guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          test -z "$(git status --porcelain)"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p10-loader-final-block-diagnostic-${{ github.run_id }}
          path: /tmp/p10-loader-path/
          retention-days: 30
          if-no-files-found: warn
