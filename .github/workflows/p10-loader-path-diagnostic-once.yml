name: P10 loader final-block diagnostic once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p10-loader-path-diagnostic-once.yml

permissions:
  contents: read

concurrency:
  group: zxux-p10-loader-path-diagnostic-once
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard fixed Phase-10 state and exact released TZX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test "$(sha256sum v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx | awk '{print $1}')" = 41257362e2de40375aa2ecd30db2ad7808624634e8554ddcb93a8ba390483070
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          ./tools/check_project_policy.py
          ./tools/check_license_headers.sh

      - name: Restore certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime

      - name: Install UI-only diagnostic helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb=2:21.1.12-1ubuntu1.6 \
            xdotool=1:3.20160805.1-5build1
          test "$(dpkg-query -W -f='${Version}' xvfb)" = 2:21.1.12-1ubuntu1.6
          test "$(dpkg-query -W -f='${Version}' xdotool)" = 1:3.20160805.1-5build1

      - name: Trace 24th display call through E003
        shell: bash
        run: |
          set -euo pipefail
          diag=/tmp/p10-loader-path
          rm -rf "$diag"
          mkdir -p "$diag"
          python3 - <<'PY'
          from pathlib import Path

          row = [0x50e0 + scan*0x100 + col for scan in range(8) for col in range(32)]
          attrs = list(range(0x5ae0,0x5b00))

          def dump(stage, extra=()):
              out=[f"print 0x6100{stage:02x}"]
              out.extend(extra)
              out.append(f"print 0x6200{stage:02x}")
              out.extend(f"print [0x{a:04x}]" for a in row)
              out.append(f"print 0x6300{stage:02x}")
              out.extend(f"print [0x{a:04x}]" for a in attrs)
              out.append(f"print 0x6f00{stage:02x}")
              return out

          c=["base 16",
             "breakpoint 0x5ce7",
             "breakpoint 0x0556",
             "breakpoint 0x5e55",
             "breakpoint 0x5eb4",
             "breakpoint 0x5f2a",
             "breakpoint 0x03b5 if [z80:sp] + 256 * [z80:sp+1] == 0x5f35",
             "breakpoint 0xe003",
             "breakpoint time 0 if spectrum:frames > 6500"]

          c.extend(["commands 1","print 0x61616161","continue","end",
                    "commands 2","print 0x62626262","continue","end",
                    "commands 3","print 0x710003","print [0x5ef7]","print [0x5ef8]",
                    "print [0x5ef5]","print [0x5ef6]","continue","end",
                    "commands 4","print 0x720004","continue","end",
                    "commands 5","print 0x720005","continue","end",
                    "commands 6","print 0x720006","print z80:de","print z80:hl",
                    "print z80:sp","print [z80:sp]","print [z80:sp+1]","continue","end"])
          c.append("commands 7")
          c.extend(dump(5, ("print z80:pc","print [0x5ef7]","print [0x5ef8]",
                            "print [0x5ef5]","print [0x5ef6]")))
          c.extend(["exit 0","end"])
          c.extend(["commands 8","print 0x7f0008","print z80:pc","print spectrum:frames","exit 3","end","continue"])
          Path("/tmp/p10-loader-path/debugger.txt").write_text("\n".join(c)+"\n")
          PY

          Xvfb :99 -screen 0 1280x900x24 >"$diag/xvfb.log" 2>&1 &
          xvfb_pid=$!
          fuse_pid=""
          trap 'kill "$fuse_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          stdbuf -oL -eL tools/runtime/fuse/bin/fuse --machine 48 \
            --rom-48 tools/runtime/fuse/roms/48.rom \
            --tape v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx \
            --no-accelerate-loader --no-fastload --no-traps --no-detect-loader \
            --no-confirm-actions --no-sound \
            --debugger-command "$(cat "$diag/debugger.txt")" \
            >"$diag/fuse-state.log" 2>&1 &
          fuse_pid=$!

          window=""
          for i in $(seq 1 40); do
            window="$(xdotool search --onlyvisible --name '^Fuse$' 2>/dev/null | head -n1 || true)"
            test -n "$window" && break
            sleep 0.25
          done
          test -n "$window"
          xdotool windowfocus --sync "$window" || true
          xdotool mousemove --window "$window" 160 145 click 1 || true
          sleep 0.75
          xdotool keydown Shift_L; sleep 0.25; xdotool keyup Shift_L; sleep 0.60
          xdotool keydown j; sleep 0.45; xdotool keyup j; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool keydown Return; sleep 0.45; xdotool keyup Return

          rom_waiting=""
          for i in $(seq 1 40); do
            if grep -q '0x62626262' "$diag/fuse-state.log"; then rom_waiting=yes; break; fi
            kill -0 "$fuse_pid" 2>/dev/null || break
            sleep 0.25
          done
          test "$rom_waiting" = yes
          xdotool windowfocus --sync "$window" || true
          xdotool key F8

          result=""
          for i in $(seq 1 150); do
            if grep -q '0x610005' "$diag/fuse-state.log"; then result=E003_REACHED; break; fi
            if grep -q '0x7f0008' "$diag/fuse-state.log"; then result=TIMEOUT; break; fi
            kill -0 "$fuse_pid" 2>/dev/null || { result=FUSE_EXITED; break; }
            sleep 1
          done
          wait "$fuse_pid" || true
          fuse_pid=""
          kill "$xvfb_pid" 2>/dev/null || true
          xvfb_pid=""
          trap - EXIT
          test "$result" = E003_REACHED

          python3 - <<'PY'
          import json,re,struct
          from pathlib import Path

          diag=Path("/tmp/p10-loader-path")
          text=(diag/"fuse-state.log").read_text(errors="replace")
          vals=[int(x,16) for x in re.findall(r"0x([0-9a-fA-F]+)",text)]

          hook=[]
          for i,v in enumerate(vals):
              if v==0x710003:
                  hook.append({
                      "lines_left":vals[i+1],
                      "line_index":vals[i+2],
                      "text_ptr":vals[i+3] | (vals[i+4]<<8),
                  })

          def count(value):
              return sum(v==value for v in vals)

          def unique_index(value):
              hits=[i for i,v in enumerate(vals) if v==value]
              if len(hits)!=1:
                  raise SystemExit(f"marker {value:#x} count={len(hits)}")
              return hits[0]

          s5=unique_index(0x610005)
          r5=unique_index(0x620005)
          a5=unique_index(0x630005)
          e5=unique_index(0x6f0005)
          meta=vals[s5+1:r5]
          if len(meta)!=5:
              raise SystemExit(f"E003 metadata length={len(meta)}")
          pc,lines_left,line_index,ptr_lo,ptr_hi=meta
          row23=vals[r5+1:a5]
          attrs23=vals[a5+1:e5]
          if len(row23)!=256 or len(attrs23)!=32:
              raise SystemExit("bad E003 row/attribute dump length")

          # Confirm the finished TZX final loader header remains the special final
          # dispatch tuple: temp 0x9000, logical destination 0xFEAB, after=0xE003.
          import importlib.util,sys
          ip=Path("v1/tools-host/release-tzx/inspect_tzx.py")
          spec=importlib.util.spec_from_file_location("zxux_inspect_diag",ip)
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          data=Path("v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx").read_bytes()
          gen=[mod.generalized_data(b[3]) for b in mod.parse_tzx(data) if b[0]==0x19]
          final_header=gen[-2]
          length,load_addr,dest_addr,zero,check,after,*rest=struct.unpack("<HHHBBHHBHBB",final_header)

          report={
              "hook_invocation_count":len(hook),
              "hook_lines_left":[x["lines_left"] for x in hook],
              "hook_line_indices":[x["line_index"] for x in hook],
              "hook_text_ptrs":[x["text_ptr"] for x in hook],
              "24th_display_invocation_reached":any(x["lines_left"]==1 for x in hook),
              "final_hold_hits":count(0x720004),
              "startup_beep_hits":count(0x720005),
              "loader_rom_beeper_hits":count(0x720006),
              "e003":{
                  "pc":pc,
                  "lines_left":lines_left,
                  "line_index":line_index,
                  "text_ptr":ptr_lo | (ptr_hi<<8),
                  "row23_nonzero_bytes":sum(v!=0 for v in row23),
                  "attrs_unique":sorted(set(attrs23)),
              },
              "final_turbo_header":{
                  "length":length,
                  "load_addr":load_addr,
                  "dest_addr":dest_addr,
                  "after":after,
                  "check":check,
              },
          }
          report["conclusion"]={
              "exactly_23_display_calls":len(hook)==23,
              "calls_enter_with_lines_left_24_through_2":report["hook_lines_left"]==list(range(24,1,-1)),
              "line_indices_0_through_22":report["hook_line_indices"]==list(range(23)),
              "24th_call_missing":report["24th_display_invocation_reached"] is False,
              "final_hold_bypassed":report["final_hold_hits"]==0,
              "startup_beep_bypassed":report["startup_beep_hits"]==0,
              "loader_beeper_bypassed":report["loader_rom_beeper_hits"]==0,
              "e003_reached_with_one_line_remaining":pc==0xe003 and lines_left==1 and line_index==23,
              "e003_text_ptr_at_final_line":report["e003"]["text_ptr"]==0x6272,
              "row23_blank_at_e003":report["e003"]["row23_nonzero_bytes"]==0,
              "row23_attributes_white_on_black":report["e003"]["attrs_unique"]==[7],
              "final_header_dispatches_directly_to_e003":(length,load_addr,dest_addr,after)==(341,0x9000,0xfeab,0xe003),
          }
          (diag/"report.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          if not all(report["conclusion"].values()):
              raise SystemExit("final-block trace did not match the observed skip model")
          PY

      - name: Final fixed-state guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          test -z "$(git status --porcelain)"

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p10-loader-final-block-diagnostic-${{ github.run_id }}
          path: /tmp/p10-loader-path/
          retention-days: 30
          if-no-files-found: warn
