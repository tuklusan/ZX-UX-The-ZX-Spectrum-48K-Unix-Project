name: REV17 native kernel rebuild probe once
# Retry after stage-isolation diagnostics.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-rebuild-probe-once.yml

permissions:
  contents: read

concurrency:
  group: zxux-native-rebuild-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZXUX_SOURCE_EPOCH: current
      ZXUX_EVIDENCE_DIR: /tmp/zxux-r17-native-probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Guard exact current migration head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/tags/PHASE-10-COMPLETE)" = 8360b0c5817738b01dc4b75bb64b12d77341adcd
          test -f v1/dist/certification/R17.00.result.json
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          python3 -m py_compile v1/tools-host/release-tzx/kernel_native_projection.py v1/tools-host/release-tzx/native_rebuild_test.py
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Build canonical kernel and semantic source projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v1/build /tmp/zxux-r17-native-probe
          (
            cd v1/src/kernel
            "$GITHUB_WORKSPACE/tools/runtime/sjasmplus/bin/sjasmplus" \
              --nologo --lst=../../build/kernel-native.lst --sym=../../build/kernel-native.sym kernel.asm
          )
          test "$(wc -c < v1/build/kernel.bin)" -eq 8192
          tools/runtime/python/bin/python v1/tools-host/release-tzx/kernel_native_projection.py \
            --listing v1/build/kernel-native.lst \
            --symbols v1/build/kernel-native.sym \
            --output v1/build/kernel.nsp \
            --audit /tmp/zxux-r17-native-probe/projection.json \
            --kernel v1/build/kernel.bin
      - name: Execute native as OBJ1 ld raw run and mutation-negative proof
        shell: bash
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python v1/tools-host/release-tzx/native_rebuild_test.py \
            --kernel v1/build/kernel.bin \
            --projection v1/build/kernel.nsp \
            --report /tmp/zxux-r17-native-probe/native-rebuild.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/zxux-r17-native-probe/native-rebuild.json").read_text())
          p=json.loads(Path("/tmp/zxux-r17-native-probe/projection.json").read_text())
          assert r["host_kernel_size"]==8192==r["native_rebuilt_kernel_size"]
          assert r["host_kernel_sha256"]==r["native_rebuilt_kernel_sha256"]==p["kernel_oracle_sha256"]
          assert all(v=="PASS" for v in r["assertions"].values())
          assert r["resident_kernel_overwritten"] is False
          assert p["semantic_reference_equals_kernel_oracle"] is True
          PY
          test -z "$(git status --porcelain)"
          echo "ZX-UX REV17 NATIVE REBUILD PROBE PASS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: zxux-r17-native-rebuild-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-r17-native-probe/
          retention-days: 30
          if-no-files-found: warn
