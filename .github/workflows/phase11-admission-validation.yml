name: Phase-11 admission validation

on:
  workflow_dispatch:
    inputs:
      admitted_commit:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADMITTED_COMMIT: ${{ inputs.admitted_commit }}
      ZXUX_REV17_SHA256: d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8
      ZXUX_REV08_SHA256: 97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase11-admission-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.admitted_commit }}
      - name: Validate durable Phase-11 admission chain
        id: chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADMITTED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ADMITTED_COMMIT"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV17.md | awk '{print $1}')" = "$ZXUX_REV17_SHA256"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV08.md | awk '{print $1}')" = "$ZXUX_REV08_SHA256"
          test "$(sha256sum tools/manifest/toolchain.lock.json | awk '{print $1}')" = "$ZXUX_TOOLCHAIN_LOCK_SHA256"
          python3 tools/check_phase10_evidence.py --require-active
          python3 tools/check_media_retention.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          cert=Path("v1/dist/certification")
          for action in ("build","test","result"):
              r=json.loads((cert/f"R17.00.{action}.json").read_text())
              assert r["step"]=="R17.00" and r["action"]==action and r["status"]=="PASS"
              assert r["architecture_sha256"]=="d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8"
              assert r["implementation_plan_sha256"]=="97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c"
          latest=None
          for n in range(1,49):
              step=f"P11.{n:02d}"
              pair=[cert/f"{step}.{action}.json" for action in ("build","test")]
              present=[path.is_file() for path in pair]
              if any(present) and not all(present):
                  raise SystemExit(f"partial admitted evidence: {step}")
              if not any(present):
                  for later in range(n+1,49):
                      if (
                          (cert/f"P11.{later:02d}.build.json").exists()
                          or (cert/f"P11.{later:02d}.test.json").exists()
                      ):
                          raise SystemExit("non-contiguous Phase-11 admission")
                  break
              expected={"R17.00":"PASS"} if n==1 else {f"P11.{n-1:02d}":"PASS"}
              records=[json.loads(path.read_text()) for path in pair]
              source=records[0]["source_commit"]
              for action,record in zip(("build","test"),records):
                  assert record["schema"]==2
                  assert record["step"]==step and record["action"]==action
                  assert record["status"]=="PASS" and record["worktree_clean"] is True
                  assert record["source_commit"]==source
                  assert record["prerequisites"]==expected
                  assert record["architecture_sha256"]=="d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8"
                  assert record["implementation_plan_sha256"]=="97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c"
              latest=step
          if latest is None:
              raise SystemExit("no admitted Phase-11 evidence")
          if latest=="P11.48":
              result=json.loads((cert/"P11.48.result.json").read_text())
              assert result["schema"]==2 and result["step"]=="P11.48"
              assert result["action"]=="result" and result["status"]=="PASS"
              assert result["pass_marker"]=="ZX-UX PHASE 11 ACCEPTANCE PASS"
              assert result["prerequisites"]=={"P11.47":"PASS"}
              assert result["architecture_sha256"]=="d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8"
              assert result["implementation_plan_sha256"]=="97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c"
          print(f"latest={latest}")
          PY
      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Revalidate latest admitted Phase-11 step
        run: |
          set -euo pipefail
          py=tools/runtime/python/bin/python
          "$py" v1/tools-host/test-driver/run.py build --step "${{ steps.chain.outputs.latest }}"
          "$py" v1/tools-host/test-driver/run.py test --step "${{ steps.chain.outputs.latest }}"
          test -z "$(git status --porcelain)"
