name: ZX-UX Phase 3 Aggregate Validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase3-finalization.yml
      - tools/finalize_phase3_evidence.py
      - tools/check_phase3_evidence.py
      - tools/test_phase3_evidence_negative.py
      - v1/dist/certification/P3.*.json
      - v1/dist/certification/phase-3.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zxux-phase3-aggregate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase3-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mandatory policy gates
        run: |
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Generate missing Phase 3 aggregate
        if: hashFiles('v1/dist/certification/phase-3.json') == ''
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR"
          python3 tools/finalize_phase3_evidence.py \
            --root "$GITHUB_WORKSPACE" \
            --output "$ZXUX_EVIDENCE_DIR/phase-3.json"
          test -s "$ZXUX_EVIDENCE_DIR/phase-3.json"
          grep -q '"status": "PASS"' "$ZXUX_EVIDENCE_DIR/phase-3.json"
          grep -q 'ZX-UX PHASE 3 CERTIFICATION PASS' "$ZXUX_EVIDENCE_DIR/phase-3.json"

      - name: Validate active Phase 3 aggregate
        if: hashFiles('v1/dist/certification/phase-3.json') != ''
        run: |
          python3 tools/check_phase3_evidence.py --require-active
          python3 tools/test_phase3_evidence_negative.py

      - name: Upload exact aggregate evidence
        if: hashFiles('v1/dist/certification/phase-3.json') == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-phase3-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-phase3-aggregate-${{ github.run_id }}-${{ github.run_attempt }}/phase-3.json
          retention-days: 90
          if-no-files-found: error
