name: P6.24 qualification
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p624-qualification
      P624_BASE: 620690af0de5228ed2471fc0c2dc20362d79fabb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Guard exact P6.24 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P624_BASE" HEAD | sort > /tmp/p624-changed
          printf '%s\n' \
            .github/workflows/p624-qualification.yml \
            v1/src/shell/sh.asm \
            v1/tools-host/test-driver/phase6_jobs.py \
            v1/tools-host/test-driver/run.py | sort > /tmp/p624-expected
          diff -u /tmp/p624-expected /tmp/p624-changed
          git diff --check "$P624_BASE" HEAD
          test -z "$(git status --porcelain)"
      - name: Mandatory gates
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase5_evidence.py --require-active
          python3 - <<'PY'
          import json
          from pathlib import Path
          for a in ("build","test"):
              r=json.loads(Path(f"v1/dist/certification/P6.22.{a}.json").read_text())
              assert r["step"]=="P6.22" and r["action"]==a and r["status"]=="PASS"
              assert r["source_commit"]=="9a6a798472f061ab4508a6f6eea065f97b41ccc0"
          PY
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Execute P6.24 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P6.24
      - name: Execute P6.24 test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P6.24
      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR/meta"
          git rev-parse HEAD > "$ZXUX_EVIDENCE_DIR/meta/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$ZXUX_EVIDENCE_DIR/meta/candidate-tree.txt"
          git status --porcelain > "$ZXUX_EVIDENCE_DIR/meta/worktree-status.txt"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p624-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p624-qualification/
          retention-days: 90
          if-no-files-found: error
      - name: Dispatch exact admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          p=json.dumps({"ref":"main","inputs":{"step":"P6.24","run_id":os.environ["GITHUB_RUN_ID"],"source_commit":os.environ["GITHUB_SHA"]}}).encode()
          q=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/phase6-step-admission.yml/dispatches",data=p,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(q,timeout=30) as r: assert r.status==204
          PY
