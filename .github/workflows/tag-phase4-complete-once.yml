name: Create PHASE-4-COMPLETE tag once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-phase4-complete-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create immutable Phase 4 completion tag
        env:
          TARGET_SHA: 69a41a075969cb4f026128ea83af4076389bd5bb
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/PHASE-4-COMPLETE >/dev/null; then
            test "$(git rev-list -n1 PHASE-4-COMPLETE)" = "$TARGET_SHA"
            exit 0
          fi
          git tag PHASE-4-COMPLETE "$TARGET_SHA"
          git push origin refs/tags/PHASE-4-COMPLETE
          test "$(git rev-list -n1 PHASE-4-COMPLETE)" = "$TARGET_SHA"
