name: P2.22 formal admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p222-admit-qualified.yml

permissions:
  contents: write

jobs:
  admit:
    if: github.event.head_commit.message == 'P2.22 stage formal admission'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_MAIN: a1138391c913581dfaf20751520a188ad4d89b1a
      QUALIFIED_SOURCE_COMMIT: df312c9d944aab0333599c290cfde68f2638c9b3
      QUALIFIED_TREE: 696950498ec95000ca3af7f6ca9d1049dea9da15
      PROCESS_BLOB: 15ebbdb485d789b4a450c8b0c8b79970baa940e8
      MEMORY_BLOB: b96dcc68a5a155f7d4ea8252102ced30fa00f4d7
      PROCESS_SHA256: ed4b11954900235ce44cd67577a24f917fbf89a700bae2092947bfd7b0a3dcd1
      MEMORY_SHA256: 290e34e60b37f22bf89446b43e851a1d1ae0e087f09af801743937f734d9d4ab
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p222-admission

    steps:
      - name: Checkout staging head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact staging ancestry and qualified source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${BASE_MAIN}"
          git diff --name-only "${BASE_MAIN}" "${GITHUB_SHA}" | sort > /tmp/stage-changed
          printf '%s\n' .github/workflows/p222-admit-qualified.yml > /tmp/stage-expected
          diff -u /tmp/stage-expected /tmp/stage-changed
          test "$(git rev-parse "${QUALIFIED_SOURCE_COMMIT}^{tree}")" = "${QUALIFIED_TREE}"
          test "$(git rev-parse "HEAD:v1/src/kernel/process.asm")" = "${PROCESS_BLOB}"
          test "$(git rev-parse "HEAD:v1/src/kernel/memory.asm")" = "${MEMORY_BLOB}"
          test "$(sha256sum v1/src/kernel/process.asm | awk '{print $1}')" = "${PROCESS_SHA256}"
          test "$(sha256sum v1/src/kernel/memory.asm | awk '{print $1}')" = "${MEMORY_SHA256}"
          git diff --name-only "${QUALIFIED_SOURCE_COMMIT}" "${BASE_MAIN}" | sort > /tmp/post-qualified-changed
          printf '%s\n' .github/workflows/candidate-kernel.yml > /tmp/post-qualified-expected
          diff -u /tmp/post-qualified-expected /tmp/post-qualified-changed

      - name: Materialize exact P2.22 admission bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gate_path = Path('v1/tools-host/test-driver/phase2_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          old = '''CANDIDATE_STEPS: tuple[str, ...] = ("P2.08", "P2.09", "P2.10", "P2.11", "P2.12", "P2.13", "P2.14", "P2.15", "P2.16", "P2.17", "P2.18", "P2.19", "P2.20", "P2.21")
          # P2.16 through P2.21 are intentionally included in the exact-head aggregate certification gate.
          # P2.17 fixture constants are now explicit staged-fixture dependencies, matching their kernel definitions.
          # P2.21 keeps production kernel bytes unchanged while qualifying the exact SYS_PROC_INFO/PINFOQ1 and PROC1 packed ABI.
          '''
          new = '''CANDIDATE_STEPS: tuple[str, ...] = ("P2.08", "P2.09", "P2.10", "P2.11", "P2.12", "P2.13", "P2.14", "P2.15", "P2.16", "P2.17", "P2.18", "P2.19", "P2.20", "P2.21", "P2.22")
          # P2.16 through P2.22 are intentionally included in the exact-head aggregate certification gate.
          # P2.17 fixture constants are now explicit staged-fixture dependencies, matching their kernel definitions.
          # P2.21 keeps production kernel bytes unchanged while qualifying the exact SYS_PROC_INFO/PINFOQ1 and PROC1 packed ABI.
          # P2.22 retains the assembler-marker/emitted-link and allocator-normalization qualification recipe in
          # .github/workflows/p222-qualification.yml while the aggregate gate continuously re-runs its build/test contract.
          '''
          if gate.count(old) != 1:
              raise SystemExit('P2.22 admission fail-closed: phase2 gate anchor mismatch')
          gate_path.write_text(gate.replace(old, new, 1), encoding='utf-8', newline='\n')

          qualification_path = Path('.github/workflows/p222-qualification.yml')
          qualification = qualification_path.read_text(encoding='utf-8')
          old_on = '''on:
            push:
              branches:
                - main
              paths:
                - .github/workflows/p222-qualification.yml
                - v1/src/kernel/process.asm
                - v1/src/kernel/memory.asm
                - v1/tests/multiprocessing/p222-spawn-exit-leak.asm
                - v1/tools-host/test-driver/phase2_spawn_exit_leak.py
                - v1/tools-host/test-driver/run.py
            workflow_dispatch:
          '''
          new_on = '''# This is the preserved P2.22 exact-candidate qualification recipe. Qualification
          # run 35269089025 produced candidate tree 696950498ec95000ca3af7f6ca9d1049dea9da15;
          # that exact tree was promoted as df312c9d944aab0333599c290cfde68f2638c9b3.
          # P2.22 is thereafter regression-checked by the Phase-2 aggregate. Keep this
          # recipe manually dispatchable without re-running its historical parent/diff guard.
          on:
            workflow_dispatch:
          '''
          if qualification.count(old_on) != 1:
              raise SystemExit('P2.22 admission fail-closed: qualification trigger anchor mismatch')
          qualification_path.write_text(qualification.replace(old_on, new_on, 1), encoding='utf-8', newline='\n')

          kernel_path = Path('.github/workflows/candidate-kernel.yml')
          kernel = kernel_path.read_text(encoding='utf-8')
          trigger = '# P2.22 canonical runner trigger; restored exactly by the following trigger commit.\n'
          if kernel.count(trigger) != 1:
              raise SystemExit('P2.22 admission fail-closed: kernel trigger marker mismatch')
          kernel_path.write_text(kernel.replace(trigger, '', 1), encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/p222-admit-qualified.yml
          git diff --check
          git diff --name-only "${BASE_MAIN}" | sort > /tmp/final-changed
          printf '%s\n'             .github/workflows/candidate-kernel.yml             .github/workflows/p222-qualification.yml             v1/tools-host/test-driver/phase2_gate.py             | sort > /tmp/final-expected
          diff -u /tmp/final-expected /tmp/final-changed
          test "$(git hash-object v1/src/kernel/process.asm)" = "${PROCESS_BLOB}"
          test "$(git hash-object v1/src/kernel/memory.asm)" = "${MEMORY_BLOB}"

      - name: Three unchanged exact-byte scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git diff --check
            python3 -m py_compile v1/tools-host/test-driver/phase2_gate.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -Fq '"P2.21", "P2.22")' v1/tools-host/test-driver/phase2_gate.py
            grep -Fq 'run 35269089025 produced candidate tree 696950498ec95000ca3af7f6ca9d1049dea9da15' .github/workflows/p222-qualification.yml
            grep -Fqx '  workflow_dispatch:' .github/workflows/p222-qualification.yml
            if grep -Fq 'P2.22 canonical runner trigger' .github/workflows/candidate-kernel.yml; then
              exit 1
            fi
            test "$(git hash-object v1/src/kernel/process.asm)" = "${PROCESS_BLOB}"
            test "$(git hash-object v1/src/kernel/memory.asm)" = "${MEMORY_BLOB}"
            digest="$(sha256sum               .github/workflows/candidate-kernel.yml               .github/workflows/p222-qualification.yml               v1/tools-host/test-driver/phase2_gate.py               | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "SCAN-${scan}: CLEAN ${digest}"
          done

      - name: Mandatory project gates on final worktree
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev             libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Prove preserved assembler-marker semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          cat >/tmp/p222-admission-marker.asm <<'ASM'
                  ORG $8000
          P222_ADMIT_EQU EQU 1
                  IFDEF P222_ADMIT_EQU
                  DB $E1
                  ELSE
                  DB $E0
                  ENDIF
                  MACRO P222_ADMIT_DEFINE
                      DEFINE P222_ADMIT_SYMBOL 1
                  ENDM
                  P222_ADMIT_DEFINE
                  IFDEF P222_ADMIT_SYMBOL
                  DB $D1
                  ELSE
                  DB $D0
                  ENDIF
          ASM
          tools/runtime/sjasmplus/bin/sjasmplus --nologo --raw=/tmp/p222-admission-marker.bin /tmp/p222-admission-marker.asm
          tools/runtime/python/bin/python - <<'PY'
          from pathlib import Path
          payload=Path('/tmp/p222-admission-marker.bin').read_bytes()
          if payload != bytes((0xE0,0xD1)):
              raise SystemExit(f'P2.22 ADMISSION MARKER FAIL {payload.hex()}')
          process=Path('v1/src/kernel/process.asm').read_bytes()
          if process.count(b'ZX48_P2_13_LINKS_EMITTED EQU 1') != 0:
              raise SystemExit('P2.22 ADMISSION MARKER FAIL legacy EQU remains')
          if process.count(b'    DEFINE ZX48_P2_13_LINKS_EMITTED 1') != 1:
              raise SystemExit('P2.22 ADMISSION MARKER FAIL DEFINE multiplicity')
          print('P2.22 ADMISSION MARKER PASS EQU-is-not-IFDEF DEFINE-is-IFDEF')
          PY

      - name: Execute exact-head Phase-2 gate through P2.22
        shell: bash
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/phase2_gate.py             2>&1 | tee "${ZXUX_EVIDENCE_DIR}/phase2-through-p222.log"

      - name: Prove emitted production spawn link on admitted candidate
        shell: bash
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python - <<'PY'             2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.admission-link-proof.log"
          from pathlib import Path
          import sys
          root=Path.cwd()
          sys.path.insert(0,str(root/'v1/tools-host/test-driver'))
          import phase2_spawn_exit_leak as p222
          symbols=p222._symbols(
              root/'v1/build/p222-spawn-exit-leak.sym',
              ('zx48_process_link_child','zx48_process_spawn_transaction','zx48_process_spawn_rollback'),
          )
          fixture=(root/'v1/build/p222-spawn-exit-leak.bin').read_bytes()
          start=symbols['zx48_process_spawn_transaction']-p222.FIXTURE_CODE
          stop=symbols['zx48_process_spawn_rollback']-p222.FIXTURE_CODE
          p222.require(0 <= start < stop <= len(fixture),'P2.22 admission spawn range outside fixture')
          needle=b'\xCD'+p222._word(symbols['zx48_process_link_child'])
          hits=[]
          pos=fixture.find(needle,start,stop)
          while pos != -1:
              hits.append(p222.FIXTURE_CODE+pos)
              pos=fixture.find(needle,pos+1,stop)
          p222.require(len(hits)==1,f'P2.22 admission expected exactly one link-child CALL, hits={hits!r}')
          print(f'P2.22 ADMISSION LINK PASS assembled-call=0x{hits[0]:04X}')
          print('P2.22 ADMISSION LEGACY-ELSE-NOT-SELECTED PASS')
          PY

      - name: Recheck final invariants and commit admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object v1/src/kernel/process.asm)" = "${PROCESS_BLOB}"
          test "$(git hash-object v1/src/kernel/memory.asm)" = "${MEMORY_BLOB}"
          python3 - <<'PY'
          from pathlib import Path
          memory=Path('v1/src/kernel/memory.asm').read_bytes()
          repaired=(
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          if memory.count(repaired) != 1:
              raise SystemExit('P2.22 ADMISSION allocator normalization invariant failed')
          PY
          git add .github/workflows/candidate-kernel.yml .github/workflows/p222-qualification.yml v1/tools-host/test-driver/phase2_gate.py
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-final
          printf '%s\n'             .github/workflows/candidate-kernel.yml             .github/workflows/p222-admit-qualified.yml             .github/workflows/p222-qualification.yml             v1/tools-host/test-driver/phase2_gate.py             | sort > /tmp/staged-expected
          diff -u /tmp/staged-expected /tmp/staged-final
          git -c user.name='Supratim Sanyal'               -c user.email='tuklusan@users.noreply.github.com'               commit -m 'P2.22 admit repeated spawn-exit leak gate'
          git diff --name-only "${BASE_MAIN}" HEAD | sort > /tmp/cumulative-final
          printf '%s\n'             .github/workflows/candidate-kernel.yml             .github/workflows/p222-qualification.yml             v1/tools-host/test-driver/phase2_gate.py             | sort > /tmp/cumulative-expected
          diff -u /tmp/cumulative-expected /tmp/cumulative-final
          test -z "$(git status --porcelain)"
          echo "P2.22 ADMISSION CANDIDATE PASS commit=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"

      - name: Fast-forward canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          git push origin HEAD:main
