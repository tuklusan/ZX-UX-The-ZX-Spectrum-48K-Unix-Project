name: Phase-11 pre-release REV02 Product Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p11-prerelease-rev02-product-tools.yml'
      - 'tools/p11-prerelease-rev02/product_tools.py'
      - 'v1/src/shell/sh.asm'
      - 'v1/src/tools/cc.asm'
      - 'tools/as.asm'
      - 'tools/as_text.asm'
      - 'tools/ld.asm'
      - 'v1/src/libc48/runtime_archive.asm'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zxux-p11-prerelease-rev02-product-tools
  cancel-in-progress: false

jobs:
  product-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Policy and license gates
        run: |
          set -euo pipefail
          ./tools/check_project_policy.py
          ./tools/check_license_headers.sh
      - name: Set up certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Build deterministic product-tool packaging preflight
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python tools/p11-prerelease-rev02/product_tools.py \
            --root . --output /tmp/rev02-product-tools
      - name: Reject historical source-bound helpers from product closure
        run: |
          set -euo pipefail
          ! grep -R 'EMIT_P11PR_CC_SDK_CORPUS_COMPILER\|cc_p11pr_' /tmp/rev02-product-tools/sh-product-preflight.asm
      - name: Upload product-tool preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p11-prerelease-rev02-product-tools-${{ github.sha }}
          path: /tmp/rev02-product-tools/
          retention-days: 90
          if-no-files-found: error
      - name: Upload REV02 source/runtime workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p11-prerelease-rev02-workspace-${{ github.sha }}
          path: |
            docs/
            scratch/ZX-UX-PHASE-11-PRE-RELEASE-RUNBOOK-REV02.md
            tools/
            v1/include/
            v1/src/
            v1/tools-host/
            .github/actions/setup-zxux-runtime/
          retention-days: 7
          if-no-files-found: error
