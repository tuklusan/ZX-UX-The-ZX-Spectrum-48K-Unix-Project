name: P2.13 process-only E0 diagnostic

on:
  push:
    branches:
      - p213-diag13

permissions:
  contents: write

concurrency:
  group: p213-diag13
  cancel-in-progress: false

jobs:
  e0:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE_SHA: a8a8a6deb7cb877640d8d7c84aea1140d5569c52
      HIST_SHA: e92457e179ac14fb404cefb7043d597f1c4c69af
      ZXUX_EVIDENCE_DIR: /tmp/p213-evidence
    steps:
      - name: Checkout instrumentation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preserve instrumentation and recover reviewed inputs
        shell: bash
        run: |
          set -euo pipefail
          cp .p213-worker/process_only_correct.py /tmp/process_only_correct.py
          cp .p213-worker/p213_stage_diag.py /tmp/p213_stage_diag.py
          test "$(git hash-object .p213-worker/process_only_correct.py)" = "$(git rev-parse HEAD:.p213-worker/process_only_correct.py)"
          test "$(git hash-object .p213-worker/p213_stage_diag.py)" = "$(git rev-parse HEAD:.p213-worker/p213_stage_diag.py)"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HIST_SHA}/.p213-worker"
          curl -fsSL "$raw/p213_macro.asm" -o /tmp/p213_macro.asm
          curl -fsSL "$raw/p213_patch.py" -o /tmp/p213_patch.py
          curl -fsSL "$raw/p213_root_fix.py" -o /tmp/p213_root_fix.py
          curl -fsSL "$raw/phase2_parent_child.py" -o /tmp/phase2_parent_child.py
          test "$(git hash-object /tmp/p213_macro.asm)" = 5fcd7b6ae8a9dc57adad88928a126e9d5a8f1a1f
          test "$(git hash-object /tmp/p213_patch.py)" = f7a74cadecbd17eb1fb769f2bf8e4e2fa5e79e2f
          test "$(git hash-object /tmp/p213_root_fix.py)" = c6adb3a935e496fdb36215c10c985b3b8be2c2fa
          test "$(git hash-object /tmp/phase2_parent_child.py)" = c40a0795af41135220fbb5a43f3a23af4a51818e
          python3 -m py_compile /tmp/process_only_correct.py /tmp/p213_stage_diag.py /tmp/p213_patch.py /tmp/p213_root_fix.py /tmp/phase2_parent_child.py

      - name: Detach exact canonical base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize fresh four-path candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/p213_root_fix.py
          python3 /tmp/p213_patch.py
          git checkout "$BASE_SHA" -- \
            v1/tools-host/test-driver/phase2_exec.py \
            v1/tools-host/test-driver/phase2_exec_runtime.py \
            v1/tools-host/test-driver/phase2_spawn_atomic.py
          python3 /tmp/process_only_correct.py
          expected=$'v1/src/kernel/process.asm\nv1/tools-host/test-driver/phase2_gate.py\nv1/tools-host/test-driver/phase2_parent_child.py\nv1/tools-host/test-driver/run.py'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          test "$actual" = "$expected"
          git diff --check
          test "$(git rev-parse "$BASE_SHA":v1/tools-host/test-driver/phase2_exec.py)" = 2c2c3c10d951f3af0a558a0ff8bb2e77c2c832e5
          test "$(git rev-parse "$BASE_SHA":v1/tools-host/test-driver/phase2_exec_runtime.py)" = 2cfbd7d195bfce5e0c32ba1920d336edae8c4198
          test "$(git rev-parse "$BASE_SHA":v1/tools-host/test-driver/phase2_spawn_atomic.py)" = 2725059c4b29845e525f638e4421967f46fc96c0
          test "$(git hash-object v1/tools-host/test-driver/phase2_exec.py)" = 2c2c3c10d951f3af0a558a0ff8bb2e77c2c832e5
          test "$(git hash-object v1/tools-host/test-driver/phase2_exec_runtime.py)" = 2cfbd7d195bfce5e0c32ba1920d336edae8c4198
          test "$(git hash-object v1/tools-host/test-driver/phase2_spawn_atomic.py)" = 2725059c4b29845e525f638e4421967f46fc96c0
          sha256sum \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/phase2_gate.py \
            v1/tools-host/test-driver/phase2_parent_child.py \
            v1/tools-host/test-driver/run.py | tee /tmp/p213-candidate-sha256.txt
          git diff "$BASE_SHA" -- > /tmp/p213-candidate.patch

      - name: Audit P2.13 spawn linkage ownership
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/p213-spawn-rollback-audit.log
          from pathlib import Path

          process = Path("v1/src/kernel/process.asm").read_text(encoding="utf-8")
          start = process.index("    MACRO EMIT_SPAWN_TRANSACTION_ROUTINES")
          end = process.index("    ENDM\n", start)
          spawn = process[start:end]
          marker = spawn.index("    IFDEF ZX48_P2_13_LINKS_EMITTED")
          branch_end = spawn.index("    ELSE", marker)
          active = spawn[marker:branch_end]
          helper_call = "call zx48_process_link_child" in active
          external_clear = "ld hl,(process_spawn_child_desc)" in active

          link_start = process.index("zx48_process_link_child:\n")
          link_end = process.index("zx48_process_generation_exhausted:\n", link_start)
          link = process[link_start:link_end]
          bump_index = link.index("call zx48_process_generation_bump")
          reset_index = link.index("ld bc,PROC_DESC_SIZE-1")
          parent_index = link.index("ld (ix+PROC_PARENT),a")
          helper_order_ok = bump_index < reset_index < parent_index

          print(
              "P2.13 spawn linkage audit: "
              f"helper_call={helper_call} external_clear={external_clear} "
              f"helper_order_ok={helper_order_ok}"
          )
          if not helper_call or external_clear or not helper_order_ok:
              raise SystemExit(
                  "P2.13 spawn linkage audit FAIL: descriptor reset must live inside the "
                  "dynamically exercised link helper after generation bump and before parent publication"
              )
          print("P2.13 spawn linkage audit PASS")
          PY

      - name: License and policy preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Commit isolated clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Supratim Sanyal"
          git config user.email "tuklusan@users.noreply.github.com"
          git add -- \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/phase2_gate.py \
            v1/tools-host/test-driver/phase2_parent_child.py \
            v1/tools-host/test-driver/run.py
          git commit -m "P2.13 clean candidate for certification"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          expected=$'v1/src/kernel/process.asm\nv1/tools-host/test-driver/phase2_gate.py\nv1/tools-host/test-driver/phase2_parent_child.py\nv1/tools-host/test-driver/run.py'
          actual="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$candidate_sha" | tee /tmp/p213-candidate-commit.txt
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          git push --force origin HEAD:refs/heads/p213-clean-candidate

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gettext libaudiofile-dev libfreetype6-dev \
            libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool \
            libxml2-dev perl pkg-config

      - name: Acquire and certify pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "P2.13 pinned-runtime bootstrap attempt ${attempt}/3"
            set +e
            python3 tools/scripts/bootstrap-environment.py 2>&1 | tee "/tmp/p213-bootstrap-attempt-${attempt}.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              success=1
              break
            fi
            echo "P2.13 pinned-runtime bootstrap attempt ${attempt} failed rc=${rc}"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          test "$success" -eq 1
          tools/runtime/python/bin/python tools/scripts/verify-environment.py 2>&1 | tee /tmp/p213-runtime-verify.log

      - name: Exact P2.13 target build and test
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          {
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.13
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.13
          } 2>&1 | tee /tmp/p213-target.log

      - name: Diagnose P2.13 runtime stages
        if: steps.target.outcome == 'failure'
        shell: bash
        run: |
          set +e
          tools/runtime/python/bin/python /tmp/p213_stage_diag.py 2>&1 | tee /tmp/p213-stage-diagnostic.log
          exit 0

      - name: Enforce target result
        if: steps.target.outcome == 'failure'
        run: exit 1

      - name: Dependent Phase 2 gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          set -o pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/phase2_gate.py 2>&1 | tee /tmp/p213-phase2-gate.log

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          tar -C /tmp -czf /tmp/p213-evidence.tgz p213-evidence 2>/dev/null
          exit 0

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p213-process-only-e0-${{ github.run_id }}
          path: |
            /tmp/p213-candidate-commit.txt
            /tmp/p213-candidate.patch
            /tmp/p213-candidate-sha256.txt
            /tmp/p213-spawn-rollback-audit.log
            /tmp/p213-bootstrap-attempt-*.log
            /tmp/p213-runtime-verify.log
            /tmp/p213-target.log
            /tmp/p213-phase2-gate.log
            /tmp/p213-stage-diagnostic.log
            /tmp/p213-evidence.tgz
          retention-days: 30
          if-no-files-found: warn
