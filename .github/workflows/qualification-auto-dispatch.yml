name: ZX-UX Qualification Auto-Dispatch
on:
  workflow_run:
    workflows: ["ZX-UX Exact-Head Regression"]
    types: [completed]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: zxux-qualification-auto-dispatch
  cancel-in-progress: true
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require exact current main head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --quiet origin main
          if test "$(git rev-parse origin/main)" != "$CANDIDATE_SHA"; then
            echo "ZX-UX QUALIFICATION AUTO-DISPATCH SKIP superseded=$CANDIDATE_SHA current=$(git rev-parse origin/main)"
            exit 0
          fi
      - name: Detect exactly one due qualification
        id: detect
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/zxux-qualification-detect.json
          import json,re,subprocess
          from pathlib import Path
          root=Path("."); cert=root/"v1/dist/certification"
          file_re=re.compile(r"^p(\d+)(\d{2})(?:-[a-z0-9-]+)?-qualification\.yml$")
          base_re=re.compile(r"(?m)^\s+([A-Z0-9]+_BASE):\s*([0-9a-f]{40})\s*$")
          def fail(msg): raise SystemExit("ZX-UX QUALIFICATION AUTO-DISPATCH FAIL: "+msg)
          def git(*args):
              p=subprocess.run(["git",*args],text=True,capture_output=True)
              if p.returncode: fail(p.stderr.strip() or "git failure")
              return p.stdout.strip()
          def dispatch_only(text):
              lines=text.splitlines()
              try: start=lines.index("on:")+1
              except ValueError: return False
              keys=[]
              for line in lines[start:]:
                  if not line.strip() or line.lstrip().startswith("#"): continue
                  if not line[0].isspace(): break
                  if line.startswith("  ") and not line.startswith("    "): keys.append(line.strip().rstrip(":"))
              return keys==["workflow_dispatch"]
          def expected_paths(text):
              marker="printf '%s\\n' \\"
              start=text.find(marker)
              if start<0: fail("guarded expected-file list missing")
              tail=text[start+len(marker):]; end=tail.find("| sort > /tmp/expected")
              if end<0: fail("guarded expected-file terminator missing")
              out=[]
              for raw in tail[:end].splitlines():
                  item=raw.strip()
                  if not item: continue
                  if item.endswith("\\"): item=item[:-1].rstrip()
                  item=item.strip("'\"")
                  if item: out.append(item)
              if not out: fail("empty expected-file list")
              return sorted(set(out))
          def admitted(step):
              paths=[cert/f"{step}.build.json",cert/f"{step}.test.json"]; present=[p.is_file() for p in paths]
              if any(present) and not all(present): fail(f"partial admitted evidence for {step}")
              if not all(present): return False
              for action,path in zip(("build","test"),paths):
                  d=json.loads(path.read_text())
                  if d.get("step")!=step or d.get("action")!=action or d.get("status")!="PASS" or d.get("worktree_clean") is not True: fail(f"invalid admitted evidence {path}")
              return True
          due=[]
          for path in sorted((root/".github/workflows").glob("*-qualification.yml")):
              m=file_re.fullmatch(path.name)
              if not m: continue
              step=f"P{int(m.group(1))}.{m.group(2)}"
              if admitted(step): continue
              text=path.read_text(encoding="utf-8")
              if not dispatch_only(text): continue
              bases=base_re.findall(text)
              if len(bases)!=1: fail(f"{path}: expected exactly one immutable *_BASE")
              changed=sorted(x for x in git("diff","--name-only",bases[0][1],"HEAD").splitlines() if x)
              if changed==expected_paths(text): due.append((step,path.name))
          if len(due)>1: fail(f"multiple due qualifications: {due!r}")
          print(json.dumps({"due":bool(due),"step":due[0][0] if due else "","workflow":due[0][1] if due else "","head":git("rev-parse","HEAD")}))
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("/tmp/zxux-qualification-detect.json"))
          print(f"due={'true' if d['due'] else 'false'}"); print(f"step={d['step']}"); print(f"workflow={d['workflow']}"); print(f"head={d['head']}")
          PY
      - name: Dispatch exact candidate qualification
        if: steps.detect.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_STEP: ${{ steps.detect.outputs.step }}
          QUALIFICATION_WORKFLOW: ${{ steps.detect.outputs.workflow }}
          QUALIFICATION_HEAD: ${{ steps.detect.outputs.head }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_HEAD" = "$CANDIDATE_SHA"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$QUALIFICATION_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=50" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next((str(r["id"]) for r in d["workflow_runs"] if r["head_sha"]==os.environ["CANDIDATE_SHA"]), ""))')"
          if test -n "$existing"; then echo "ZX-UX QUALIFICATION AUTO-DISPATCH SKIP existing_run=$existing step=$QUALIFICATION_STEP"; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/$QUALIFICATION_WORKFLOW/dispatches" -f ref=main
          echo "ZX-UX QUALIFICATION AUTO-DISPATCH PASS step=$QUALIFICATION_STEP head=$QUALIFICATION_HEAD"
