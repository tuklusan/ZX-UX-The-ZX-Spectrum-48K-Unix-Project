name: Phase-11 pre-release REV02 Stage C

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p11-prerelease-rev02-stage-c.yml'
      - 'tools/p11-prerelease-rev02/stage_c.py'
      - 'tools/p11-prerelease-rev02/kernel_closure_probe.py'
      - 'tools/p11-prerelease-rev02/product_tools.py'
      - 'tools/p11-prerelease/sdk_acquire.py'
      - 'docs/01-ZX-UX-ARCHITECTURE-REV17.md'
      - 'docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV08.md'
      - 'docs/01-ZX-UX-ARCHITECTURE-REV18.md'
      - 'docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV09.md'
      - 'v1/src/boot/**'
      - 'v1/src/kernel/**'
      - 'v1/src/shell/sh.asm'
      - 'v1/src/tools/cc.asm'
      - 'v1/src/libc48/runtime_archive.asm'
      - 'tools/as.asm'
      - 'tools/as_text.asm'
      - 'tools/ld.asm'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: zxux-p11-prerelease-rev02-stage-c
  cancel-in-progress: false

jobs:
  stage-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Set up certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Build deterministic ordinary product tools
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python tools/p11-prerelease-rev02/product_tools.py \
            --root . --output /tmp/rev02-product-tools
      - name: Measure current resident-kernel closure lower bound
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python tools/p11-prerelease-rev02/kernel_closure_probe.py \
            --root . --output /tmp/rev02-kernel-probe
      - name: Acquire exact SDK 1.0.2 release corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/p11-prerelease/sdk_acquire.py acquire --output /tmp/rev02-sdk-reference
      - name: Reproduce current ordinary-product root blockers
        run: |
          set -euo pipefail
          python3 tools/p11-prerelease-rev02/stage_c.py \
            --root . --sdk-root /tmp/rev02-sdk-reference --output /tmp/rev02-stage-c \
            --kernel-probe /tmp/rev02-kernel-probe/KERNEL-CLOSURE-PROBE.json \
            --product-tools-report /tmp/rev02-product-tools/PRODUCT-TOOLS-PREFLIGHT.json
      - name: Upload Stage-C gap inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p11-prerelease-rev02-stage-c-${{ github.sha }}
          path: |
            /tmp/rev02-stage-c/
            /tmp/rev02-kernel-probe/
          retention-days: 90
          if-no-files-found: error
