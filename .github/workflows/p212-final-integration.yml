name: P2.12 One-Shot Canonical Source Integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p212-final-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move P2.12 transaction into process.asm and rewire certification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          process_path = Path('v1/src/kernel/process.asm')
          include_path = Path('v1/src/kernel/phase2_exec.inc')
          driver_path = Path('v1/tools-host/test-driver/phase2_exec.py')
          runtime_path = Path('v1/tools-host/test-driver/phase2_exec_runtime.py')

          process = process_path.read_text(encoding='utf-8')
          inc = include_path.read_text(encoding='utf-8')
          driver = driver_path.read_text(encoding='utf-8')
          runtime = runtime_path.read_text(encoding='utf-8')

          macro = '    MACRO EMIT_EXEC_TRANSACTION_ROUTINES'
          assert process.count(macro) == 0, process.count(macro)
          assert inc.count(macro) == 1, inc.count(macro)
          section_marker = '; P2.12 staged SYS_EXEC atomic replacement transaction.'
          assert inc.count(section_marker) == 1, inc.count(section_marker)
          section = inc[inc.index(section_marker):].strip() + '\n'
          process = process.rstrip() + '\n\n\n' + section
          assert process.count(macro) == 1
          process_path.write_text(process, encoding='utf-8', newline='\n')

          old_static = '    source = (root / "v1/src/kernel/phase2_exec.inc").read_text(encoding="utf-8")\n'
          new_static = (
              '    process = (root / "v1/src/kernel/process.asm").read_text(encoding="utf-8")\n'
              '    start = process.index("    MACRO EMIT_EXEC_TRANSACTION_ROUTINES")\n'
              '    end = process.index("    ENDM\\n", start)\n'
              '    source = process[start:end]\n'
          )
          assert driver.count(old_static) == 1, driver.count(old_static)
          driver = driver.replace(old_static, new_static)

          include_literal = '        "    INCLUDE \\\"../src/kernel/phase2_exec.inc\\\"\\n"\n'
          assert driver.count(include_literal) == 1, driver.count(include_literal)
          driver = driver.replace(include_literal, '')
          assert runtime.count(include_literal) == 1, runtime.count(include_literal)
          runtime = runtime.replace(include_literal, '')

          old_hash = '        "v1/src/kernel/phase2_exec.inc": kwargs["sha256_file"](root / "v1/src/kernel/phase2_exec.inc"),\n'
          new_hash = '        "v1/src/kernel/process.asm": kwargs["sha256_file"](root / "v1/src/kernel/process.asm"),\n'
          assert driver.count(old_hash) == 1, driver.count(old_hash)
          driver = driver.replace(old_hash, new_hash)

          assert 'phase2_exec.inc' not in driver
          assert 'phase2_exec.inc' not in runtime
          driver_path.write_text(driver, encoding='utf-8', newline='\n')
          runtime_path.write_text(runtime, encoding='utf-8', newline='\n')
          PY
          git rm v1/src/kernel/phase2_exec.inc
          git rm .github/workflows/p212-final-integration.yml
          python3 -m py_compile v1/tools-host/test-driver/phase2_exec.py v1/tools-host/test-driver/phase2_exec_runtime.py
          test "$(grep -c 'MACRO EMIT_EXEC_TRANSACTION_ROUTINES' v1/src/kernel/process.asm)" = 1
          if git grep -n 'phase2_exec\.inc' -- ':!v1/dist/certification'; then
            echo 'staging include reference remains' >&2
            exit 1
          fi
          git diff --check
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Commit isolated canonical-source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/p212-final-integration.yml' \
            'v1/src/kernel/phase2_exec.inc' \
            'v1/src/kernel/process.asm' \
            'v1/tools-host/test-driver/phase2_exec.py' \
            'v1/tools-host/test-driver/phase2_exec_runtime.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git commit -m "P2.12: integrate atomic exec transaction into process.asm"
          git push --force origin HEAD:refs/heads/automation/p212-final-integration-v1
