name: P2.18 corrected failure probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-probe-sentinel-fix.yml

permissions:
  contents: read

jobs:
  corrected-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-probe-sentinel
      P218_EXACT_PARENT: 0578e15ad5986f6803d791adb2e1bf57e4571bf0
      P218_OLD_PROCESS_BLOB: b0cd24ebbdc329543f5138c2d26d8a67453b77fd
      P218_OLD_TEST_BLOB: 0390c74a046003cfca71ec1bbb2102624607793f
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact diagnostic parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git rev-parse HEAD^:v1/src/kernel/process.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git rev-parse HEAD:v1/src/kernel/process.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git rev-parse HEAD^:v1/tools-host/test-driver/phase2_kill_never_started.py)" = "${P218_OLD_TEST_BLOB}"
          test "$(git rev-parse HEAD:v1/tools-host/test-driver/phase2_kill_never_started.py)" = "${P218_OLD_TEST_BLOB}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-probe-sentinel-fix.yml"
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"

      - name: Assemble exact caller-gated candidate and repair probe geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          process = Path("v1/src/kernel/process.asm")
          text = process.read_text(encoding="utf-8")
          old = "ZX48_P2_18_KILL_ENABLED EQU 1\n"
          if text.count(old) != 1:
              raise SystemExit("P2.18 process activation shape changed")
          process.write_text(text.replace(old, ""), encoding="utf-8", newline="\n")

          driver = Path("v1/tools-host/test-driver/phase2_kill_never_started.py")
          text = driver.read_text(encoding="utf-8")
          edits = [
              (
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    DEFINE ZX48_P2_18_KILL_ENABLED\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
              ),
              (
                  '"passed": "ZX48_P2_18_KILL_ENABLED EQU 1" in helper and helper_start > core_end,',
                  '"passed": helper_start > core_end and "ZX48_P2_18_KILL_ENABLED" not in helper,',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit(f"P2.18 candidate edit shape failed: {old[:72]!r}")
              text = text.replace(old, new)
          driver.write_text(text, encoding="utf-8", newline="\n")

          probe = Path("v1/tools-host/test-driver/p218_failure_probe.py")
          text = probe.read_text(encoding="utf-8")
          old = "def main() -> None:\n    target._expect_byte = _expect_byte\n"
          new = (
              "def main() -> None:\n"
              "    # Diagnostic assertions are much larger than production test assertions.\n"
              "    # Keep the sentinel below ENTRY_PC so it cannot overwrite expanded code.\n"
              "    target.SENTINEL_PC = 0x8D00\n"
              "    target._expect_byte = _expect_byte\n"
          )
          if text.count(old) != 1:
              raise SystemExit("P2.18 probe main shape changed")
          text = text.replace(old, new)
          old = '                f"exit={result.exit_code} timed_out={result.timed_out} "\n'
          new = '                f"code_len={len(code)} exit={result.exit_code} timed_out={result.timed_out} "\n'
          if text.count(old) != 1:
              raise SystemExit("P2.18 probe error-report shape changed")
          probe.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY

          expected="$(printf '%s\n' v1/src/kernel/process.asm v1/tools-host/test-driver/p218_failure_probe.py v1/tools-host/test-driver/phase2_kill_never_started.py)"
          test "$(git diff --name-only | sort)" = "${expected}"
          ! grep -q '^ZX48_P2_18_KILL_ENABLED EQU 1$' v1/src/kernel/process.asm
          grep -q '"    DEFINE ZX48_P2_18_KILL_ENABLED\\n"' v1/tools-host/test-driver/phase2_kill_never_started.py
          grep -q 'target.SENTINEL_PC = 0x8D00' v1/tools-host/test-driver/p218_failure_probe.py
          git diff --check
          python3 -m py_compile v1/tools-host/test-driver/phase2_kill_never_started.py
          python3 -m py_compile v1/tools-host/test-driver/p218_failure_probe.py
          find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Run corrected P2.18 failure probe
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/p218_failure_probe.py \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.corrected-probe.log"
          probe_rc="${PIPESTATUS[0]}"
          printf '%s\n' "${probe_rc}" > "${ZXUX_EVIDENCE_DIR}/P2.18.corrected-probe.rc"
          exit "${probe_rc}"

      - name: Collect corrected-probe evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          for path in v1/build/kernel-p218.sym v1/build/p218-kill-never-started.asm v1/build/p218-kill-never-started.sym; do
            if test -f "${path}"; then cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"; fi
          done
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/diagnostic-commit.txt"
          git diff -- v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py v1/tools-host/test-driver/p218_failure_probe.py > "${ZXUX_EVIDENCE_DIR}/diagnostic.patch"
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload corrected-probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-corrected-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-probe-sentinel/
          retention-days: 90
          if-no-files-found: error
