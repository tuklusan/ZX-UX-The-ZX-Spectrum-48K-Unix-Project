name: P4.11 one-shot qualification dispatch bridge v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p411-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact P4.11 qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh workflow run p411-qualification.yml --repo tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project --ref main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
