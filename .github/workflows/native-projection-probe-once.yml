name: Native projection listing probe once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-projection-probe-once.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZXUX_SOURCE_EPOCH: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Build and sample canonical kernel listing
        shell: bash
        run: |
          set -euo pipefail
          test -f v1/dist/certification/R17.00.result.json
          test ! -n "$(git ls-files | grep -Ei '(^|/)(P11(\.|/)|p11[^/]*qualification|phase-?11)' || true)"
          mkdir -p v1/build
          (cd v1/src/kernel && "$GITHUB_WORKSPACE/tools/runtime/sjasmplus/bin/sjasmplus" --nologo --lst=../../build/kernel-probe.lst --sym=../../build/kernel-probe.sym kernel.asm)
          test "$(wc -c < v1/build/kernel.bin)" -eq 8192
          echo "=== LIST HEAD ==="
          sed -n '1,180p' v1/build/kernel-probe.lst
          echo "=== EMITTING SAMPLE ==="
          grep -E '^[[:space:]]*[0-9]+[[:space:]]+[0-9A-Fa-f]{4}[[:space:]]+[0-9A-Fa-f]{2}' v1/build/kernel-probe.lst | head -n 160 || true
          echo "=== LIST TAIL ==="
          tail -n 120 v1/build/kernel-probe.lst
