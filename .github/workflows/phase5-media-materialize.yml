name: Materialize Phase-5 cassette media once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase5-media-materialize.yml

permissions:
  contents: write

concurrency:
  group: zxux-phase5-media-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase5-media-rebuild
      ZXUX_P515_TAP_SHA256: 81620fbb57ad352c3df590b08835df68bf61d72627aa0ae9ea82918c24c7d80d
      ZXUX_P516_TAP_SHA256: 40e9aebbb55b0b0a810fa9cd67adbec876351a63a9086b692d9377163ee5a324
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard certified Phase-5 state
        run: |
          set -euo pipefail
          python3 tools/check_phase5_evidence.py --require-active
          test ! -e v1/dist/cassette/phase-5/phase5-fixture.tap
          test ! -e v1/dist/cassette/phase-5/phase5-fixture.tzx
          test ! -e v1/dist/cassette/phase-5/phase5-fixture-roundtrip.tap
          test ! -e v1/dist/cassette/phase-5/p516-roundtrip.tap

      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime

      - name: Rebuild certified Phase-5 media
        run: |
          set -euo pipefail
          mkdir -p "$ZXUX_EVIDENCE_DIR"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P5.15
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P5.16

          test "$(sha256sum v1/build/phase5-fixture.tap | awk '{print $1}')" = "$ZXUX_P515_TAP_SHA256"
          test "$(sha256sum v1/build/phase5-fixture-roundtrip.tap | awk '{print $1}')" = "$ZXUX_P515_TAP_SHA256"
          cmp -s v1/build/phase5-fixture.tap v1/build/phase5-fixture-roundtrip.tap
          test "$(sha256sum v1/build/p516-roundtrip.tap | awk '{print $1}')" = "$ZXUX_P516_TAP_SHA256"

          mkdir -p v1/dist/cassette/phase-5
          cp v1/build/phase5-fixture.tap v1/dist/cassette/phase-5/
          cp v1/build/phase5-fixture.tzx v1/dist/cassette/phase-5/
          cp v1/build/phase5-fixture-roundtrip.tap v1/dist/cassette/phase-5/
          cp v1/build/p516-roundtrip.tap v1/dist/cassette/phase-5/

          tzx_sha="$(sha256sum v1/dist/cassette/phase-5/phase5-fixture.tzx | awk '{print $1}')"
          cat > v1/dist/cassette/phase-5/README.md <<EOF
          # ZX-UX Phase-5 cassette media

          These files preserve the cassette media exercised by the certified Phase-5 implementation.

          They are certification/test media, not a final ZX-UX release image. P5.15 explicitly
          certified the fixture as non-final.

          | File | SHA-256 | Provenance |
          | --- | --- | --- |
          | `phase5-fixture.tap` | `$ZXUX_P515_TAP_SHA256` | P5.15/P5.18 deterministic Phase-5 fixture |
          | `phase5-fixture.tzx` | `$tzx_sha` | P5.15 fixture converted by the pinned FUSE `tapeconv` tool |
          | `phase5-fixture-roundtrip.tap` | `$ZXUX_P515_TAP_SHA256` | P5.15 TZX-to-TAP roundtrip; byte-identical to the fixture TAP |
          | `p516-roundtrip.tap` | `$ZXUX_P516_TAP_SHA256` | P5.16 RAW TXT/BIN/UDG roundtrip cassette |

          The admitted Phase-5 certification evidence remains unchanged. These files were
          materialized after certification from the already-certified implementation and
          verified against the SHA-256 identities recorded by P5.15/P5.16 where those
          identities exist.
          EOF

      - name: Three unchanged media scans
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            digest="$(sha256sum               v1/dist/cassette/phase-5/phase5-fixture.tap               v1/dist/cassette/phase-5/phase5-fixture.tzx               v1/dist/cassette/phase-5/phase5-fixture-roundtrip.tap               v1/dist/cassette/phase-5/p516-roundtrip.tap               v1/dist/cassette/phase-5/README.md | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
            echo "SCAN-$scan: CLEAN"
          done

      - name: Mandatory gates on exact media bytes
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase4_evidence.py --require-active
          python3 tools/check_phase5_evidence.py --require-active
          git diff --check

      - name: Commit durable media and retire one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/phase5-media-materialize.yml
          git add -A .github/workflows/phase5-media-materialize.yml v1/dist/cassette/phase-5

          git diff --cached --name-only | sort > /tmp/actual
          printf '%s\n'             .github/workflows/phase5-media-materialize.yml             v1/dist/cassette/phase-5/README.md             v1/dist/cassette/phase-5/p516-roundtrip.tap             v1/dist/cassette/phase-5/phase5-fixture-roundtrip.tap             v1/dist/cassette/phase-5/phase5-fixture.tap             v1/dist/cassette/phase-5/phase5-fixture.tzx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "phase5: preserve certified cassette media"
          git push origin HEAD:main
