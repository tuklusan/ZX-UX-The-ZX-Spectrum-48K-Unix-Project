name: Phase-11 failed pre-release REV01 quarantine
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm failed REV01 publisher is quarantined
        run: |
          echo "REV01 is FAILED-CLOSED."
          echo "Automatic build/finalize/publish is disabled."
          echo "REV02 is the only authorized Phase-11 pre-release recovery path."
