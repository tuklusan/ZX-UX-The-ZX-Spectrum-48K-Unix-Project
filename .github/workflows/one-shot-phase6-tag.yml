name: One-shot Phase 6 tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-phase6-tag.yml

permissions:
  contents: write

jobs:
  tag-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-shot workflow, commit cleanup, and tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-phase6-tag.yml
          git commit -m "infra: remove one-shot phase-6 tag workflow"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          git tag -f PHASE-6-COMPLETE "${final_sha}"
          git push origin -f refs/tags/PHASE-6-COMPLETE
