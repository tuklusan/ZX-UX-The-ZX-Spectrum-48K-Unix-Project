name: One-shot scratch branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-scratch-fast-loader-branch-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Delete temporary branch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git push origin --delete scratch-fast-loader-migration
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-scratch-fast-loader-branch-once.yml
          git commit -m "infra: remove one-shot branch cleanup"
          git push origin HEAD:main
