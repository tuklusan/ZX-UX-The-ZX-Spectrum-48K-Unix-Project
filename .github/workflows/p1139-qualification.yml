            'v1/tests/compiler/sdk-reference/sdk/.gitignore' \
            'v1/tests/compiler/sdk-reference/sdk/LICENSE' \
            'v1/tests/compiler/sdk-reference/sdk/MANIFEST.sha256' \
            'v1/tests/compiler/sdk-reference/sdk/README.md' \
            'v1/tests/compiler/sdk-reference/sdk/VERSION' \
            'v1/tests/compiler/sdk-reference/sdk/c48' \
            'v1/tests/compiler/sdk-reference/sdk/c48.bat' \
            'v1/tests/compiler/sdk-reference/sdk/c48run' \
