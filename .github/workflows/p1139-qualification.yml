name: P11.39 compiler complete golden qualification

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p1139-qualification
      P1139_BASE: 5236c18422285f9d9bee96622a9f756614152956
      ZXUX_REV17_SHA256: d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8
      ZXUX_REV08_SHA256: 97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}

      - name: Guard exact P11.39 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P1139_BASE" HEAD | sort > /tmp/changed
          printf '%s\n' \
            '.github/workflows/p1139-qualification.yml' \
            'tools/check_license_headers.sh' \
            'tools/ci.sh' \
            'v1/tests/compiler/p1139-c-source-manifest.json' \
            'v1/tests/compiler/p1139-sdk-test-map.json' \
            'v1/tests/compiler/p1139-three-way-map.json' \
            'v1/tests/compiler/sdk-reference/SDK-PROVENANCE.md' \
            'v1/tests/compiler/sdk-reference/sdk/.gitattributes' \
