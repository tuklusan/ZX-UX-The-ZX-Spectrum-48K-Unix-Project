name: Cloud working mirror export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-mirror-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack tracked working tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/zxux-repo.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/zxux-repo.tar.gz"

      - name: Upload working mirror
        uses: actions/upload-artifact@v4
        with:
          name: zxux-cloud-working-mirror
          path: ${{ runner.temp }}/zxux-repo.tar.gz
          if-no-files-found: error
          retention-days: 1
