name: P2.22 repeated spawn-exit leak qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p222-qualification.yml
      - v1/tests/multiprocessing/p222-spawn-exit-leak.asm
      - v1/tools-host/test-driver/phase2_spawn_exit_leak.py
      - v1/tools-host/test-driver/run.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p222-qualification
      P222_EXACT_PARENT: 70ce1eb897e1c4f152422dd26a043b4de3ad71e4
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact P2.22 candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${P222_EXACT_PARENT}" HEAD
          git diff --name-only "${P222_EXACT_PARENT}" HEAD | sort > /tmp/p222-changed
          printf '%s\n' \
            .github/workflows/p222-qualification.yml \
            v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
            v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
            v1/tools-host/test-driver/run.py \
            | sort > /tmp/p222-expected
          diff -u /tmp/p222-expected /tmp/p222-changed
          test -z "$(git status --porcelain)"
          echo "qualification_head=$(git rev-parse HEAD)"
          echo "qualification_base=${P222_EXACT_PARENT}"

      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git diff --check "${P222_EXACT_PARENT}" HEAD
            python3 -m py_compile v1/tools-host/test-driver/phase2_spawn_exit_leak.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'ld a,64' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_PROCESS_CAPACITY_ROUTINE' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_SPAWN_TRANSACTION_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_ZOMBIE_TRANSITION_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_WAIT_SPECIFIC_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            test -z "$(git status --porcelain)"
            digest="$(
              sha256sum \
                v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
                v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
                v1/tools-host/test-driver/run.py \
                .github/workflows/p222-qualification.yml \
                | sha256sum | awk '{print $1}'
            )"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Mandatory license and project-policy gates
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Require active architecture and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          echo "architecture_sha256=${architecture_sha256}"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P2.22 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.22 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.build.log"

      - name: Diagnose exact PID2 exit panic branch
        shell: bash
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python - <<'PY' 2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.diag.log"
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "v1/tools-host/test-driver"))

          from fuse_harness import FAIL_PC, PASS_PC
          import phase1
          import phase2_spawn_exit_leak as p222

          symbol_path = root / "v1/build/p222-spawn-exit-leak.sym"
          fixture = (root / "v1/build/p222-spawn-exit-leak.bin").read_bytes()
          names = (
              "p222_gateway",
              "zx48_process_links_init",
              "zx48_process_exit_to_zombie",
              "zx48_process_zombie_free_bootstrap",
              "zx48_process_zombie_panic",
              "process_table",
              "current_pid",
              "open_description_table",
              "memory_free_extents",
              "memory_live_allocations",
              "tty_input_owner",
          )
          symbols = p222._symbols(symbol_path, names)

          def store_byte(address: int, value: int) -> bytes:
              return b"\x3E" + bytes((value & 0xFF,)) + b"\x32" + p222._word(address)

          def spawned_pid2() -> bytearray:
              code = bytearray(b"\xF3" + phase1._ld_sp(p222.TEST_STACK))
              code += phase1._call(symbols["zx48_process_links_init"]) + p222._jp_c(FAIL_PC)
              code += phase1._ld_hl(p222.PROC_ADDRESS)
              code += phase1._call(symbols["p222_gateway"]) + p222._jp_c(FAIL_PC)
              code += b"\x7C\xB7" + p222._jp_nz(FAIL_PC)
              code += b"\x7D\xFE\x02" + p222._jp_nz(FAIL_PC)
              return code

          pre_exit = spawned_pid2()
          pre_exit += p222._expect_word(symbols["memory_live_allocations"], 3)
          pre_exit += p222._expect_byte(symbols["open_description_table"] + 2, 2)
          pre_exit += p222._expect_byte(symbols["open_description_table"] + p222.OD_SIZE + 2, 4)
          p222._run_positive_probe(root, symbols, fixture, "post-spawn-accounting", pre_exit)
          print("P2.22 DIAG PASS post-spawn-accounting")

          labels = (
              "current-pid-below-2",
              "current-pid-out-of-range",
              "descriptor-pointer-error",
              "child-not-running",
              "parent-generation-pointer-error",
              "parent-generation-zero",
              "stack-high-below-low",
              "stack-size-zero",
              "stack-size-odd",
              "image-base-zero",
              "image-base-odd",
              "image-size-zero",
              "image-size-odd",
              "stack-base-zero",
              "stack-base-odd",
              "bootstrap-base-zero",
              "bootstrap-base-odd",
              "owned-bytes-zero",
              "owned-bytes-odd",
              "owned-smaller-than-image",
              "owned-remainder-smaller-than-stack",
              "bootstrap-size-zero",
              "bootstrap-size-odd",
              "reparent-failed",
              "close-handles-failed",
          )
          conditional_jp = {0xC2, 0xCA, 0xD2, 0xDA, 0xE2, 0xEA, 0xF2, 0xFA}
          start = symbols["zx48_process_exit_to_zombie"]
          stop = symbols["zx48_process_zombie_free_bootstrap"]
          panic = symbols["zx48_process_zombie_panic"]
          candidates = []
          for address in range(start, stop - 2):
              offset = address - p222.FIXTURE_CODE
              opcode = fixture[offset]
              target = fixture[offset + 1] | (fixture[offset + 2] << 8)
              if opcode in conditional_jp and target == panic:
                  candidates.append(address)
          p222.require(
              len(candidates) == len(labels),
              f"P2.22 diagnostic panic-branch count changed: expected={len(labels)} actual={len(candidates)}",
          )

          def exit_attempt() -> bytearray:
              code = spawned_pid2()
              child_state = symbols["process_table"] + 2 * p222.PROC_DESC_SIZE + p222.PROC_STATE
              code += store_byte(child_state, p222.PROC_RUNNING)
              code += store_byte(symbols["current_pid"], 2)
              code += b"\xAF" + phase1._call(symbols["zx48_process_exit_to_zombie"])
              code += phase1._jp(FAIL_PC)
              return code

          hits = []
          for ordinal, (address, label) in enumerate(zip(candidates, labels), start=1):
              try:
                  p222._run_positive_probe(
                      root,
                      symbols,
                      fixture,
                      f"panic-branch-{ordinal:02d}-{label}",
                      exit_attempt(),
                      (
                          (symbols["zx48_process_zombie_free_bootstrap"], b"\xC9"),
                          (address + 1, p222._word(PASS_PC)),
                      ),
                  )
              except p222.Phase222Error:
                  print(f"P2.22 DIAG MISS branch={ordinal:02d} address=0x{address:04X} condition={label}")
              else:
                  print(f"P2.22 DIAG HIT branch={ordinal:02d} address=0x{address:04X} condition={label}")
                  hits.append((ordinal, address, label))

          p222.require(len(hits) == 1, f"P2.22 diagnostic expected one panic branch hit, got {hits!r}")
          ordinal, address, label = hits[0]
          raise p222.Phase222Error(
              f"P2.22 exact exit panic branch: ordinal={ordinal:02d} address=0x{address:04X} condition={label}"
          )
          PY

      - name: Execute P2.22 test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.22 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.test.log"

      - name: Collect exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/source-commit.txt"
          printf '%s\n' "${P222_EXACT_PARENT}" > "${ZXUX_EVIDENCE_DIR}/source-parent.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          sha256sum \
            v1/src/kernel/process.asm \
            v1/src/kernel/memory.asm \
            v1/src/kernel/handles.asm \
            v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
            v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py \
            .github/workflows/p222-qualification.yml \
            > "${ZXUX_EVIDENCE_DIR}/qualification-hashes.sha256"
          for path in \
            v1/build/kernel.bin \
            v1/build/kernel-p1.sym \
            v1/build/kernel-p1.lst \
            v1/build/p222-spawn-exit-leak.bin \
            v1/build/p222-spawn-exit-leak.sym; do
            if test -f "${path}"; then
              cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"
            fi
          done
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload P2.22 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p222-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p222-qualification/
          retention-days: 90
          if-no-files-found: error
