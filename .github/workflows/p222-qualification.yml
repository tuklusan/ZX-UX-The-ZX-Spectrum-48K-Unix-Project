name: P2.22 repeated spawn-exit leak qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p222-qualification.yml
      - v1/src/kernel/process.asm
      - v1/src/kernel/memory.asm
      - v1/tests/multiprocessing/p222-spawn-exit-leak.asm
      - v1/tools-host/test-driver/phase2_spawn_exit_leak.py
      - v1/tools-host/test-driver/run.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p222-qualification
      P222_EXACT_PARENT: 70ce1eb897e1c4f152422dd26a043b4de3ad71e4
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard checked-in P2.22 candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${P222_EXACT_PARENT}" "${GITHUB_SHA}"
          git diff --name-only "${P222_EXACT_PARENT}" "${GITHUB_SHA}" | sort > /tmp/p222-changed
          python3 - <<'PY'
          from pathlib import Path

          process = Path('v1/src/kernel/process.asm').read_bytes()
          process_old = b'ZX48_P2_13_LINKS_EMITTED EQU 1'
          process_new = b'    DEFINE ZX48_P2_13_LINKS_EMITTED 1'
          memory = Path('v1/src/kernel/memory.asm').read_bytes()
          memory_old = (
              b'    xor a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          memory_new = (
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          state = (
              process.count(process_old), process.count(process_new),
              memory.count(memory_old), memory.count(memory_new),
          )
          if state == (1, 0, 1, 0):
              mode = 'prequalification'
          elif state == (0, 1, 0, 1):
              mode = 'checked-in'
          else:
              raise SystemExit(f'P2.22 fail-closed mixed repair state: {state!r}')
          Path('/tmp/p222-mode').write_text(mode + '\n', encoding='ascii')
          PY
          if test "$(cat /tmp/p222-mode)" = prequalification; then
            printf '%s\n' \
              .github/workflows/p222-qualification.yml \
              v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
              v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
              v1/tools-host/test-driver/run.py \
              | sort > /tmp/p222-expected
          else
            printf '%s\n' \
              .github/workflows/p222-qualification.yml \
              v1/src/kernel/process.asm \
              v1/src/kernel/memory.asm \
              v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
              v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
              v1/tools-host/test-driver/run.py \
              | sort > /tmp/p222-expected
          fi
          diff -u /tmp/p222-expected /tmp/p222-changed
          test -z "$(git status --porcelain)"
          echo "qualification_remote_head=${GITHUB_SHA}"
          echo "qualification_mode=$(cat /tmp/p222-mode)"

      - name: Prepare exact P2.22 repair candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          process_path = Path('v1/src/kernel/process.asm')
          process = process_path.read_bytes()
          process_old = b'ZX48_P2_13_LINKS_EMITTED EQU 1'
          process_new = b'    DEFINE ZX48_P2_13_LINKS_EMITTED 1'
          process_state = (process.count(process_old), process.count(process_new))
          if process_state == (1, 0):
              process_path.write_bytes(process.replace(process_old, process_new, 1))
              print('prepared P2.13 EQU-to-indented-DEFINE composition repair')
          elif process_state != (0, 1):
              raise SystemExit(f'P2.22 fail-closed process marker multiplicity: {process_state!r}')

          memory_path = Path('v1/src/kernel/memory.asm')
          memory = memory_path.read_bytes()
          memory_old = (
              b'    xor a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          memory_new = (
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          memory_state = (memory.count(memory_old), memory.count(memory_new))
          if memory_state == (1, 0):
              memory_path.write_bytes(memory.replace(memory_old, memory_new, 1))
              print('prepared canonical zeroing of merged-away free-extent record')
          elif memory_state != (0, 1):
              raise SystemExit(f'P2.22 fail-closed allocator normalization multiplicity: {memory_state!r}')
          PY
          grep -Fqx '    DEFINE ZX48_P2_13_LINKS_EMITTED 1' v1/src/kernel/process.asm
          python3 - <<'PY'
          from pathlib import Path
          data = Path('v1/src/kernel/memory.asm').read_bytes()
          repaired = (
              b'    xor a\n'
              b'    ld (ix+4),a\n'
              b'    ld (ix+5),a\n'
              b'    ld (ix+6),a\n'
              b'    ld (ix+7),a\n'
              b'    call zx48_extent_sort\n'
          )
          if data.count(repaired) != 1:
              raise SystemExit('P2.22 fail-closed allocator normalization repair missing or duplicated')
          PY
          if ! git diff --quiet; then
            git diff --name-only | sort > /tmp/p222-local-changed
            printf '%s\n' v1/src/kernel/memory.asm v1/src/kernel/process.asm | sort > /tmp/p222-local-expected
            diff -u /tmp/p222-local-expected /tmp/p222-local-changed
            git add v1/src/kernel/process.asm v1/src/kernel/memory.asm
            git -c user.name='ZX-UX Qualification' \
                -c user.email='zxux-qualification@invalid.example' \
                commit --no-verify -m 'P2.22 ephemeral composition and allocator candidate'
          fi
          test -z "$(git status --porcelain)"
          git diff --name-only "${P222_EXACT_PARENT}" HEAD | sort > /tmp/p222-prepared-changed
          printf '%s\n' \
            .github/workflows/p222-qualification.yml \
            v1/src/kernel/process.asm \
            v1/src/kernel/memory.asm \
            v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
            v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
            v1/tools-host/test-driver/run.py \
            | sort > /tmp/p222-prepared-expected
          diff -u /tmp/p222-prepared-expected /tmp/p222-prepared-changed
          git rev-parse HEAD > /tmp/p222-candidate-commit
          git rev-parse 'HEAD^{tree}' > /tmp/p222-candidate-tree
          echo "candidate_commit=$(cat /tmp/p222-candidate-commit)"
          echo "candidate_tree=$(cat /tmp/p222-candidate-tree)"

      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          tree_baseline="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            git diff --check "${P222_EXACT_PARENT}" HEAD
            python3 -m py_compile v1/tools-host/test-driver/phase2_spawn_exit_leak.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'ld a,64' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_PROCESS_CAPACITY_ROUTINE' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_PARENT_CHILD_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_SPAWN_TRANSACTION_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_ZOMBIE_TRANSITION_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -q 'EMIT_WAIT_SPECIFIC_ROUTINES' v1/tests/multiprocessing/p222-spawn-exit-leak.asm
            grep -Fqx '    DEFINE ZX48_P2_13_LINKS_EMITTED 1' v1/src/kernel/process.asm
            python3 -c "from pathlib import Path; d=Path('v1/src/kernel/memory.asm').read_bytes(); assert d.count(b'    xor a\\n    ld (ix+4),a\\n    ld (ix+5),a\\n    ld (ix+6),a\\n    ld (ix+7),a\\n    call zx48_extent_sort\\n') == 1"
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "${tree_baseline}"
            digest="$(
              sha256sum \
                v1/src/kernel/process.asm \
                v1/src/kernel/memory.asm \
                v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
                v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
                v1/tools-host/test-driver/run.py \
                .github/workflows/p222-qualification.yml \
                | sha256sum | awk '{print $1}'
            )"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
            echo "scan_${scan}_tree=${tree_baseline}"
          done

      - name: Mandatory license and project-policy gates
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Require active architecture and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          echo "architecture_sha256=${architecture_sha256}"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Prove pinned assembler composition-marker semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          cat > /tmp/p222-marker-probe.asm <<'ASM'
                  ORG $8000
          P222_EQU_MARKER EQU 1
                  IFDEF P222_EQU_MARKER
                  DB $E1
                  ELSE
                  DB $E0
                  ENDIF
                  MACRO P222_EMIT_DEFINE_MARKER
                      DEFINE P222_DEFINE_MARKER 1
                  ENDM
                  P222_EMIT_DEFINE_MARKER
                  IFDEF P222_DEFINE_MARKER
                  DB $D1
                  ELSE
                  DB $D0
                  ENDIF
          ASM
          tools/runtime/sjasmplus/bin/sjasmplus --nologo \
            --raw=/tmp/p222-marker-probe.bin /tmp/p222-marker-probe.asm \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.marker-semantics.log"
          tools/runtime/python/bin/python - <<'PY'
          from pathlib import Path
          payload = Path('/tmp/p222-marker-probe.bin').read_bytes()
          if payload != bytes((0xE0, 0xD1)):
              raise SystemExit(f'P2.22 marker semantics mismatch: {payload.hex()}')
          print('P2.22 MARKER PASS EQU-is-not-IFDEF DEFINE-in-emitter-is-IFDEF')
          PY

      - name: Audit staged composition markers read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python - <<'PY' \
            | tee "${ZXUX_EVIDENCE_DIR}/P2.22.marker-audit.log"
          from pathlib import Path
          import re

          decl_equ = re.compile(r'^\s*(ZX48_P2_[A-Za-z0-9_]+)\s+EQU(?:\s|$)')
          decl_define = re.compile(r'^\s+DEFINE\+?\s+(ZX48_P2_[A-Za-z0-9_]+)(?:\s|$)', re.I)
          consumer = re.compile(r'^\s+(IFDEF|IFNDEF)\s+(ZX48_P2_[A-Za-z0-9_]+)(?:\s|$)', re.I)
          declarations = []
          consumers = []
          roots = (Path('v1/src'), Path('v1/tests'))
          for root in roots:
              for path in sorted(root.rglob('*.asm')):
                  macro_depth = 0
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      stripped = line.strip()
                      if re.match(r'^MACRO(?:\s|$)', stripped, re.I):
                          macro_depth += 1
                      match = decl_equ.match(line)
                      if match:
                          declarations.append((match.group(1), 'EQU', 'macro-local' if macro_depth else 'top-level', path, number))
                      match = decl_define.match(line)
                      if match:
                          declarations.append((match.group(1), 'DEFINE', 'macro-local' if macro_depth else 'top-level', path, number))
                      match = consumer.match(line)
                      if match:
                          consumers.append((match.group(2), match.group(1).upper(), path, number))
                      if re.match(r'^ENDM(?:\s|$)', stripped, re.I) and macro_depth:
                          macro_depth -= 1

          print('P2.22 staged composition marker declarations:')
          for symbol, form, scope, path, number in declarations:
              print(f'  {symbol}: {form} {scope} at {path}:{number}')
          print('P2.22 staged composition marker consumers:')
          for symbol, form, path, number in consumers:
              print(f'  {symbol}: {form} at {path}:{number}')
          used = {symbol for symbol, _, _, _ in consumers}
          suspects = [item for item in declarations if item[0] in used and item[1] == 'EQU']
          print('P2.22 read-only same-symbol EQU+IFDEF/IFNDEF suspects:')
          if suspects:
              for symbol, form, scope, path, number in suspects:
                  print(f'  {symbol}: {form} {scope} at {path}:{number}')
          else:
              print('  none')
          target = [item for item in declarations if item[0] == 'ZX48_P2_13_LINKS_EMITTED']
          if len(target) != 1 or target[0][1:3] != ('DEFINE', 'macro-local'):
              raise SystemExit(f'P2.22 repaired marker classification mismatch: {target!r}')
          PY

      - name: Regression-test allocator and process prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          for step in P1.02 P1.03 P1.04 P1.05 P1.41; do
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step "${step}" \
              2>&1 | tee "${ZXUX_EVIDENCE_DIR}/${step}.regression.log"
          done
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.10 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.10.regression.log"
          test -f v1/build/p210-spawn.sym
          if grep -qi '^zx48_process_link_child:' v1/build/p210-spawn.sym; then
            echo 'P2.22 fail-closed: P2.10 standalone spawn unexpectedly emitted P2.13 linkage helper' >&2
            exit 1
          fi
          echo 'P2.22 COMPAT PASS P2.10 standalone spawn retains legacy fallback composition' \
            | tee "${ZXUX_EVIDENCE_DIR}/P2.10.composition.log"
          for step in P2.13 P2.14; do
            tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step "${step}" \
              2>&1 | tee "${ZXUX_EVIDENCE_DIR}/${step}.regression.log"
          done

      - name: Execute P2.22 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.22 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.build.log"

      - name: Prove assembled spawn publishes generation-qualified link
        shell: bash
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python - <<'PY' 2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.link-proof.log"
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / 'v1/tools-host/test-driver'))

          from fuse_harness import FAIL_PC
          import phase1
          import phase2_spawn_exit_leak as p222

          symbol_path = root / 'v1/build/p222-spawn-exit-leak.sym'
          fixture = (root / 'v1/build/p222-spawn-exit-leak.bin').read_bytes()
          names = (
              'p222_gateway',
              'zx48_process_links_init',
              'zx48_process_link_child',
              'zx48_process_spawn_transaction',
              'zx48_process_spawn_rollback',
              'process_generation',
              'process_parent_generation',
              'process_child_mask',
              'process_table',
              'current_pid',
              'open_description_table',
              'memory_free_extents',
              'memory_live_allocations',
              'tty_input_owner',
          )
          symbols = p222._symbols(symbol_path, names)

          start = symbols['zx48_process_spawn_transaction'] - p222.FIXTURE_CODE
          stop = symbols['zx48_process_spawn_rollback'] - p222.FIXTURE_CODE
          p222.require(0 <= start < stop <= len(fixture), 'P2.22 spawn transaction range outside fixture')
          needle = b'\xCD' + p222._word(symbols['zx48_process_link_child'])
          hits = []
          position = fixture.find(needle, start, stop)
          while position != -1:
              hits.append(p222.FIXTURE_CODE + position)
              position = fixture.find(needle, position + 1, stop)
          p222.require(
              len(hits) == 1,
              f'P2.22 assembled spawn must contain exactly one link-child CALL, hits={hits!r}',
          )
          print(f'P2.22 LINK PASS assembled-call=0x{hits[0]:04X}')

          code = bytearray(b'\xF3' + phase1._ld_sp(p222.TEST_STACK))
          code += phase1._call(symbols['zx48_process_links_init']) + p222._jp_c(FAIL_PC)
          code += phase1._ld_hl(p222.PROC_ADDRESS)
          code += phase1._call(symbols['p222_gateway']) + p222._jp_c(FAIL_PC)
          code += b'\x7C\xB7' + p222._jp_nz(FAIL_PC)
          code += b'\x7D\xFE\x02' + p222._jp_nz(FAIL_PC)
          code += p222._expect_word(symbols['process_generation'] + 2 * 2, 1)
          code += p222._expect_word(symbols['process_parent_generation'] + 2 * 2, 1)
          code += p222._expect_byte(symbols['process_child_mask'] + 1, 0x04)
          code += p222._expect_byte(
              symbols['process_table'] + 2 * p222.PROC_DESC_SIZE + p222.PROC_PARENT,
              1,
          )
          p222._run_positive_probe(root, symbols, fixture, 'generation-qualified-spawn-link', code)
          print('P2.22 LINK PASS generation-qualified-spawn-link')
          PY

      - name: Execute P2.22 test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.22 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.22.test.log"

      - name: Collect exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          cp /tmp/p222-mode "${ZXUX_EVIDENCE_DIR}/qualification-mode.txt" 2>/dev/null || true
          cp /tmp/p222-candidate-commit "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt" 2>/dev/null || true
          cp /tmp/p222-candidate-tree "${ZXUX_EVIDENCE_DIR}/candidate-tree.txt" 2>/dev/null || true
          printf '%s\n' "${GITHUB_SHA}" > "${ZXUX_EVIDENCE_DIR}/remote-head.txt"
          printf '%s\n' "${P222_EXACT_PARENT}" > "${ZXUX_EVIDENCE_DIR}/source-parent.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          sha256sum \
            v1/src/kernel/process.asm \
            v1/src/kernel/memory.asm \
            v1/src/kernel/handles.asm \
            v1/tests/multiprocessing/p222-spawn-exit-leak.asm \
            v1/tools-host/test-driver/phase2_spawn_exit_leak.py \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py \
            .github/workflows/p222-qualification.yml \
            > "${ZXUX_EVIDENCE_DIR}/qualification-hashes.sha256"
          cp v1/src/kernel/process.asm "${ZXUX_EVIDENCE_DIR}/candidate-process.asm"
          cp v1/src/kernel/memory.asm "${ZXUX_EVIDENCE_DIR}/candidate-memory.asm"
          for path in \
            v1/build/kernel.bin \
            v1/build/kernel-p1.sym \
            v1/build/kernel-p1.lst \
            v1/build/p222-spawn-exit-leak.bin \
            v1/build/p222-spawn-exit-leak.sym; do
            if test -f "${path}"; then
              cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"
            fi
          done
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload P2.22 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p222-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p222-qualification/
          retention-days: 90
          if-no-files-found: error
