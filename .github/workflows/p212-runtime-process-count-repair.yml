name: P2.12 One-Shot Runtime Process Count Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p212-runtime-process-count-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch exact P2.12 runtime fixture dependency and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v1/tools-host/test-driver/phase2_exec_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '        "    jp zx48_sys_exec\\n"\n        "zx48_process_lookup:\\n"\n'
          new = '        "    jp zx48_sys_exec\\n"\n        "zx48_process_count:\\n"\n        "    xor a\\n"\n        "    ret\\n"\n        "zx48_process_lookup:\\n"\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/p212-runtime-process-count-repair.yml
          python3 -m py_compile v1/tools-host/test-driver/phase2_exec_runtime.py
          rm -rf v1/tools-host/test-driver/__pycache__
          grep -A3 -F '"zx48_process_count:\\n"' v1/tools-host/test-driver/phase2_exec_runtime.py
          git diff --check
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
      - name: Commit repaired runtime harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/p212-runtime-process-count-repair.yml' 'v1/tools-host/test-driver/phase2_exec_runtime.py' | sort)"
          test "$changed" = "$expected"
          git diff --cached --check
          git commit -m "P2.12: satisfy runtime fixture process-count dependency"
          git push origin HEAD:main
