name: P3.15 exact-candidate qualification

on:
  push:
    branches:
      - p315-qualification-temp-4
    paths:
      - .github/workflows/p315-qualification-temp-4.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p315-qualification
      CANDIDATE: f4c09e3703e4eb8b548bf7888e54ad7cf797f1e4

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 1

      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE}"
          test -z "$(git status --porcelain)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          baseline=""
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/phase3_rw_validation.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'zx48_sys_rw_prepare' v1/src/kernel/syscall.asm
            grep -q 'P3.15' v1/tools-host/test-driver/run.py
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "${tree}"
            digest="$(sha256sum v1/src/kernel/syscall.asm v1/tools-host/test-driver/phase3_rw_validation.py v1/tools-host/test-driver/run.py | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
          done

      - name: Mandatory gates
        run: |
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake gettext libaudiofile-dev libfreetype6-dev             libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool             libxml2-dev perl pkg-config

      - name: Acquire pinned runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Build
        run: |
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P3.15 --evidence-dir "${ZXUX_EVIDENCE_DIR}"

      - name: Test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P3.15 --evidence-dir "${ZXUX_EVIDENCE_DIR}"

      - name: Candidate identity
        if: always()
        run: |
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${ZXUX_EVIDENCE_DIR}/candidate-tree.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p315-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p315-qualification/
          retention-days: 90
          if-no-files-found: error
