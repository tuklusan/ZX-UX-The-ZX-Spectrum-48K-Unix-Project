          bbb7cb28b61424307d3e22469a005483f6f562bd27bf9687433a8f889bc1eae5  v1/tools-host/test-driver/phase1_gate.py
          bd29d5deda2b1806c7bdd61cca9dc66384da9bc7b59c4d98c3acdd45840b29d9  v1/tools-host/test-driver/run.py
          8e502242b7dce8e7bb8b1ad614c2f753dc46db1bc037930d79bbf812717c5470  v1/tools-host/test-driver/phase1_ticks.py
          HASHES
          sed -i 's/^          //' "$RUNNER_TEMP/p1-13.sha256"
          sha256sum -c "$RUNNER_TEMP/p1-13.sha256"
          python3 - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/p1-13-materialize.yml",
              "v1/src/kernel/console.asm",
              "v1/src/kernel/errors.asm",
              "v1/src/kernel/interrupt.asm",
              "v1/tools-host/test-driver/phase1_gate.py",
              "v1/tools-host/test-driver/run.py",
              "v1/tools-host/test-driver/phase1_ticks.py",
          }
          rows = subprocess.run(
              ["git", "status", "--porcelain=v1"],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          actual = {row[3:] for row in rows if row}
          if actual != expected:
              raise SystemExit(f"unexpected materialized path set: {sorted(actual)}")
          PY

