      - name: Verify exact candidate bytes and changed paths
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p1-13.sha256" <<'HASHES'
          7e1bfdbe5dc4840b43465687398577a3089c3da705bf1183666647b5cf780de6  v1/src/kernel/console.asm
          cb8ceea7043472803f6e7ee20bdbb8af6c2f92c0704d5c2375dffab4d8fad858  v1/src/kernel/errors.asm
