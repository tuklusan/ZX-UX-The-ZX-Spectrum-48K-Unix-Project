name: P3.13 exact-candidate qualification
on:
  push:
    branches: [p313-qualification-temp]
    paths: [.github/workflows/p313-qualification-temp.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p313-qualification
      CANDIDATE: f04a284f3b5547cf5a94b25a6a6695a03e7f98c0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 1
      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE}"
          test -z "$(git status --porcelain)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          base=""
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/phase3_pipe_broken.py v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            grep -q 'zx48_pipe_broken' v1/src/kernel/pipe.asm
            grep -q 'E_PIPE' v1/src/kernel/pipe.asm
            grep -q 'P3.13' v1/tools-host/test-driver/run.py
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "${tree}"
            d="$(sha256sum v1/src/kernel/pipe.asm v1/src/kernel/handles.asm v1/tools-host/test-driver/phase3_pipe_broken.py v1/tools-host/test-driver/run.py | sha256sum | awk '{print $1}')"
            if test -z "${base}"; then base="${d}"; else test "${d}" = "${base}"; fi
            echo "SCAN-${scan}: CLEAN"
          done
      - name: Mandatory gates
        run: |
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config
      - name: Acquire pinned runtime
        run: python tools/scripts/bootstrap-environment.py
      - name: Certify pinned runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py
      - name: Build
        run: |
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P3.13 --evidence-dir "${ZXUX_EVIDENCE_DIR}"
      - name: Test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P3.13 --evidence-dir "${ZXUX_EVIDENCE_DIR}"
      - name: Candidate identity
        if: always()
        run: |
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${ZXUX_EVIDENCE_DIR}/candidate-tree.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p313-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p313-qualification/
          retention-days: 90
          if-no-files-found: error
