name: P2.18 caller-gated dispatch and sentinel repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-sentinel-geometry-fix.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ZXUX_RUNNER_SESSION_ID: phase2-20260916-01
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-dispatch-sentinel
      P218_EXACT_PARENT: 8b84534132981b7cc5b689c90589ab07cedf68bf
      P218_OLD_PROCESS_BLOB: b0cd24ebbdc329543f5138c2d26d8a67453b77fd
      P218_OLD_TEST_BLOB: 0390c74a046003cfca71ec1bbb2102624607793f
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact diagnosed parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact trigger and diagnosed fallback assembly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-sentinel-geometry-fix.yml"
          test "$(git rev-parse HEAD:v1/src/kernel/process.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git rev-parse HEAD:v1/tools-host/test-driver/phase2_kill_never_started.py)" = "${P218_OLD_TEST_BLOB}"
          python3 - <<'PY'
          from pathlib import Path
          process = Path("v1/src/kernel/process.asm").read_text(encoding="utf-8")
          driver = Path("v1/tools-host/test-driver/phase2_kill_never_started.py").read_text(encoding="utf-8")
          checks = {
              "helper-internal-activation-present": process.count("ZX48_P2_18_KILL_ENABLED EQU 1\n") == 1,
              "conditional-dispatch-source-present": "IFDEF ZX48_P2_18_KILL_ENABLED" in process and "jp z,zx48_process_kill_never_started" in process,
              "old-sentinel-present": "SENTINEL_PC = 0x9200\n" in driver,
              "caller-define-not-yet-present": "DEFINE ZX48_P2_18_KILL_ENABLED" not in driver,
          }
          for name, passed in checks.items():
              print(f"guard {name}={int(passed)}")
              if not passed:
                  raise SystemExit(f"guard failed: {name}")
          PY
          test -z "$(git status --porcelain)"

      - name: Assemble exact caller-gated dispatch and sentinel repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          process = Path("v1/src/kernel/process.asm")
          process_text = process.read_text(encoding="utf-8")
          old_activation = "ZX48_P2_18_KILL_ENABLED EQU 1\n"
          if process_text.count(old_activation) != 1:
              raise SystemExit("P2.18 helper activation shape changed")
          process.write_text(process_text.replace(old_activation, ""), encoding="utf-8", newline="\n")

          driver = Path("v1/tools-host/test-driver/phase2_kill_never_started.py")
          text = driver.read_text(encoding="utf-8")
          edits = (
              (
                  "from fuse_harness import FAIL_PC, PASS_PC, run_sna\n",
                  "from fuse_harness import ENTRY_PC, FAIL_PC, PASS_PC, run_sna\n",
              ),
              ("SENTINEL_PC = 0x9200\n", "SENTINEL_PC = 0x8D00\n"),
              (
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    DEFINE ZX48_P2_18_KILL_ENABLED\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
              ),
              (
                  '[assembler, "--nologo", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
                  '[assembler, "--nologo", "--lst=p218-kill-never-started.lst", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
              ),
              (
                  '"passed": "ZX48_P2_18_KILL_ENABLED EQU 1" in helper and helper_start > core_end,',
                  '"passed": helper_start > core_end and "ZX48_P2_18_KILL_ENABLED" not in helper,',
              ),
              (
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n',
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n        "zx48_process_kill_never_started",\n',
              ),
              (
                  '    fixture = fixture_binary.read_bytes()\n    if action == "test":\n',
                  '    fixture = fixture_binary.read_bytes()\n'
                  '    dispatch_bytes = b"\\xCA" + _word(symbols["zx48_process_kill_never_started"])\n'
                  '    dispatch_count = fixture.count(dispatch_bytes)\n'
                  '    require(dispatch_count == 1, f"P2.18 assembled dispatch must contain exactly one JP Z to never-started helper, got {dispatch_count}")\n'
                  '    assertions.append({"name": "assembled-fixture-dispatches-to-never-started-helper", "passed": True, "dispatch_bytes": dispatch_bytes.hex()})\n'
                  '    if action == "test":\n',
              ),
              (
                  '    assertions = _source_contract(root)\n    failed = [item["name"] for item in assertions if item["passed"] is not True]\n',
                  '    assertions = _source_contract(root)\n'
                  '    require(SENTINEL_PC + 8 <= ENTRY_PC, "P2.18 child-PC sentinel overlaps test program entry")\n'
                  '    assertions.append({\n'
                  '        "name": "child-pc-sentinel-is-disjoint-from-test-program",\n'
                  '        "passed": True,\n'
                  '        "sentinel_pc": f"0x{SENTINEL_PC:04X}",\n'
                  '        "sentinel_end": f"0x{SENTINEL_PC + 7:04X}",\n'
                  '        "test_entry": f"0x{ENTRY_PC:04X}",\n'
                  '    })\n'
                  '    failed = [item["name"] for item in assertions if item["passed"] is not True]\n',
              ),
          )
          for old, new in edits:
              count = text.count(old)
              print(f"edit anchor count={count} anchor={old[:64]!r}")
              if count != 1 or new in text:
                  raise SystemExit(f"P2.18 driver exact edit shape failed: {old[:72]!r}")
              text = text.replace(old, new)
          driver.write_text(text, encoding="utf-8", newline="\n")
          PY

          git add v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py
          git rm .github/workflows/p218-sentinel-geometry-fix.yml
          echo '--- staged paths ---'
          git diff --cached --name-only
          echo '--- unstaged paths ---'
          git diff --name-only
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = sorted([
              ".github/workflows/p218-sentinel-geometry-fix.yml",
              "v1/src/kernel/process.asm",
              "v1/tools-host/test-driver/phase2_kill_never_started.py",
          ])
          actual = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          if sorted(actual) != expected:
              raise SystemExit(f"staged path mismatch: expected={expected!r} actual={actual!r}")
          unstaged = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          if unstaged:
              raise SystemExit(f"unexpected unstaged paths: {unstaged!r}")

          process = Path("v1/src/kernel/process.asm").read_text(encoding="utf-8")
          driver = Path("v1/tools-host/test-driver/phase2_kill_never_started.py").read_text(encoding="utf-8")
          checks = {
              "helper-internal-activation-removed": "ZX48_P2_18_KILL_ENABLED EQU 1" not in process,
              "caller-define-present": '"    DEFINE ZX48_P2_18_KILL_ENABLED\\n"' in driver,
              "sentinel-moved": "SENTINEL_PC = 0x8D00" in driver,
              "entry-imported": "from fuse_harness import ENTRY_PC, FAIL_PC, PASS_PC, run_sna" in driver,
              "listing-enabled": "--lst=p218-kill-never-started.lst" in driver,
              "helper-symbol-requested": '"zx48_process_kill_never_started",' in driver,
              "assembled-dispatch-proof-present": "assembled-fixture-dispatches-to-never-started-helper" in driver,
              "sentinel-proof-present": "child-pc-sentinel-is-disjoint-from-test-program" in driver,
          }
          for name, passed in checks.items():
              print(f"candidate {name}={int(passed)}")
              if not passed:
                  raise SystemExit(f"candidate validation failed: {name}")
          PY
          git diff --cached --check

      - name: Three clean repair scans and mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            python3 -m py_compile v1/tools-host/test-driver/phase2_kill_never_started.py
            python3 -m py_compile v1/tools-host/test-driver/p218_failure_probe.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            git diff --cached --check
            test -z "$(git diff --name-only)"
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            digest="$(git diff --cached --binary | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Commit exact repair candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZX-UX P2.18 repair runner"
          git config user.email "tuklusan@users.noreply.github.com"
          git commit -m "P2.18 test: activate teardown at fixture assembly boundary"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_parent=$(git rev-parse HEAD^)"

      - name: Require architecture identity and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config

      - name: Restore Phase-2 runner cache session
        uses: actions/cache@v4
        with:
          path: |
            /tmp/zxux-tool-cache
            tools/runtime
          key: zxux-${{ runner.os }}-${{ env.ZXUX_RUNNER_SESSION_ID }}-${{ hashFiles('tools/manifest/toolchain.lock.json') }}

      - name: Acquire or verify pinned project runtime
        shell: bash
        run: |
          set -euo pipefail
          if test -x tools/runtime/python/bin/python && tools/runtime/python/bin/python tools/scripts/verify-environment.py; then
            echo "runner_cache_session=${ZXUX_RUNNER_SESSION_ID} verified_reuse=1"
          else
            rm -rf tools/runtime
            python tools/scripts/bootstrap-environment.py
            tools/runtime/python/bin/python tools/scripts/verify-environment.py
            echo "runner_cache_session=${ZXUX_RUNNER_SESSION_ID} verified_reuse=0"
          fi

      - name: Execute repaired P2.18 build with assembled dispatch proof
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.18 --evidence-dir "${ZXUX_EVIDENCE_DIR}"

      - name: Execute repaired P2.18 test
        shell: bash
        run: |
          set +e
          set -o pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.18 --evidence-dir "${ZXUX_EVIDENCE_DIR}" \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.test.log"
          test_rc="${PIPESTATUS[0]}"
          printf '%s\n' "${test_rc}" > "${ZXUX_EVIDENCE_DIR}/P2.18.test.rc"
          if test "${test_rc}" -ne 0; then
            tools/runtime/python/bin/python v1/tools-host/test-driver/p218_failure_probe.py \
              2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.log"
            printf '%s\n' "${PIPESTATUS[0]}" > "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.rc"
          fi
          exit "${test_rc}"

      - name: Recheck mandatory gates on exact tested candidate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
          test -z "$(git status --porcelain)"

      - name: Push exact tested repair if main has not moved
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          git fetch --no-tags origin main
          remote="$(git rev-parse FETCH_HEAD)"
          echo "candidate_commit=${candidate}"
          echo "candidate_parent=${parent}"
          echo "remote_main=${remote}"
          test "${remote}" = "${parent}"
          git push --porcelain origin HEAD:main
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${candidate}"

      - name: Collect dispatch/sentinel evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt" 2>/dev/null || true
          git rev-parse HEAD^ > "${ZXUX_EVIDENCE_DIR}/candidate-parent.txt" 2>/dev/null || true
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          for path in v1/build/kernel-p218.sym v1/build/kernel-p218.lst v1/build/p218-kill-never-started.asm v1/build/p218-kill-never-started.sym v1/build/p218-kill-never-started.lst; do
            if test -f "${path}"; then cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"; fi
          done
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload dispatch/sentinel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-dispatch-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-dispatch-sentinel/
          retention-days: 90
          if-no-files-found: error
