name: Phase-6 step admission

on:
  workflow_dispatch:
    inputs:
      step:
        required: true
        type: string
      run_id:
        required: true
        type: string
      source_commit:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STEP: ${{ inputs.step }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
      - name: Guard exact qualified head
        run: |
          set -euo pipefail
          test "$STEP" = "$(printf '%s' "$STEP" | grep -Eo '^P6\.[0-9]{2}$')"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$SOURCE_COMMIT"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase5_evidence.py --require-active
      - name: Download exact qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, zipfile
          step=os.environ["STEP"]; run=os.environ["RUN_ID"]
          slug=step.lower().replace(".","")
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r: return r.read()
          data=json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts"))
          wanted=[a for a in data["artifacts"] if a["name"].startswith(f"zxux-{slug}-qualification-{run}-")]
          if len(wanted)!=1: raise SystemExit(f"expected one qualification artifact, got {len(wanted)}")
          payload=get(wanted[0]["archive_download_url"])
          pathlib.Path("/tmp/qualification.zip").write_bytes(payload)
          with zipfile.ZipFile("/tmp/qualification.zip") as z: z.extractall("/tmp/qualification")
          PY
      - name: Validate and stage immutable evidence
        run: |
          set -euo pipefail
          python3 - "$STEP" "$SOURCE_COMMIT" <<'PY'
          import json, pathlib, sys
          step,source=sys.argv[1:3]
          root=pathlib.Path("/tmp/qualification")
          for action in ("build","test"):
              p=root/f"{step}.{action}.json"
              r=json.loads(p.read_text())
              assert r["schema"]==2 and r["step"]==step and r["action"]==action
              assert r["status"]=="PASS" and r["worktree_clean"] is True
              assert r["source_commit"]==source
              assert r["architecture_sha256"]=="24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c"
              assert r["implementation_plan_sha256"]=="840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc"
              dst=pathlib.Path("v1/dist/certification")/p.name
              if dst.exists(): raise SystemExit(f"immutable evidence already exists: {dst}")
              dst.write_bytes(p.read_bytes())
          PY
          python3 tools/finalize_step_media.py --step "$STEP" --evidence-dir /tmp/qualification
          git add "v1/dist/certification/$STEP.build.json" "v1/dist/certification/$STEP.test.json" "v1/dist/media/$STEP"
          test -n "$(git diff --cached --name-only)"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
      - name: Admit exact evidence-only commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$STEP: admit qualification evidence and media"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          git push origin HEAD:main
