name: P2.16 guarded candidate apply

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p216-apply.yml

permissions:
  contents: write

jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require frozen P2.15 base
        run: |
          git merge-base --is-ancestor f2d565b560ea6cd15e914bbdc43345642b64e813 HEAD
          git diff --exit-code f2d565b560ea6cd15e914bbdc43345642b64e813 -- \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py
          test ! -e v1/tools-host/test-driver/phase2_wait_any.py
          test ! -e v1/tools-host/test-driver/phase2_wait_any_runtime.py

      - name: Apply exact P2.16 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          # Copyright (c) 2026 Supratim Sanyal of SANYALnet Labs.
          # Proprietary rights reserved except as expressly licensed herein.
          #
          # ZX-UX Sinclair ZX Spectrum Unix
          # This file is governed by the SANYALnet Labs Non-Commercial License in the
          # root LICENSE file. Non-Commercial use is permitted; Commercial Use and use
          # for AI/ML model training are prohibited unless separately authorized.
          #
          # Attribution is required: "Based on original work by Supratim Sanyal of
          # SANYALnet Labs." See LICENSE for full terms, warranty disclaimer, termination,
          # patent, trademark, and governing-law provisions.
          
          # Temporary guarded P2.16 cloud apply helper. Remove after P2.16 certification.
          
          from pathlib import Path
          import base64
          import zlib
          
          PROCESS_PATH = Path("v1/src/kernel/process.asm")
          RUN_PATH = Path("v1/tools-host/test-driver/run.py")
          GATE_PATH = Path("v1/tools-host/test-driver/phase2_gate.py")
          STATIC_PATH = Path("v1/tools-host/test-driver/phase2_wait_any.py")
          RUNTIME_PATH = Path("v1/tools-host/test-driver/phase2_wait_any_runtime.py")
          
          RUNTIME_Z = ''
          STATIC_Z = ''
          MACRO_Z = ''
          
          
          def inflate(payload: str) -> str:
              return zlib.decompress(base64.b64decode(payload)).decode("utf-8")
          
          
          def replace_once(text: str, old: str, new: str, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected exactly one old-text match, found {count}")
              return text.replace(old, new, 1)
          
          
          def main() -> None:
              process = PROCESS_PATH.read_text(encoding="utf-8")
              process = replace_once(process, '    IFDEF ZX48_P2_15_WAIT_ENABLED\n    ; P2.15 specific WAIT wakes only for the exact recorded child generation.\n    ld a,(process_zombie_parent_pid)\n    ld b,a\n    ld a,(process_zombie_pid)\n    call zx48_process_zombie_wait_specific_match\n    ret c\n    ld a,(process_zombie_parent_pid)\n    call zx48_process_links_desc_ptr\n    ret c\n    ENDIF\n    ld (ix+PROC_STATE),PROC_READY\n', '    IFDEF ZX48_P2_15_WAIT_ENABLED\n    IFDEF ZX48_P2_16_WAIT_ANY_ENABLED\n    ; P2.16 any-child WAIT accepts this already parent-generation-qualified\n    ; exiting child without applying the P2.15 exact-child token filter.\n    ld a,(process_zombie_parent_pid)\n    call zx48_process_wait_any_flag_ptr\n    ret c\n    ld a,(hl)\n    or a\n    jr nz,zx48_process_zombie_wake_ready\n    ENDIF\n    ; P2.15 specific WAIT wakes only for the exact recorded child generation.\n    ld a,(process_zombie_parent_pid)\n    ld b,a\n    ld a,(process_zombie_pid)\n    call zx48_process_zombie_wait_specific_match\n    ret c\n    ld a,(process_zombie_parent_pid)\n    call zx48_process_links_desc_ptr\n    ret c\n    ENDIF\nzx48_process_zombie_wake_ready:\n    ld (ix+PROC_STATE),PROC_READY\n', "P2.16 wait-any wake qualification")
              tail = 'process_wait_status_ptr: defs MAX_PROCESSES*2,0\n    ENDM\n'
              process = replace_once(process, tail, tail + inflate(MACRO_Z), "P2.16 staged wait-any emitter")
              PROCESS_PATH.write_text(process, encoding="utf-8", newline="\n")
          
              run = RUN_PATH.read_text(encoding="utf-8")
              run = replace_once(run, 'import phase2_wait_specific\nfrom driver_core import (\n', 'import phase2_wait_specific\nimport phase2_wait_any\nfrom driver_core import (\n', "P2.16 driver import")
              run = replace_once(run, '    if step == "P2.15":\n        return phase2_wait_specific.dispatch(root, action, step, **kwargs)\n    if step.startswith("P2."):\n', '    if step == "P2.15":\n        return phase2_wait_specific.dispatch(root, action, step, **kwargs)\n    if step == "P2.16":\n        return phase2_wait_any.dispatch(root, action, step, **kwargs)\n    if step.startswith("P2."):\n', "P2.16 driver dispatch")
              RUN_PATH.write_text(run, encoding="utf-8", newline="\n")
          
              gate = GATE_PATH.read_text(encoding="utf-8")
              gate = replace_once(gate, 'CANDIDATE_STEPS: tuple[str, ...] = ("P2.08", "P2.09", "P2.10", "P2.11", "P2.12", "P2.13", "P2.14", "P2.15")', 'CANDIDATE_STEPS: tuple[str, ...] = ("P2.08", "P2.09", "P2.10", "P2.11", "P2.12", "P2.13", "P2.14", "P2.15", "P2.16")', "P2.16 gate registration")
              GATE_PATH.write_text(gate, encoding="utf-8", newline="\n")
          
              STATIC_PATH.write_text(inflate(STATIC_Z), encoding="utf-8", newline="\n")
              RUNTIME_PATH.write_text(inflate(RUNTIME_Z), encoding="utf-8", newline="\n")
          
          
          if __name__ == "__main__":
              main()
          PY

      - name: Guard candidate shape
        run: |
          python3 -m py_compile \
            v1/tools-host/test-driver/phase2_wait_any.py \
            v1/tools-host/test-driver/phase2_wait_any_runtime.py \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py
          grep -q '^    MACRO EMIT_WAIT_ANY_ROUTINES$' v1/src/kernel/process.asm
          grep -q '^ZX48_P2_16_WAIT_ANY_EMITTED EQU 1$' v1/src/kernel/process.asm
          grep -q '^zx48_syscall_resume_wait_any:$' v1/src/kernel/process.asm
          grep -q '^process_wait_any: defs MAX_PROCESSES,0$' v1/src/kernel/process.asm
          grep -q 'import phase2_wait_any' v1/tools-host/test-driver/run.py
          grep -q '"P2.16"' v1/tools-host/test-driver/phase2_gate.py
          git diff --check
          git status --short

      - name: Commit candidate
        run: |
          git config user.name 'ZX-UX P2.16 runner'
          git config user.email 'tuklusan@users.noreply.github.com'
          git add \
            v1/src/kernel/process.asm \
            v1/tools-host/test-driver/phase2_wait_any.py \
            v1/tools-host/test-driver/phase2_wait_any_runtime.py \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_gate.py
          git commit -m 'P2.16 candidate: generation-qualified wait any child'
          git push origin HEAD:main
