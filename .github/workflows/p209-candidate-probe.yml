name: P2.09 Candidate Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p209-candidate-probe.yml

permissions:
  contents: read

concurrency:
  group: zxux-p209-candidate-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p209-probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout probe base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Materialize frozen P2.09 candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d >/tmp/p209.patch.gz <<'P209_PATCH_GZ_BASE64'

P209_PATCH_GZ_BASE64
          echo 'e74b4efb2b0ca6a8d211cef94af729c625f05b329ee1a6613be4aab5c6a2ca74  /tmp/p209.patch.gz' | sha256sum -c -
          gzip -dc /tmp/p209.patch.gz >/tmp/p209.patch
          echo '02d70efb431343bf39b881a92425d247d8f526a9094897d0582066a8100ee1c2  /tmp/p209.patch' | sha256sum -c -
          git apply --index /tmp/p209.patch
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "v1/src/kernel/process.asm v1/src/kernel/syscall.asm v1/tools-host/test-driver/phase2_gate.py v1/tools-host/test-driver/phase2_spawn.py v1/tools-host/test-driver/run.py "
          echo 'fdab615319e9113165a891726dcb5a640b2b8725f980b5525d7df3f92f209722  v1/src/kernel/process.asm' | sha256sum -c -
          echo '31135c1d1e3e5a2b081a0257d305d9b9abc89083b548b40de9827acf2a540e65  v1/src/kernel/syscall.asm' | sha256sum -c -
          echo 'b9c3d836deca49abc91fc372387cb2a41c63c8715d89b6891eca601e611936dc  v1/tools-host/test-driver/phase2_gate.py' | sha256sum -c -
          echo '7c63bff9fb16a8559448a982fdf3763b9cf3f690c214158b0ef5e9bac3130e7e  v1/tools-host/test-driver/phase2_spawn.py' | sha256sum -c -
          echo '49dd42ee4a22833dd9e178039b727f99e3186facf61037e5ad9d5814a397adea  v1/tools-host/test-driver/run.py' | sha256sum -c -
          git config user.name 'ZX-UX P2.09 Probe'
          git config user.email 'zxux-p209-probe@invalid.local'
          git commit -m 'Ephemeral P2.09 candidate for validation'
          test -z "$(git status --porcelain)"

      - name: Run repository policy gates
        run: |
          ./tools/check_license_headers.sh
          python tools/check_project_policy.py
          git diff --check HEAD^

      - name: Require active durable Phase 0 and Phase 1 evidence
        run: |
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P2.09 build and emulator validation
        run: |
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.09
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.09

      - name: Execute registered Phase 2 gate
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/phase2_gate.py

      - name: Upload P2.09 probe evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p209-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/zxux-p209-probe-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            v1/build/kernel-p209.lst
            v1/build/kernel-p209.sym
            v1/build/p209-spawn.lst
            v1/build/p209-spawn.sym
          retention-days: 14
          if-no-files-found: warn
