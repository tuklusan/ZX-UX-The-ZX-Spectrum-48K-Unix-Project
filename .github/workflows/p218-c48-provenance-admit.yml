name: P2.18 C48 provenance admission

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-c48-provenance-admit.yml

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P218_EXACT_PARENT: 27b48cc3351caf52553db6900a24bcce20f0037c
      P218_OWNER_DOC_UPDATE: b58f9630397829788972260b5948e882452993e2
      P218_OLD_APPROVED_SPEC_BLOB: f1c4877b26c632bd0b9abd0468716019da68bf7e
      P218_NEW_APPROVED_SPEC_BLOB: 5744e9f2c440b4ef11f7ffcd7dad7d218f3ba44d
      P218_CHECKER_BLOB: 62a58ccd3a39414760b23106c1ff64e9a326ec4f
      P218_SPEC_PATH: docs/04-C48 Language Specification Rev 0.11.docx
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-c48-provenance

    steps:
      - name: Checkout exact provenance trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard owner update and current policy state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-c48-provenance-admit.yml"
          test "$(git rev-parse HEAD:"${P218_SPEC_PATH}")" = "${P218_NEW_APPROVED_SPEC_BLOB}"
          test "$(git rev-parse "${P218_OWNER_DOC_UPDATE}:${P218_SPEC_PATH}")" = "${P218_NEW_APPROVED_SPEC_BLOB}"
          test "$(git rev-parse "${P218_OWNER_DOC_UPDATE}^:${P218_SPEC_PATH}")" = "${P218_OLD_APPROVED_SPEC_BLOB}"
          test "$(git rev-parse HEAD:tools/check_license_headers.sh)" = "${P218_CHECKER_BLOB}"
          grep -Fq "readonly C48_SPEC_DOCX_BLOB_SHA1=\"${P218_OLD_APPROVED_SPEC_BLOB}\"" tools/check_license_headers.sh
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
          test -z "$(git status --porcelain)"

      - name: Assemble exact documentation provenance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checker = Path("tools/check_license_headers.sh")
          text = checker.read_text(encoding="utf-8")
          old = 'readonly C48_SPEC_DOCX_BLOB_SHA1="f1c4877b26c632bd0b9abd0468716019da68bf7e"\n'
          new = (
              '# Project-owner C48 documentation update admitted from '
              'b58f9630397829788972260b5948e882452993e2.\n'
              'readonly C48_SPEC_DOCX_BLOB_SHA1="5744e9f2c440b4ef11f7ffcd7dad7d218f3ba44d"\n'
          )
          if text.count(old) != 1 or new in text:
              raise SystemExit("C48 specification approval pin shape changed")
          checker.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git add tools/check_license_headers.sh
          git rm .github/workflows/p218-c48-provenance-admit.yml
          test "$(git hash-object -- "${P218_SPEC_PATH}")" = "${P218_NEW_APPROVED_SPEC_BLOB}"
          grep -Fq "readonly C48_SPEC_DOCX_BLOB_SHA1=\"${P218_NEW_APPROVED_SPEC_BLOB}\"" tools/check_license_headers.sh
          expected="$(printf '%s\n' .github/workflows/p218-c48-provenance-admit.yml tools/check_license_headers.sh | sort)"
          test "$(git diff --cached --name-only | sort)" = "${expected}"
          git diff --quiet

      - name: Three clean provenance scans and mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' .github/workflows/p218-c48-provenance-admit.yml tools/check_license_headers.sh | sort)"
          baseline=""
          for scan in 1 2 3; do
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            test "$(git diff --cached --name-only | sort)" = "${expected}"
            git diff --quiet
            git diff --cached --check
            test "$(git hash-object -- "${P218_SPEC_PATH}")" = "${P218_NEW_APPROVED_SPEC_BLOB}"
            test "$(git rev-parse HEAD:docs/01-ZX-UX-ARCHITECTURE-REV12.md)" = "$(git rev-parse HEAD^:docs/01-ZX-UX-ARCHITECTURE-REV12.md)"
            test "$(git rev-parse HEAD:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV03.md)" = "$(git rev-parse HEAD^:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV03.md)"
            test "$(git rev-parse HEAD:docs/01-ZX-UX-ARCHITECTURE-REV13.md)" = "$(git rev-parse HEAD^:docs/01-ZX-UX-ARCHITECTURE-REV13.md)"
            test "$(git rev-parse HEAD:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV04.md)" = "$(git rev-parse HEAD^:docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV04.md)"
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            digest="$(git diff --cached --binary | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Commit exact tested provenance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZX-UX P2.18 provenance runner"
          git config user.email "tuklusan@users.noreply.github.com"
          git commit -m "policy: admit owner-updated C48 specification bytes"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:"${P218_SPEC_PATH}")" = "${P218_NEW_APPROVED_SPEC_BLOB}"

      - name: Recheck mandatory gates on exact repair commit
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')" = "${ZXUX_REV12_SHA256}"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"

      - name: Push exact repair if main has not moved
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${remote}" = "${GITHUB_SHA}"
          git push --porcelain origin HEAD:main

      - name: Collect provenance evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git rev-parse HEAD^ > "${ZXUX_EVIDENCE_DIR}/workflow-commit.txt"
          git hash-object -- "${P218_SPEC_PATH}" > "${ZXUX_EVIDENCE_DIR}/spec-blob.txt" 2>/dev/null || true
          git hash-object -- tools/check_license_headers.sh > "${ZXUX_EVIDENCE_DIR}/license-checker-blob.txt" 2>/dev/null || true
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/status.txt"

      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-c48-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-c48-provenance/
          retention-days: 90
          if-no-files-found: error
