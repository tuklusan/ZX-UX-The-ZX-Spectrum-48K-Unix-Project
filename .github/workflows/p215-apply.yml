name: P2.15 guarded source patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p215-apply.yml

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require unchanged recovery source
        run: |
          git merge-base --is-ancestor a0e81216b3d98f5cb22d91d21c8c0cfbbd798fbc HEAD
          git diff --exit-code a0e81216b3d98f5cb22d91d21c8c0cfbbd798fbc -- \
            v1/src/kernel/process.asm \
            v1/src/kernel/syscall.asm \
            v1/tools-host/test-driver/run.py
          test -f scratch/p215-apply.py

      - name: Apply exact guarded P2.15 patch
        run: python3 scratch/p215-apply.py

      - name: Guard patch shape
        run: |
          python3 -m py_compile \
            v1/tools-host/test-driver/run.py \
            v1/tools-host/test-driver/phase2_wait_specific.py
          grep -q 'MACRO EMIT_WAIT_SPECIFIC_ROUTINES' v1/src/kernel/process.asm
          grep -q 'zx48_syscall_resume_wait_specific' v1/src/kernel/syscall.asm
          grep -q 'return phase2_wait_specific.dispatch' v1/tools-host/test-driver/run.py
          git diff --check
          git status --short

      - name: Commit guarded candidate
        run: |
          git config user.name 'ZX-UX P2.15 diagnostic runner'
          git config user.email 'tuklusan@users.noreply.github.com'
          git add \
            v1/src/kernel/process.asm \
            v1/src/kernel/syscall.asm \
            v1/tools-host/test-driver/run.py
          git commit -m 'P2.15 candidate: generation-safe specific WAIT continuation'
          git push origin HEAD:main
