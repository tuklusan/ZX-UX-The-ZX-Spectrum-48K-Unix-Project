name: P2.15 guarded source patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p215-apply.yml

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require unchanged candidate bytes
        run: |
          git merge-base --is-ancestor 70e94264b8f2daa9e667716ce21a66a965c7f182 HEAD
          git diff --exit-code 70e94264b8f2daa9e667716ce21a66a965c7f182 -- \
            v1/src/kernel/process.asm \
            v1/src/kernel/syscall.asm \
            v1/tools-host/test-driver/phase2_wait_specific.py \
            v1/tools-host/test-driver/phase2_wait_specific_runtime.py \
            v1/tools-host/test-driver/phase2_wait_specific_diag.py
          test -f scratch/p215-apply.py

      - name: Apply exact guarded P2.15 repair
        run: python3 scratch/p215-apply.py

      - name: Guard repair shape
        run: |
          python3 -m py_compile \
            v1/tools-host/test-driver/phase2_wait_specific.py \
            v1/tools-host/test-driver/phase2_wait_specific_runtime.py \
            v1/tools-host/test-driver/phase2_wait_specific_diag.py
          grep -A8 'call zx48_process_zombie_wait_specific_match' v1/src/kernel/process.asm | \
            grep -q 'call zx48_process_links_desc_ptr'
          grep -q '^    IFDEF ZX48_P2_15_WAIT_ENABLED$' v1/src/kernel/process.asm
          test "$(grep -c '^    IFDEF ZX48_P2_15_WAIT_ENABLED$' v1/src/kernel/syscall.asm)" -eq 2
          grep -q 'DEFINE ZX48_P2_15_WAIT_ENABLED' v1/tools-host/test-driver/phase2_wait_specific_runtime.py
          git diff --check
          git status --short

      - name: Commit guarded repair
        run: |
          git config user.name 'ZX-UX P2.15 diagnostic runner'
          git config user.email 'tuklusan@users.noreply.github.com'
          git add v1/src/kernel/process.asm
          git commit -m 'P2.15 candidate: reacquire parent after exact wake match'
          git push origin HEAD:main
