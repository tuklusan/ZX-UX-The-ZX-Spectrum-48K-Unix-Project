name: Phase-10 checkpoint tag
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase10-checkpoint-tag.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Guard activated Phase-10 head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          python3 tools/check_phase9_evidence.py --require-active
          python3 tools/check_phase10_evidence.py --require-active
          python3 tools/check_media_retention.py
          test -f v1/dist/certification/P10.36.result.json
          test -f v1/dist/certification/phase-10.json
          test -z "$(find v1/dist/certification -maxdepth 1 -name 'P11.*' -print -quit)"
      - name: Self-remove and checkpoint exact final codebase
        run: |
          set -euo pipefail
          rm .github/workflows/phase10-checkpoint-tag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/phase10-checkpoint-tag.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/phase10-checkpoint-tag.yml"
          git commit -m "checkpoint: finalize Phase-10 tag target"
          final="$(git rev-parse HEAD)"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$final"
          python3 tools/check_phase10_evidence.py --require-active
          python3 tools/check_media_retention.py
          git tag -f PHASE-10-COMPLETE "$final"
          git push --force origin refs/tags/PHASE-10-COMPLETE
          test "$(git ls-remote origin refs/tags/PHASE-10-COMPLETE | awk '{print $1}')" = "$final"
