name: P2.19 blocked-started cancellation qualification

# This is an exact-candidate historical qualification workflow. P2.19 closed at
# 518baa052e82c1da3f64547a3f6456d863d123e2 and is regression-checked by the
# Phase-2 aggregate. Keep the recipe available without re-running its one-shot
# parent/diff guard on later Phase-2 commits that touch shared driver files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p219-qualification
      P219_EXACT_PARENT: 2e7d840de96735843dd837d0aab9603ced63c3ff
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard exact P2.19 candidate diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P219_EXACT_PARENT}"
          git diff --name-only HEAD^ HEAD | sort > /tmp/p219-changed
          printf '%s\n' \
            .github/workflows/p219-qualification.yml \
            v1/src/kernel/scheduler.asm \
            v1/tools-host/test-driver/phase2_kill_started.py \
            v1/tools-host/test-driver/run.py \
            | sort > /tmp/p219-expected
          diff -u /tmp/p219-expected /tmp/p219-changed
          test -z "$(git status --porcelain)"
          echo "qualification_head=$(git rev-parse HEAD)"
          echo "qualification_parent=$(git rev-parse HEAD^)"

      - name: Three unchanged candidate scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git diff --check HEAD^ HEAD
            python3 -m py_compile v1/tools-host/test-driver/phase2_kill_started.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            test -z "$(git status --porcelain)"
            digest="$(
              sha256sum \
                v1/src/kernel/scheduler.asm \
                v1/tools-host/test-driver/phase2_kill_started.py \
                v1/tools-host/test-driver/run.py \
                .github/workflows/p219-qualification.yml \
                | sha256sum | awk '{print $1}'
            )"
            if test -z "${baseline}"; then
              baseline="${digest}"
            else
              test "${digest}" = "${baseline}"
            fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Mandatory license and project-policy gates
        shell: bash
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Require active architecture and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          echo "architecture_sha256=${architecture_sha256}"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gettext \
            libaudiofile-dev \
            libfreetype6-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libpng-dev \
            libsdl1.2-dev \
            libtool \
            libxml2-dev \
            perl \
            pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P2.19 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.19

      - name: Execute P2.19 test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}"
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.19 \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.19.test.log"

      - name: Collect exact candidate evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/source-commit.txt"
          git rev-parse HEAD^ > "${ZXUX_EVIDENCE_DIR}/source-parent.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/worktree-status.txt"
          sha256sum \
            v1/src/kernel/process.asm \
            v1/src/kernel/scheduler.asm \
            v1/src/kernel/syscall.asm \
            v1/tools-host/test-driver/phase2_kill_started.py \
            v1/tools-host/test-driver/run.py \
            .github/workflows/p219-qualification.yml \
            > "${ZXUX_EVIDENCE_DIR}/qualification-hashes.sha256"
          for path in \
            v1/build/kernel.bin \
            v1/build/kernel-p1.sym \
            v1/build/kernel-p1.lst; do
            if test -f "${path}"; then
              cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"
            fi
          done
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload P2.19 qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p219-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p219-qualification/
          retention-days: 90
          if-no-files-found: error
