name: P4.25 idle pack qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p425-qualification
      P425_BASE: 18f354522afadd4fe29f9aa73cb467f7848af5aa
      ZXUX_REV16_SHA256: 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
      ZXUX_REV07_SHA256: 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Guard exact P4.25 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P425_BASE" HEAD | sort > /tmp/p425-changed
          printf '%s\n'             .github/workflows/p425-dispatch-once.yml             .github/workflows/p425-qualification.yml             v1/src/kernel/scheduler.asm             v1/src/kernel/zxpack.asm             v1/tools-host/test-driver/phase4_idle_pack.py             v1/tools-host/test-driver/run.py | sort > /tmp/p425-expected
          diff -u /tmp/p425-expected /tmp/p425-changed
          git diff --check "$P425_BASE" HEAD
          test -z "$(git status --porcelain)"
      - name: Three unchanged candidate scans
        run: |
          set -euo pipefail
          baseline=""
          tree="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/phase4_idle_pack.py v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            digest="$(sha256sum v1/src/kernel/scheduler.asm v1/src/kernel/zxpack.asm v1/tools-host/test-driver/phase4_idle_pack.py v1/tools-host/test-driver/run.py .github/workflows/p425-dispatch-once.yml .github/workflows/p425-qualification.yml v1/dist/certification/P4.24.test.json | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
            echo "SCAN-$scan: CLEAN"
          done
      - name: Mandatory gates
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "$ZXUX_REV16_SHA256"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "$ZXUX_REV07_SHA256"
          test "$(sha256sum tools/manifest/toolchain.lock.json | awk '{print $1}')" = "$ZXUX_TOOLCHAIN_LOCK_SHA256"
          test -s v1/dist/certification/P4.24.test.json
          grep -q '"status": "PASS"' v1/dist/certification/P4.24.test.json
          grep -q '"source_commit": "5f8435f72f0b5fb90642a574b57f73b7570c9b85"' v1/dist/certification/P4.24.test.json
      - uses: actions/setup-python@v6
        with: {python-version: '3.13.15', check-latest: false}
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config
      - name: Acquire pinned runtime
        run: python tools/scripts/bootstrap-environment.py
      - name: Certify pinned runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py
      - name: Recheck E0.05 repository policy
        run: |
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step E0.05 --evidence-dir /tmp/zxux-p425-e005
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step E0.05 --evidence-dir /tmp/zxux-p425-e005
      - name: Recheck P4.24 prerequisite
        run: |
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P4.24 --evidence-dir /tmp/zxux-p425-p424
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P4.24 --evidence-dir /tmp/zxux-p425-p424
      - name: Execute P4.25 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P4.25
      - name: Execute P4.25 test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P4.25
      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR/meta"
          git rev-parse HEAD > "$ZXUX_EVIDENCE_DIR/meta/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$ZXUX_EVIDENCE_DIR/meta/candidate-tree.txt"
          git status --porcelain > "$ZXUX_EVIDENCE_DIR/meta/worktree-status.txt"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p425-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p425-qualification/
          retention-days: 90
          if-no-files-found: error
