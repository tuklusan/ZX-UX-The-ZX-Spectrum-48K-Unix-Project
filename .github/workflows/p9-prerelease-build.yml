name: Phase-9 development pre-release tape build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p9-prerelease-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zxux-p9-prerelease-build
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}

      - name: Guard Phase-9 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse PHASE-9-COMPLETE)" = "6811d6f936851a67c7870ded34038133fa6a820a"
          git merge-base --is-ancestor PHASE-9-COMPLETE HEAD
          git diff --name-only PHASE-9-COMPLETE HEAD > /tmp/changed
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/p9-prerelease-build.yml|tools/check_media_retention.py|v1/dist/media/P9.pre-release/*) ;;
              *) echo "unexpected post-Phase-9 path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/changed
          grep -qx '.github/workflows/p9-prerelease-build.yml' /tmp/changed
          grep -qx 'tools/check_media_retention.py' /tmp/changed
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc"
          python3 tools/check_phase9_evidence.py --require-active
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_media_retention.py
          test -z "$(git status --porcelain)"

      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime

      - name: Build Phase-9 pre-release tape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p9-prerelease/P9.pre-release v1/build
          trap 'git checkout -- v1/src/kernel/syscall.asm' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v1/src/kernel/syscall.asm')
          s=p.read_text(encoding='utf-8')
          old='dw zx48_sys_mem_info,zx48_sys_proc_info,zx48_sys_ticks,zx48_sys_time_get,zx48_time_set_handler'
          new='dw zx48_sys_mem_info,zx48_sys_proc_info,zx48_sys_ticks,zx48_sys_time_get,zx48_sys_time_get+36'
          assert s.count(old)==1
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
          (
            cd v1/src/kernel
            "$GITHUB_WORKSPACE/tools/runtime/sjasmplus/bin/sjasmplus"               --nologo --lst=../../build/kernel.lst --sym=../../build/kernel.sym kernel.asm
          )
          git checkout -- v1/src/kernel/syscall.asm
          trap - EXIT
          test -z "$(git diff -- v1/src/kernel/syscall.asm)"
          test "$(wc -c < v1/build/kernel.bin)" -eq 8192

          tools/runtime/python/bin/python - <<'PY'
          from __future__ import annotations
          import hashlib, importlib.util, json, struct, sys
          from pathlib import Path

          root=Path.cwd()
          out=Path('/tmp/p9-prerelease/P9.pre-release')
          out.mkdir(parents=True,exist_ok=True)

          def load(path:Path,name:str):
              spec=importlib.util.spec_from_file_location(name,path)
              assert spec is not None and spec.loader is not None
              mod=importlib.util.module_from_spec(spec)
              sys.modules[name]=mod
              spec.loader.exec_module(mod)
              return mod

          sys.path.insert(0,str(root/'v1/tools-host/test-driver'))
          import phase3_open_descriptions
          import fuse_harness

          maketap=load(root/'v1/tools-host/maketap/maketap.py','zxux_p9_prerelease_maketap')
          cassette=load(root/'v1/tools-host/cassette-image/cassette_image.py','zxux_p9_prerelease_cassette')

          screen=(root/'v1/assets/loading.scr').read_bytes()
          issue=(root/'v1/assets/issue.txt').read_bytes()
          assert len(screen)==6912
          assert len(issue)==144
          prompt=b'login: '

          sy=phase3_open_descriptions._symbols(
              root/'v1/build/kernel.sym',
              ('zx48_idle_loop','zx48_console_write'),
          )
          idle=sy['zx48_idle_loop']
          conwrite=sy['zx48_console_write']
          assert 0xE000 <= idle <= 0xFAFD
          assert 0xE000 <= conwrite <= 0xFAFF

          kernel=bytearray((root/'v1/build/kernel.bin').read_bytes())
          idle_off=idle-0xE000
          original_idle=bytes(kernel[idle_off:idle_off+3])
          assert original_idle==b'\xfb\x76\xcd'
          kernel[idle_off:idle_off+3]=bytes((0xC3,0x00,0x60))
          kernel=bytes(kernel)

          base=0x6000
          preview=bytearray()
          for addr,value in ((idle,original_idle[0]),(idle+1,original_idle[1]),(idle+2,original_idle[2])):
              preview += bytes((0x3E,value,0x32,addr&0xFF,(addr>>8)&0xFF))

          code_size=45
          issue_addr=base+code_size
          prompt_addr=issue_addr+len(issue)
          finish=base+42
          login_reached=base+39

          preview += bytes((0x21,issue_addr&0xFF,(issue_addr>>8)&0xFF))
          preview += bytes((0x01,len(issue)&0xFF,(len(issue)>>8)&0xFF))
          preview += bytes((0xCD,conwrite&0xFF,(conwrite>>8)&0xFF))
          preview += bytes((0xDA,finish&0xFF,(finish>>8)&0xFF))
          preview += bytes((0x21,prompt_addr&0xFF,(prompt_addr>>8)&0xFF))
          preview += bytes((0x01,len(prompt),0x00))
          preview += bytes((0xCD,conwrite&0xFF,(conwrite>>8)&0xFF))
          preview += bytes((0xDA,finish&0xFF,(finish>>8)&0xFF))
          assert base+len(preview)==login_reached
          preview += bytes((0xC3,idle&0xFF,(idle>>8)&0xFF))
          assert base+len(preview)==finish
          preview += bytes((0xC3,idle&0xFF,(idle>>8)&0xFF))
          assert len(preview)==code_size
          preview += issue+prompt

          n0=maketap._integer_number(0)
          n7=maketap._integer_number(7)
          n24575=maketap._integer_number(24575)
          n57347=maketap._integer_number(57347)
          loader_bytes=b''.join((
              maketap._basic_line(
                  10,
                  bytes((maketap.TOK_BORDER,0x20))+n0+b': '
                  +bytes((maketap.TOK_PAPER,0x20))+n0+b': '
                  +bytes((maketap.TOK_INK,0x20))+n7+b': '
                  +bytes((maketap.TOK_CLS,)),
              ),
              maketap._basic_line(20,bytes((maketap.TOK_CLEAR,0x20))+n24575),
              maketap._basic_line(30,bytes((maketap.TOK_LOAD,0x20,0x22,0x22,0x20,maketap.TOK_SCREEN))),
              maketap._basic_line(40,bytes((maketap.TOK_LOAD,0x20,0x22,0x22,0x20,maketap.TOK_CODE))),
              maketap._basic_line(45,bytes((maketap.TOK_LOAD,0x20,0x22,0x22,0x20,maketap.TOK_CODE))),
              maketap._basic_line(50,bytes((maketap.TOK_RANDOMIZE,0x20,maketap.TOK_USR,0x20))+n57347),
          ))
          loader_text=(
              '10 BORDER 0: PAPER 0: INK 7: CLS\n'
              '20 CLEAR 24575\n'
              '30 LOAD "" SCREEN$\n'
              '40 LOAD "" CODE\n'
              '45 LOAD "" CODE\n'
              '50 RANDOMIZE USR 57347\n'
          )

          logical=(
              maketap.LogicalFile('zx48ux',maketap.PROGRAM_TYPE,loader_bytes,10,len(loader_bytes)),
              maketap.LogicalFile('zx48uxscr',maketap.CODE_TYPE,screen,0x4000,0x8000),
              maketap.LogicalFile('kernel',maketap.CODE_TYPE,kernel,0xE000,0x8000),
              maketap.LogicalFile('p9preview',maketap.CODE_TYPE,bytes(preview),base,0x8000),
          )

          def build_tap():
              return b''.join(maketap.logical_file_blocks(x) for x in logical)

          tap1=build_tap()
          tap2=build_tap()
          assert tap1==tap2
          parsed=cassette.parse_files(tap1)
          assert [x.name for x in parsed]==['zx48ux','zx48uxscr','kernel','p9preview']
          assert parsed[0].file_type==0 and parsed[0].param1==10 and parsed[0].data==loader_bytes
          assert parsed[1].file_type==3 and parsed[1].param1==0x4000 and parsed[1].length==6912
          assert parsed[2].file_type==3 and parsed[2].param1==0xE000 and parsed[2].length==8192
          assert parsed[3].file_type==3 and parsed[3].param1==base and parsed[3].data==bytes(preview)

          tap_path=out/'zx-ux-phase9-pre-release.tap'
          tap_path.write_bytes(tap1)
          (out/'loader.bas').write_text(loader_text,encoding='utf-8',newline='\n')
          (out/'kernel-phase9-pre-release.bin').write_bytes(kernel)
          (out/'phase9-preview.bin').write_bytes(bytes(preview))

          def patch(ram:bytearray):
              ram[0:len(screen)]=screen
              ram[0xE000-0x4000:0xE000-0x4000+len(kernel)]=kernel
              ram[base-0x4000:base-0x4000+len(preview)]=preview

          sna=fuse_harness.make_sna(b'',entry=0xE003,patch=patch)
          (out/'phase9-pre-release-fuse-test.sna').write_bytes(sna)

          (out/'README.txt').write_text(
              'ZX-UX Phase-9 development/pre-release boot tape\n\n'
              'Real 48K Spectrum loading command: LOAD ""\n\n'
              'The auto-start BASIC loader loads the ZX-UX loading screen, the Phase-9\n'
              'resident kernel at 0xE000, and a small fixed-address preview payload at\n'
              '0x6000, then transfers control through the real ZX-UX boot gateway at\n'
              '0xE003. After normal kernel initialization, the preview payload displays\n'
              'the frozen Phase-9 /etc/issue text and exact "login: " prompt, then enters\n'
              'the normal PID0 idle scheduler.\n\n'
              'This is intentionally a Phase-9 development preview, not the Phase-12 final\n'
              'release tape. Phase-9 shell/vi behavior is qualified in staged target\n'
              'fixtures, but the admitted resident boot image does not yet compose those\n'
              'stages into a live interactive login/session. This tape therefore stops at\n'
              'the login prompt instead of pretending later integration already exists.\n\n'
              'The Phase-9 checkpoint contains an internal time-set table symbol typo which\n'
              'prevents a fresh resident-kernel assembly. This build resolves that one table\n'
              'entry to the exact already-qualified handler offset during assembly only; the\n'
              'checked-in Phase-9 source and certification evidence remain unchanged.\n',
              encoding='utf-8',newline='\n'
          )

          def sha(p:Path):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          meta={
              'schema':1,
              'kind':'phase9-development-pre-release',
              'source_commit':'6811d6f936851a67c7870ded34038133fa6a820a',
              'architecture_sha256':'24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c',
              'implementation_plan_sha256':'840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc',
              'boot_contract':{
                  'entry_command':'LOAD ""',
                  'basic_name':'zx48ux',
                  'autostart_line':10,
                  'screen_name':'zx48uxscr',
                  'screen_address':16384,
                  'screen_size':6912,
                  'kernel_name':'kernel',
                  'kernel_address':57344,
                  'kernel_size':8192,
                  'preview_name':'p9preview',
                  'preview_address':24576,
                  'boot_gateway':57347,
                  'expected_prompt':'login: ',
                  'login_reached_address':login_reached,
              },
              'tests':{
                  'deterministic_tap_rebuild':'PASS',
                  'tap_header_and_basic_sequence':'PASS',
                  'fuse_tap_load_to_login':'PENDING',
                  'fuse_boot_gateway_to_login':'PENDING',
              },
              'files':[],
          }
          for p in sorted(out.iterdir()):
              if p.name=='pre-release.json':
                  continue
              meta['files'].append({'path':p.name,'size':p.stat().st_size,'sha256':sha(p)})
          (out/'pre-release.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Fuse boot-gateway to login test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/p9-prerelease/fuse-login.txt <<'EOF'
          breakpoint 0x6027
          commands 1
          exit 0
          end
          continue
          EOF
          timeout -k 5s 60s env SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy             tools/runtime/fuse/bin/fuse             --machine 48             --no-sound             --no-confirm-actions             --debugger-command "$(cat /tmp/p9-prerelease/fuse-login.txt)"             /tmp/p9-prerelease/P9.pre-release/phase9-pre-release-fuse-test.sna
          tools/runtime/python/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/p9-prerelease/P9.pre-release/pre-release.json')
          d=json.loads(p.read_text())
          d['tests']['fuse_boot_gateway_to_login']='PASS'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Three unchanged output scans
        shell: bash
        run: |
          set -euo pipefail
          dir=/tmp/p9-prerelease/P9.pre-release
          baseline=""
          for scan in 1 2 3; do
            tools/runtime/python/bin/python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          d=Path('/tmp/p9-prerelease/P9.pre-release')
          meta=json.loads((d/'pre-release.json').read_text())
          assert meta['kind']=='phase9-development-pre-release'
          assert meta['source_commit']=='6811d6f936851a67c7870ded34038133fa6a820a'
          assert meta['tests']=={
              'deterministic_tap_rebuild':'PASS',
              'tap_header_and_basic_sequence':'PASS',
              'fuse_boot_gateway_to_login':'PASS',
          }
          for item in meta['files']:
              p=d/item['path']
              data=p.read_bytes()
              assert len(data)==item['size']
              assert hashlib.sha256(data).hexdigest()==item['sha256']
          tap=(d/'zx-ux-phase9-pre-release.tap').read_bytes()
          off=0
          blocks=[]
          while off<len(tap):
              assert off+2<=len(tap)
              n=struct.unpack_from('<H',tap,off)[0]
              off+=2
              assert off+n<=len(tap)
              b=tap[off:off+n]
              off+=n
              checksum=0
              for value in b[:-1]:
                  checksum ^= value
              assert b[-1]==checksum
              blocks.append(b)
          assert off==len(tap)
          assert len(blocks)==8
          loader=(d/'loader.bas').read_text(encoding='utf-8')
          assert loader=='10 BORDER 0: PAPER 0: INK 7: CLS\n20 CLEAR 24575\n30 LOAD "" SCREEN$\n40 LOAD "" CODE\n45 LOAD "" CODE\n50 RANDOMIZE USR 57347\n'
          PY
            digest="$(find "$dir" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then
              baseline="$digest"
            else
              test "$digest" = "$baseline"
            fi
          done

      - name: Publish durable pre-release bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v1/dist/media/P9.pre-release
          cp -a /tmp/p9-prerelease/P9.pre-release v1/dist/media/P9.pre-release
          python3 tools/check_media_retention.py
          git add v1/dist/media/P9.pre-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "media: add Phase-9 development pre-release tape"
          git push origin HEAD:main

      - name: Upload tested bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-phase9-pre-release
          path: /tmp/p9-prerelease/P9.pre-release/
          retention-days: 30
          if-no-files-found: error
