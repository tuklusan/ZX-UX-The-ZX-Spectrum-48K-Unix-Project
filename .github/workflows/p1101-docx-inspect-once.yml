name: P11.01 DOCX inspection once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p1101-docx-inspect-once.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Extract canonical DOCX text and stale-authority inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1101-docx
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p=Path("docs/04-C48 Language Specification Rev 0.11.docx")
          data=p.read_bytes()
          print("DOCX_SHA256",hashlib.sha256(data).hexdigest())
          print("DOCX_SIZE",len(data))
          texts=[]
          with zipfile.ZipFile(p) as z:
              print("DOCX_MEMBER_COUNT",len(z.namelist()))
              for name in z.namelist():
                  if name.startswith("word/") and name.endswith(".xml"):
                      try: root=ET.fromstring(z.read(name))
                      except ET.ParseError: continue
                      chunks=[n.text or "" for n in root.iter() if n.tag.endswith("}t")]
                      if chunks:
                          texts.append((name," ".join(chunks)))
          out="\n\n".join(f"===== {n} =====\n{t}" for n,t in texts)
          Path("/tmp/p1101-docx/docx-text.txt").write_text(out,encoding="utf-8")
          for pat in ("REV11","Revision 11","REV02","Revision 02","REV16","Revision 16","REV17","Revision 17","REV08","Revision 08"):
              hits=[m.start() for m in re.finditer(re.escape(pat),out,re.I)]
              print(f"TERM {pat!r} COUNT {len(hits)}")
              for i in hits[:30]:
                  print("CONTEXT",re.sub(r"\s+"," ",out[max(0,i-160):i+260]))
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p1101-docx-inspection-${{ github.run_id }}
          path: /tmp/p1101-docx/docx-text.txt
          retention-days: 7
          if-no-files-found: error
      - name: Remove one-shot helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1101-docx-inspect-once.yml
          git commit -m "cleanup: remove P11.01 DOCX inspection helper"
          git push origin HEAD:main
