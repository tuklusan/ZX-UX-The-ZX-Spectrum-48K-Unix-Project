name: P10 detect-loader visual diagnostic once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p10-detect-loader-visual-diagnostic-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Install diagnostic UI helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick xdotool xvfb
      - name: Reproduce Fuse detect-loaders enabled path
        shell: bash
        run: |
          set -euo pipefail
          diag=/tmp/p10-detect-loader-visual
          mkdir -p "$diag"
          cat >"$diag/debugger.txt" <<'EOF'
          base 16
          breakpoint 0x5ce7
          commands 1
          print 0xa00001
          continue
          end
          breakpoint 0x0556
          commands 2
          print 0xa00002
          continue
          end
          breakpoint 0x5eb4
          commands 3
          print 0xfeed00b4
          print [0x5ef7]
          print [0x5ef8]
          print [0x5ef5]
          print [0x5ef6]
          continue
          end
          breakpoint 0x5f59
          commands 4
          print 0xfeed0059
          print [0x5ef7]
          print [0x5ef8]
          print [0x5ef5]
          print [0x5ef6]
          continue
          end
          breakpoint 0x5f2a
          commands 5
          print 0xfeed002a
          print [0x5ef7]
          print [0x5ef8]
          print [0x5ef5]
          print [0x5ef6]
          continue
          end
          breakpoint 0xe003
          commands 6
          print 0xfeede003
          exit 0
          end
          continue
          EOF
          Xvfb :99 -screen 0 1280x900x24 >"$diag/xvfb.log" 2>&1 &
          xvfb_pid=$!
          fuse_pid=""
          trap 'kill "$fuse_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          stdbuf -oL -eL tools/runtime/fuse/bin/fuse --machine 48 \
            --rom-48 tools/runtime/fuse/roms/48.rom \
            --tape v1/dist/media/P10.pre-release/zx-ux-phase10-pre-release.tzx \
            --no-fastload --no-traps --no-accelerate-loader \
            --detect-loader --no-confirm-actions --no-sound \
            --debugger-command "$(cat "$diag/debugger.txt")" \
            >"$diag/fuse-state.log" 2>&1 &
          fuse_pid=$!
          window=""
          for i in $(seq 1 40); do
            window="$(xdotool search --onlyvisible --name '^Fuse$' 2>/dev/null | head -n1 || true)"
            test -n "$window" && break
            sleep 0.25
          done
          test -n "$window"
          xdotool windowfocus --sync "$window" || true
          xdotool mousemove --window "$window" 160 145 click 1 || true
          sleep 0.75
          xdotool keydown Shift_L; sleep 0.25; xdotool keyup Shift_L; sleep 0.60
          xdotool keydown j; sleep 0.45; xdotool keyup j; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool key --delay 300 ctrl+p; sleep 0.60
          xdotool keydown Return; sleep 0.45; xdotool keyup Return
          for i in $(seq 1 1200); do
            if grep -q '0xfeed0059' "$diag/fuse-state.log"; then
              sleep 0.30
              import -display :99 -window "$window" "$diag/fuse-during-hold.png"
              break
            fi
            grep -q '0xfeede003' "$diag/fuse-state.log" && break
            sleep 0.1
          done
          cp "$diag/fuse-state.log" "$diag/fuse-state-final.log"
          kill "$fuse_pid" "$xvfb_pid" 2>/dev/null || true
          fuse_pid=""
          xvfb_pid=""
          trap - EXIT
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p10-detect-loader-visual-diagnostic
          path: /tmp/p10-detect-loader-visual/
          retention-days: 7
          if-no-files-found: error
