name: P4.33 Phase 4 activation validation recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p433-activation-recovery.yml

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify immutable activation
        id: activation
        run: |
          set -euo pipefail
          activation_sha="$(git log -1 --format=%H -- v1/dist/certification/phase-4.json)"
          test -n "$activation_sha"
          test "$(git log -1 --format=%s "$activation_sha")" = "phase4: activate Phase-4 aggregate evidence for 10820f470d95941f8e172f439134aea6826c64c8"
          git show "$activation_sha:v1/dist/certification/phase-4.json" >/tmp/phase-4.json
          grep -q '"status": "PASS"' /tmp/phase-4.json
          grep -q 'ZX-UX PHASE 4 CERTIFICATION PASS' /tmp/phase-4.json
          echo "activation_sha=$activation_sha" >> "$GITHUB_OUTPUT"

      - name: Create exact activation validation ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SHA: ${{ steps.activation.outputs.activation_sha }}
        run: |
          set -euo pipefail
          ref="p433-activation-recovery-${GITHUB_RUN_ID}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/$ref" -f sha="$ACTIVATION_SHA"

      - name: Dispatch exact activation validations
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SHA: ${{ steps.activation.outputs.activation_sha }}
          VALIDATION_REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          : > /tmp/p433-recovery-runs
          for wf in quality-and-ci.yml phase1-certification.yml phase2-validation.yml phase4-finalization.yml; do
            gh workflow run "$wf" --repo "${GITHUB_REPOSITORY}" --ref "$VALIDATION_REF"
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" --event workflow_dispatch --limit 40 --json databaseId,headSha,headBranch --jq '.[] | select(.headSha=="'"${ACTIVATION_SHA}"'" and .headBranch=="'"${VALIDATION_REF}"'") | .databaseId' | head -n1)"
              if test -n "$run_id"; then break; fi
              sleep 2
            done
            test -n "$run_id"
            printf '%s %s\n' "$wf" "$run_id" >> /tmp/p433-recovery-runs
          done
          while read -r wf run_id; do
            gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          done < /tmp/p433-recovery-runs

      - name: Verify durable activation
        env:
          ACTIVATION_SHA: ${{ steps.activation.outputs.activation_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$ACTIVATION_SHA"
          python3 tools/check_phase4_evidence.py --require-active
          python3 tools/test_phase4_evidence_negative.py

      - name: Mark activation validation PASS
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_SHA: ${{ steps.activation.outputs.activation_sha }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$ACTIVATION_SHA" -f state=success -f context=p433-activation-validations -f description="exact Phase-4 activation validations PASS"

      - name: Cleanup exact activation validation ref
        if: ${{ always() && steps.ref.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_REF: ${{ steps.ref.outputs.ref }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$VALIDATION_REF" || true
