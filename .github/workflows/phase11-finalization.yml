name: ZX-UX Phase 11 Aggregate Validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase11-finalization.yml
      - .github/workflows/phase11-activation.yml
      - tools/finalize_phase11_evidence.py
      - tools/check_phase11_evidence.py
      - tools/test_phase11_evidence_negative.py
      - v1/dist/certification/P11.*.json
      - v1/dist/certification/phase-11.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-phase11-aggregate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase11-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Mandatory policy gates
        run: |
          set -euo pipefail
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py
          python3 tools/check_phase10_evidence.py --require-active
          python3 tools/check_media_retention.py
      - name: Validate Phase 11 aggregate state
        run: |
          set -euo pipefail
          if test -f v1/dist/certification/phase-11.json; then
            python3 tools/check_phase11_evidence.py --require-active
            python3 tools/test_phase11_evidence_negative.py
          else
            python3 tools/check_phase11_evidence.py
          fi
