name: Ephemeral Source Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Pack checked-out source
        run: tar --exclude=.git -czf /tmp/zxux-source-${GITHUB_SHA}.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zxux-source-${{ github.sha }}
          path: /tmp/zxux-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
