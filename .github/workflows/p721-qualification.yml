name: P7.21 Phase-7 acceptance qualification
on:
  workflow_dispatch: {}
permissions:
  actions: write
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p721-qualification
      P721_BASE: 6e39d4057220e2842bfad83e74db9e8b44429962
      P720_SOURCE: ff117a2519eb0fbf86f3241f732d0e235c398f97
      ZXUX_REV16_SHA256: 24fe9d206c2f05bbc24f11544a5cb5a0b6ab104e9fc52e654a10c2d9734b008c
      ZXUX_REV07_SHA256: 840a52e55f623d3f5453329838728e9933ee650ac78c4f294acbca7910638fbc
      ZXUX_TOOLCHAIN_LOCK_SHA256: 1cb5226fbbf702d704a007982cdd6e91cf7b6c4b145d25c788f29e12712c4244
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Guard exact P7.21 candidate diff
        run: |
          set -euo pipefail
          git diff --name-only "$P721_BASE" HEAD | sort > /tmp/changed
          printf '%s\n' \
            .github/workflows/p721-qualification.yml \
            .github/workflows/phase7-activation.yml \
            .github/workflows/phase7-finalization.yml \
            tools/check_phase7_evidence.py \
            tools/finalize_phase7_evidence.py \
            tools/test_phase7_evidence_negative.py \
            v1/src/kernel/graphics.asm \
            v1/tools-host/test-driver/phase7_acceptance.py \
            v1/tools-host/test-driver/run.py | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git diff --check "$P721_BASE" HEAD
          test -z "$(git status --porcelain)"
      - name: Three unchanged candidate scans
        run: |
          set -euo pipefail
          baseline=""; tree="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            python3 -m py_compile \
              v1/tools-host/test-driver/phase7_acceptance.py \
              v1/tools-host/test-driver/run.py \
              tools/check_phase7_evidence.py \
              tools/finalize_phase7_evidence.py \
              tools/test_phase7_evidence_negative.py
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            test -z "$(git status --porcelain)"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            digest="$(sha256sum \
              v1/src/kernel/graphics.asm \
              v1/tools-host/test-driver/phase7_acceptance.py \
              v1/tools-host/test-driver/run.py \
              tools/check_phase7_evidence.py \
              tools/finalize_phase7_evidence.py \
              tools/test_phase7_evidence_negative.py \
              .github/workflows/p721-qualification.yml \
              .github/workflows/phase7-activation.yml \
              .github/workflows/phase7-finalization.yml \
              v1/dist/certification/P7.20.build.json \
              v1/dist/certification/P7.20.test.json \
              v1/dist/media/P7.20/manifest.json | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
          done
      - name: Mandatory gates
        run: |
          set -euo pipefail
          test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV16.md | awk '{print $1}')" = "$ZXUX_REV16_SHA256"
          test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV07.md | awk '{print $1}')" = "$ZXUX_REV07_SHA256"
          test "$(sha256sum tools/manifest/toolchain.lock.json | awk '{print $1}')" = "$ZXUX_TOOLCHAIN_LOCK_SHA256"
          python3 tools/check_phase6_evidence.py --require-active
          python3 tools/check_phase7_evidence.py
          python3 tools/test_phase7_evidence_negative.py
          python3 tools/check_media_retention.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for action in ("build","test"):
              r=json.loads(Path(f"v1/dist/certification/P7.20.{action}.json").read_text())
              assert r["step"]=="P7.20" and r["action"]==action and r["status"]=="PASS"
              assert r["source_commit"]=="ff117a2519eb0fbf86f3241f732d0e235c398f97"
          assert Path("v1/dist/media/P7.20/manifest.json").is_file()
          PY
      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Execute P7.21 build
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P7.21
      - name: Execute P7.21 test
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P7.21
      - name: Collect exact evidence
        if: always()
        run: |
          mkdir -p "$ZXUX_EVIDENCE_DIR/meta"
          git rev-parse HEAD > "$ZXUX_EVIDENCE_DIR/meta/candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$ZXUX_EVIDENCE_DIR/meta/candidate-tree.txt"
          git status --porcelain > "$ZXUX_EVIDENCE_DIR/meta/worktree-status.txt"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-p721-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p721-qualification/
          retention-days: 90
          if-no-files-found: error
      - name: Dispatch exact admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          p=json.dumps({"ref":"main","inputs":{"step":"P7.21","run_id":os.environ["GITHUB_RUN_ID"],"source_commit":os.environ["GITHUB_SHA"]}}).encode()
          q=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/phase7-step-admission.yml/dispatches",data=p,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(q,timeout=30) as r: assert r.status==204
          PY
