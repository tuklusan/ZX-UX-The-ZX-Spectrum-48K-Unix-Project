name: P2.18 guarded dispatch repair test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-dispatch-repair-test.yml

permissions:
  contents: write

jobs:
  repair-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-p218-dispatch-repair
      P218_EXACT_PARENT: b2d2b642a77a2a6fbfac1adb32e034c2c0b299fd
      P218_OLD_PROCESS_BLOB: b0cd24ebbdc329543f5138c2d26d8a67453b77fd
      P218_OLD_TEST_BLOB: 0390c74a046003cfca71ec1bbb2102624607793f
      ZXUX_REV12_SHA256: a90d523f62a95e8cba6af0312b596a2d5f6bc1aa2ef92f39bb391509b7c15e1b
    steps:
      - name: Checkout exact diagnostic parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard one-shot trigger state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${P218_EXACT_PARENT}"
          test "$(git rev-parse HEAD^:v1/src/kernel/process.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git rev-parse HEAD:v1/src/kernel/process.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git rev-parse HEAD^:v1/tools-host/test-driver/phase2_kill_never_started.py)" = "${P218_OLD_TEST_BLOB}"
          test "$(git rev-parse HEAD:v1/tools-host/test-driver/phase2_kill_never_started.py)" = "${P218_OLD_TEST_BLOB}"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-dispatch-repair-test.yml"
          git status --short

      - name: Apply exact P2.18 caller-gated dispatch repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          process = Path("v1/src/kernel/process.asm")
          text = process.read_text(encoding="utf-8")
          old = "    ZX48_P2_18_KILL_ENABLED EQU 1\n"
          if text.count(old) != 1:
              raise SystemExit("P2.18 process activation shape changed")
          process.write_text(text.replace(old, ""), encoding="utf-8", newline="\n")

          driver = Path("v1/tools-host/test-driver/phase2_kill_never_started.py")
          text = driver.read_text(encoding="utf-8")
          edits = [
              (
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    DEFINE ZX48_P2_18_KILL_ENABLED\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
              ),
              (
                  '"passed": "ZX48_P2_18_KILL_ENABLED EQU 1" in helper and helper_start > core_end,',
                  '"passed": helper_start > core_end and "ZX48_P2_18_KILL_ENABLED" not in helper,',
              ),
              (
                  '[assembler, "--nologo", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
                  '[assembler, "--nologo", "--lst=p218-kill-never-started.lst", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
              ),
              (
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n',
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n        "zx48_process_kill_never_started",\n',
              ),
              (
                  '    fixture = fixture_binary.read_bytes()\n    if action == "test":\n',
                  '    fixture = fixture_binary.read_bytes()\n    dispatch_bytes = b"\\xCA" + _word(symbols["zx48_process_kill_never_started"])\n    dispatch_count = fixture.count(dispatch_bytes)\n    require(dispatch_count == 1, f"P2.18 assembled dispatch must contain exactly one JP Z to never-started helper, got {dispatch_count}")\n    assertions.append({"name": "assembled-fixture-dispatches-to-never-started-helper", "passed": True, "dispatch_bytes": dispatch_bytes.hex()})\n    if action == "test":\n',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit(f"P2.18 driver exact edit shape failed: {old[:72]!r}")
              text = text.replace(old, new)
          driver.write_text(text, encoding="utf-8", newline="\n")
          PY

          expected="$(printf '%s\n' v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py)"
          test "$(git diff --name-only | sort)" = "${expected}"
          ! grep -q '^    ZX48_P2_18_KILL_ENABLED EQU 1$' v1/src/kernel/process.asm
          grep -q '"    DEFINE ZX48_P2_18_KILL_ENABLED\\n"' v1/tools-host/test-driver/phase2_kill_never_started.py
          grep -q 'assembled-fixture-dispatches-to-never-started-helper' v1/tools-host/test-driver/phase2_kill_never_started.py

          cp v1/src/kernel/process.asm /tmp/process-reverse.asm
          cp v1/tools-host/test-driver/phase2_kill_never_started.py /tmp/test-reverse.py
          python3 - <<'PY'
          from pathlib import Path

          process = Path("/tmp/process-reverse.asm")
          text = process.read_text(encoding="utf-8")
          marker = "    MACRO EMIT_KILL_NEVER_STARTED_ROUTINES\n"
          if text.count(marker) != 1:
              raise SystemExit("P2.18 reverse process marker changed")
          process.write_text(text.replace(marker, marker + "    ZX48_P2_18_KILL_ENABLED EQU 1\n"), encoding="utf-8", newline="\n")

          driver = Path("/tmp/test-reverse.py")
          text = driver.read_text(encoding="utf-8")
          edits = [
              (
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    DEFINE ZX48_P2_18_KILL_ENABLED\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
                  '        "    DEVICE ZXSPECTRUM48\\n"\n        "    INCLUDE \\"../include/zx48ux.inc\\"\\n"',
              ),
              (
                  '"passed": helper_start > core_end and "ZX48_P2_18_KILL_ENABLED" not in helper,',
                  '"passed": "ZX48_P2_18_KILL_ENABLED EQU 1" in helper and helper_start > core_end,',
              ),
              (
                  '[assembler, "--nologo", "--lst=p218-kill-never-started.lst", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
                  '[assembler, "--nologo", "--sym=p218-kill-never-started.sym", "p218-kill-never-started.asm"],',
              ),
              (
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n        "zx48_process_kill_never_started",\n',
                  '"zx48_process_reserve_slot", "zx48_handles_init", "zx48_od_create", "zx48_process_kill",\n',
              ),
              (
                  '    fixture = fixture_binary.read_bytes()\n    dispatch_bytes = b"\\xCA" + _word(symbols["zx48_process_kill_never_started"])\n    dispatch_count = fixture.count(dispatch_bytes)\n    require(dispatch_count == 1, f"P2.18 assembled dispatch must contain exactly one JP Z to never-started helper, got {dispatch_count}")\n    assertions.append({"name": "assembled-fixture-dispatches-to-never-started-helper", "passed": True, "dispatch_bytes": dispatch_bytes.hex()})\n    if action == "test":\n',
                  '    fixture = fixture_binary.read_bytes()\n    if action == "test":\n',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1 or text.count(new) != 0:
                  raise SystemExit(f"P2.18 reverse driver shape failed: {old[:72]!r}")
              text = text.replace(old, new)
          driver.write_text(text, encoding="utf-8", newline="\n")
          PY
          test "$(git hash-object /tmp/process-reverse.asm)" = "${P218_OLD_PROCESS_BLOB}"
          test "$(git hash-object /tmp/test-reverse.py)" = "${P218_OLD_TEST_BLOB}"
          git diff --check
          git diff -- v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py

      - name: Three unchanged pre-checkin scans
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          expected="$(printf '%s\n' v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py)"
          for scan in 1 2 3; do
            echo "P2.18 caller-gated dispatch repair SCAN-${scan}"
            test "$(git diff --name-only | sort)" = "${expected}"
            ! grep -q '^    ZX48_P2_18_KILL_ENABLED EQU 1$' v1/src/kernel/process.asm
            grep -q '"    DEFINE ZX48_P2_18_KILL_ENABLED\\n"' v1/tools-host/test-driver/phase2_kill_never_started.py
            grep -q 'assembled-fixture-dispatches-to-never-started-helper' v1/tools-host/test-driver/phase2_kill_never_started.py
            git diff --check
            python3 -m py_compile v1/tools-host/test-driver/phase2_kill_never_started.py
            python3 -m py_compile v1/tools-host/test-driver/p218_failure_probe.py
            python3 -m py_compile v1/tools-host/test-driver/run.py
            find v1/tools-host/test-driver -type d -name __pycache__ -prune -exec rm -rf {} +
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            digest="$(sha256sum v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "scan_${scan}_sha256=${digest}"
          done

      - name: Commit exact candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ZX-UX P2.18 runner"
          git config user.email "tuklusan@users.noreply.github.com"
          git add v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py
          expected="$(printf '%s\n' v1/src/kernel/process.asm v1/tools-host/test-driver/phase2_kill_never_started.py)"
          test "$(git diff --cached --name-only | sort)" = "${expected}"
          git commit -m "P2.18 fix: caller-gate never-started kill dispatch"
          echo "candidate_commit=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Require architecture identity and prior durable evidence
        shell: bash
        run: |
          set -euo pipefail
          architecture_sha256="$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV12.md | awk '{print $1}')"
          test "${architecture_sha256}" = "${ZXUX_REV12_SHA256}"
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/check_phase1_evidence.py --require-active

      - name: Select pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config

      - name: Acquire pinned project runtime
        run: python tools/scripts/bootstrap-environment.py

      - name: Certify pinned project runtime
        run: tools/runtime/python/bin/python tools/scripts/verify-environment.py

      - name: Execute P2.18 build with assembled-dispatch proof
        run: tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step P2.18 --evidence-dir "${ZXUX_EVIDENCE_DIR}"

      - name: Execute P2.18 test
        shell: bash
        run: |
          set +e
          set -o pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step P2.18 --evidence-dir "${ZXUX_EVIDENCE_DIR}" \
            2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.test.log"
          test_rc="${PIPESTATUS[0]}"
          printf '%s\n' "${test_rc}" > "${ZXUX_EVIDENCE_DIR}/P2.18.test.rc"
          if test "${test_rc}" -ne 0; then
            tools/runtime/python/bin/python v1/tools-host/test-driver/p218_failure_probe.py \
              2>&1 | tee "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.log"
            printf '%s\n' "${PIPESTATUS[0]}" > "${ZXUX_EVIDENCE_DIR}/P2.18.failure-probe.rc"
          fi
          exit "${test_rc}"

      - name: Push exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          candidate_commit="$(git rev-parse HEAD)"
          candidate_parent="$(git rev-parse HEAD^)"
          git fetch --no-tags origin main
          remote="$(git rev-parse FETCH_HEAD)"
          echo "candidate_commit=${candidate_commit}"
          echo "candidate_parent=${candidate_parent}"
          echo "remote_main=${remote}"
          test "${remote}" = "${candidate_parent}"
          git push --porcelain origin HEAD:main
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${candidate_commit}"

      - name: Collect P2.18 dispatch-repair evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          for path in v1/build/kernel-p218.sym v1/build/kernel-p218.lst v1/build/p218-kill-never-started.asm v1/build/p218-kill-never-started.sym v1/build/p218-kill-never-started.lst; do
            if test -f "${path}"; then cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"; fi
          done
          git rev-parse HEAD > "${ZXUX_EVIDENCE_DIR}/candidate-commit.txt"
          git status --porcelain > "${ZXUX_EVIDENCE_DIR}/final-status.txt"
          find "${ZXUX_EVIDENCE_DIR}" -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload P2.18 dispatch-repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zxux-p218-dispatch-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-p218-dispatch-repair/
          retention-days: 90
          if-no-files-found: warn
