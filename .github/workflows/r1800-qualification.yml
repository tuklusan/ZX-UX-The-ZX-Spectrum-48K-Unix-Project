name: R18.00 authority qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1800-activation-validation.yml'
      - '.github/workflows/r1800-authority-admission.yml'
      - '.github/workflows/r1800-qualification.yml'
      - 'docs/--W-A-R-N-I-N-G--.md'
      - 'docs/01-ZX-UX-ARCHITECTURE-REV18.md'
      - 'docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV09.md'
      - 'docs/03-ZX-UX-DEVELOPMENT-WORKFLOW.md'
      - 'tools/check_media_retention.py'
      - 'tools/scripts/verify-environment.py'
      - 'v1/tools-host/test-driver/driver_core.py'
      - 'v1/tools-host/test-driver/evidence.py'
      - 'v1/tools-host/test-driver/revision18_bridge.py'
      - 'v1/tools-host/test-driver/run.py'
permissions:
  actions: write
  contents: read
concurrency:
  group: zxux-r1800-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-r1800-qualification
      ZXUX_SOURCE_EPOCH: rev18
      R1800_BASE: 5d375f03743ca2a564b69eb9cf0d5fcb4a0f20b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Guard exact R18 candidate diff and no P12
        run: |
          set -euo pipefail
          git diff --name-only "$R1800_BASE" HEAD | sort > /tmp/changed
          printf '%s\n' \
            .github/workflows/r1800-activation-validation.yml \
            .github/workflows/r1800-authority-admission.yml \
            .github/workflows/r1800-qualification.yml \
            docs/--W-A-R-N-I-N-G--.md \
            docs/01-ZX-UX-ARCHITECTURE-REV18.md \
            docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV09.md \
            docs/03-ZX-UX-DEVELOPMENT-WORKFLOW.md \
            tools/check_media_retention.py \
            tools/scripts/verify-environment.py \
            v1/tools-host/test-driver/driver_core.py \
            v1/tools-host/test-driver/evidence.py \
            v1/tools-host/test-driver/revision18_bridge.py \
            v1/tools-host/test-driver/run.py \
            | sed 's/ \\$//' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git diff --check "$R1800_BASE" HEAD
          test "$(git rev-parse refs/tags/PHASE-11-COMPLETE)" = 263a203da3d54a398e8ac011284ae4195b1279c0
          test ! -e v1/dist/certification/R18.00.result.json
          test -z "$(git ls-files | grep -Ei '(^|/)(P12(\.|/)|p12[^/]*(qualification|activation|dispatch)|phase-?12)' | grep -Ev '^(docs|scratch)/' || true)"
          test -z "$(git status --porcelain)"
      - name: Three unchanged candidate scans
        run: |
          set -euo pipefail
          baseline=""; tree="$(git rev-parse 'HEAD^{tree}')"
          for scan in 1 2 3; do
            python3 -m py_compile v1/tools-host/test-driver/revision18_bridge.py v1/tools-host/test-driver/driver_core.py v1/tools-host/test-driver/evidence.py v1/tools-host/test-driver/run.py tools/scripts/verify-environment.py tools/check_media_retention.py
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            python3 tools/check_media_retention.py
            test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV17.md | awk '{print $1}')" = d12baf0b47a7f8cd2dcd60b82f100ba19f9fddaabad43728a004a07214716bf8
            test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV08.md | awk '{print $1}')" = 97461e9ed12253409b25e6a4a4063cf0ec556a7317f9e4a5938d77edb6a1a14c
            test "$(sha256sum docs/01-ZX-UX-ARCHITECTURE-REV18.md | awk '{print $1}')" = b13c551f854cf3c01d951212916c6cf787f23617e3b8b74fc7c1867f76ba2156
            test "$(sha256sum docs/02-ZX-UX-IMPLEMENTATION-STEPS-REV09.md | awk '{print $1}')" = 9ff614ba04721961b3461d03638586260b91e9e82eac7687054ead1c9802869f
            test "$(git rev-parse refs/tags/PHASE-11-COMPLETE)" = 263a203da3d54a398e8ac011284ae4195b1279c0
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
            test -z "$(git status --porcelain)"
            digest="$(sha256sum $(cat /tmp/expected) | sha256sum | awk '{print $1}')"
            if test -z "$baseline"; then baseline="$digest"; else test "$baseline" = "$digest"; fi
            echo "SCAN-$scan: CLEAN"
          done
      - name: Mandatory authority and historical gates
        run: |
          set -euo pipefail
          python3 tools/check_phase11_evidence.py --require-active
          python3 tools/check_media_retention.py
      - uses: ./.github/actions/setup-zxux-runtime
      - name: Execute R18.00 build and test
        run: |
          set -euo pipefail
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py build --step R18.00
          tools/runtime/python/bin/python v1/tools-host/test-driver/run.py test --step R18.00
          tools/runtime/python/bin/python v1/tools-host/test-driver/evidence.py "$ZXUX_EVIDENCE_DIR/R18.00.result.json"
      - name: Wait for same-head exact-head regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/exact-head-regression.yml/runs?head_sha=$GITHUB_SHA&branch=main&per_page=20" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); rs=[r for r in d["workflow_runs"] if r["head_sha"]==os.environ["GITHUB_SHA"]]; print("" if not rs else rs[0]["status"]+":"+(rs[0]["conclusion"] or ""))')"
            case "$state" in completed:success) echo "exact-head PASS"; exit 0;; completed:*) echo "exact-head failed: $state" >&2; exit 1;; *) sleep 30;; esac
          done
          echo "exact-head did not complete within 15-minute availability tolerance" >&2
          exit 1
      - name: Upload exact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zxux-r1800-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/zxux-r1800-qualification/
          retention-days: 90
          if-no-files-found: error
      - name: Final exact-head check and dispatch admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,urllib.request
          payload=json.dumps({"ref":"main","inputs":{"run_id":os.environ["GITHUB_RUN_ID"],"source_commit":os.environ["GITHUB_SHA"]}}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/r1800-authority-admission.yml/dispatches",data=payload,method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==204
          PY
