name: ZX-UX Phase 0 Certification
on:
  push:
    branches: [main]
    paths:
      - '.github/phase0-certification.trigger'
      - '.github/workflows/phase0-certification.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zxux-phase0-certification
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase0-${{ github.sha }}-${{ github.run_id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13.15', check-latest: false}
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake gettext libaudiofile-dev libfreetype6-dev libgcrypt20-dev libglib2.0-dev libpng-dev libsdl1.2-dev libtool libxml2-dev perl pkg-config
      - run: python tools/scripts/bootstrap-environment.py
      - run: tools/runtime/python/bin/python tools/scripts/verify-environment.py
      - name: Execute complete ordered E0 and Phase 0 set
        run: |
          set -euo pipefail
          py=tools/runtime/python/bin/python
          driver=v1/tools-host/test-driver/run.py
          mkdir -p "$ZXUX_EVIDENCE_DIR/logs"
          progress="$ZXUX_EVIDENCE_DIR/progress.txt"

          run_one() {
            label="$1"
            shift
            stdout="$ZXUX_EVIDENCE_DIR/logs/${label}.stdout.txt"
            stderr="$ZXUX_EVIDENCE_DIR/logs/${label}.stderr.txt"
            set +e
            "$@" > >(tee "$stdout") 2> >(tee "$stderr" >&2)
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$ZXUX_EVIDENCE_DIR/logs/${label}.exit-code.txt"
            if [ "$rc" -ne 0 ]; then
              {
                printf 'label=%s\n' "$label"
                printf 'exit_code=%s\n' "$rc"
                printf 'runner_name=%s\n' "${RUNNER_NAME:-unknown}"
                printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
                printf 'uname=%s\n' "$(uname -a)"
                printf 'python=%s\n' "$("$py" --version 2>&1)"
                if [ -x tools/runtime/sjasmplus/bin/sjasmplus ]; then
                  printf 'sjasmplus=%s\n' "$(tools/runtime/sjasmplus/bin/sjasmplus --version 2>&1 | head -n 1)"
                fi
              } > "$ZXUX_EVIDENCE_DIR/failure.txt"
              if [ -f v1/build/kernel.bin ]; then
                cp v1/build/kernel.bin "$ZXUX_EVIDENCE_DIR/${label}.kernel.bin"
                sha256sum v1/build/kernel.bin > "$ZXUX_EVIDENCE_DIR/${label}.kernel.bin.sha256"
              fi
              return "$rc"
            fi
          }

          for n in 01 02 03 04 05 06; do
            printf 'E0.%s build\n' "$n" > "$progress"
            run_one "E0.${n}.build" "$py" "$driver" build --step "E0.$n"
            printf 'E0.%s test\n' "$n" > "$progress"
            run_one "E0.${n}.test" "$py" "$driver" test --step "E0.$n"
          done
          for n in $(seq -w 1 34); do
            printf 'P0.%s build\n' "$n" > "$progress"
            run_one "P0.${n}.build" "$py" "$driver" build --step "P0.$n"
            printf 'P0.%s test\n' "$n" > "$progress"
            run_one "P0.${n}.test" "$py" "$driver" test --step "P0.$n"
          done
          printf 'finalize\n' > "$progress"
          "$py" tools/finalize_phase0_evidence.py --root "$GITHUB_WORKSPACE" --evidence-dir "$ZXUX_EVIDENCE_DIR"
      - name: Assert source still clean and current
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install durable evidence unchanged
        run: |
          find v1/dist/certification -maxdepth 1 -type f -name '*.json' -delete
          cp "$ZXUX_EVIDENCE_DIR"/*.json v1/dist/certification/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          src=Path(os.environ['ZXUX_EVIDENCE_DIR']); dst=Path('v1/dist/certification')
          for p in src.glob('*.json'): assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256((dst/p.name).read_bytes()).digest()
          print('ZX-UX EVIDENCE COPY IDENTITY PASS')
          PY
      - name: Commit evidence only
        run: |
          bad="$(git diff --name-only | grep -v '^v1/dist/certification/' || true)"; test -z "$bad"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1/dist/certification/*.json
          git commit -m "R&R-06 activate Phase-0 certification evidence for $GITHUB_SHA"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zxux-phase0-${{ github.sha }}
          path: /tmp/zxux-phase0-${{ github.sha }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
