name: ZX-UX Phase 0 Certification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-phase0-certification
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZXUX_EVIDENCE_DIR: /tmp/zxux-phase0-${{ github.sha }}-${{ github.run_id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Restore or build certified ZX-UX runtime
        uses: ./.github/actions/setup-zxux-runtime
      - name: Execute complete ordered E0 and Phase 0 set
        run: |
          set -euo pipefail
          py=tools/runtime/python/bin/python
          driver=v1/tools-host/test-driver/run.py
          mkdir -p "$ZXUX_EVIDENCE_DIR/logs"
          progress="$ZXUX_EVIDENCE_DIR/progress.txt"

          run_one() {
            label="$1"
            shift
            stdout="$ZXUX_EVIDENCE_DIR/logs/${label}.stdout.txt"
            stderr="$ZXUX_EVIDENCE_DIR/logs/${label}.stderr.txt"
            set +e
            "$@" > >(tee "$stdout") 2> >(tee "$stderr" >&2)
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$ZXUX_EVIDENCE_DIR/logs/${label}.exit-code.txt"
            if [ "$rc" -ne 0 ]; then
              {
                printf 'label=%s\n' "$label"
                printf 'exit_code=%s\n' "$rc"
                printf 'runner_name=%s\n' "${RUNNER_NAME:-unknown}"
                printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
                printf 'uname=%s\n' "$(uname -a)"
                printf 'python=%s\n' "$("$py" --version 2>&1)"
                if [ -x tools/runtime/sjasmplus/bin/sjasmplus ]; then
                  printf 'sjasmplus=%s\n' "$(tools/runtime/sjasmplus/bin/sjasmplus --version 2>&1 | head -n 1)"
                fi
              } > "$ZXUX_EVIDENCE_DIR/failure.txt"
              if [ -f v1/build/kernel.bin ]; then
                cp v1/build/kernel.bin "$ZXUX_EVIDENCE_DIR/${label}.kernel.bin"
                sha256sum v1/build/kernel.bin > "$ZXUX_EVIDENCE_DIR/${label}.kernel.bin.sha256"
              fi
              return "$rc"
            fi
          }

          for n in 01 02 03 04 05 06; do
            printf 'E0.%s build\n' "$n" > "$progress"
            run_one "E0.${n}.build" "$py" "$driver" build --step "E0.$n"
            printf 'E0.%s test\n' "$n" > "$progress"
            run_one "E0.${n}.test" "$py" "$driver" test --step "E0.$n"
          done
          for n in $(seq -w 1 34); do
            printf 'P0.%s build\n' "$n" > "$progress"
            run_one "P0.${n}.build" "$py" "$driver" build --step "P0.$n"
            printf 'P0.%s test\n' "$n" > "$progress"
            run_one "P0.${n}.test" "$py" "$driver" test --step "P0.$n"
          done
          printf 'finalize\n' > "$progress"
          "$py" tools/finalize_phase0_evidence.py --root "$GITHUB_WORKSPACE" --evidence-dir "$ZXUX_EVIDENCE_DIR"

          # REV12 activation is not complete until the previously admitted core
          # is revalidated in exact order against the new architecture identity.
          for n in $(seq -w 1 12); do
            printf 'P1.%s revalidation build\n' "$n" > "$progress"
            run_one "P1.${n}.build" "$py" "$driver" build --step "P1.$n"
            printf 'P1.%s revalidation test\n' "$n" > "$progress"
            run_one "P1.${n}.test" "$py" "$driver" test --step "P1.$n"
          done
      - name: Revalidate immutable admitted Phase 0 and Phase 1 evidence
        run: |
          python3 tools/check_phase0_evidence.py --require-active
          python3 tools/test_phase0_evidence_negative.py
          python3 tools/check_phase1_evidence.py --require-active
          python3 tools/test_phase1_evidence_negative.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: zxux-phase0-${{ github.sha }}
          path: /tmp/zxux-phase0-${{ github.sha }}-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
