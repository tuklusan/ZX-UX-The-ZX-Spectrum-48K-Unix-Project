name: P2.18 post-test residue cleanup patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p218-cleanup-admission-fix.yml

permissions:
  contents: write

jobs:
  patch-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact patch trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard and validate patch trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^:.github/workflows/p218-sentinel-geometry-fix.yml)" = "028f454f8194c1bb8aa00cc6afe2940d4dfa4c4d"
          test "$(git rev-parse HEAD:.github/workflows/p218-sentinel-geometry-fix.yml)" = "028f454f8194c1bb8aa00cc6afe2940d4dfa4c4d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-cleanup-admission-fix.yml"
          test -z "$(git status --porcelain)"
          ./tools/check_license_headers.sh
          ./tools/check_project_policy.py

      - name: Patch exact P2.18 post-test cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path(".github/workflows/p218-sentinel-geometry-fix.yml")
          text = path.read_text(encoding="utf-8")
          trigger = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          edits = (
              (
                  "      P218_EXACT_PARENT: 8b84534132981b7cc5b689c90589ab07cedf68bf\n",
                  f"      P218_EXACT_PARENT: {trigger}\n",
              ),
              (
                  '          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p218-sentinel-geometry-fix.yml"\n',
                  '          test "$(git diff --name-only HEAD^ HEAD)" = $\'.github/workflows/p218-cleanup-admission-fix.yml\\n.github/workflows/p218-sentinel-geometry-fix.yml\'\n',
              ),
          )
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f"P2.18 cleanup patch anchor count failed: {old!r}")
              text = text.replace(old, new)

          anchor = "      - name: Recheck mandatory gates on exact tested candidate\n"
          cleanup = '''      - name: Preserve evidence and remove transient runtime/build residue
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ZXUX_EVIDENCE_DIR}/build"
          for path in v1/build/kernel-p218.sym v1/build/kernel-p218.lst v1/build/p218-kill-never-started.asm v1/build/p218-kill-never-started.sym v1/build/p218-kill-never-started.lst; do
            if test -f "${path}"; then cp "${path}" "${ZXUX_EVIDENCE_DIR}/build/"; fi
          done
          git clean -fdx -- tools/runtime v1/build
          test ! -e tools/runtime
          test ! -e v1/build
          test -z "$(git status --porcelain)"

'''
          if text.count(anchor) != 1 or cleanup in text:
              raise SystemExit("P2.18 cleanup insertion anchor failed")
          text = text.replace(anchor, cleanup + anchor)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git add .github/workflows/p218-sentinel-geometry-fix.yml
          git rm .github/workflows/p218-cleanup-admission-fix.yml
          test "$(git diff --cached --name-only)" = $'.github/workflows/p218-cleanup-admission-fix.yml\n.github/workflows/p218-sentinel-geometry-fix.yml'
          git diff --cached --check
          test -z "$(git diff --name-only)"

      - name: Three clean patch scans and mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          baseline=""
          for scan in 1 2 3; do
            git diff --cached --check
            test -z "$(git diff --name-only)"
            ./tools/check_license_headers.sh
            ./tools/check_project_policy.py
            digest="$(git diff --cached --binary | sha256sum | awk '{print $1}')"
            if test -z "${baseline}"; then baseline="${digest}"; else test "${digest}" = "${baseline}"; fi
            echo "SCAN-${scan}: CLEAN"
            echo "scan_${scan}_candidate_sha256=${digest}"
          done

      - name: Commit and push exact cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD)"
          git config user.name "ZX-UX P2.18 repair runner"
          git config user.email "tuklusan@users.noreply.github.com"
          git commit -m "P2.18 instrumentation: clean transient runtime before gate recheck"
          candidate="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${parent}"
          git push --porcelain origin HEAD:main
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${candidate}"
