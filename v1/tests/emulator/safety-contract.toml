schema = 1

[static]
duplicate_symbols = true
section_overflow = true
kernel_subranges = true
im2_vector_and_trampoline = true
kernel_stack_placement = true
arena_boundaries = true
syscall_table_duplication = true
forbidden_user_register_ownership = true
object_format_sizes = true

[emulator]
fast_inner_format = "SNA"
boot_format = "TAP"
tape_format = "TZX"
state_assertions = true
screenshot_only_oracle = false
known_writable_stack_before_synthetic_rom_call = true
hard_timeout_seconds = 30

[release]
independent_emulators_minimum = 2

[physical]
trap_only_counts_as_physical = false
tap_tzx_counts_as_physical = false
requires_real_or_hardware_faithful_loop = true
