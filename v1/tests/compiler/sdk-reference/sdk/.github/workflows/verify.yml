name: C48 SDK verification

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run complete C48 SDK verifier
        run: python -B compiler/verify_release.py

      - name: Smoke-test Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          c48.bat --version
          c48run.bat --version

      - name: Smoke-test POSIX launchers
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./c48 --version
          ./c48run --version
